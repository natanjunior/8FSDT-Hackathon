# =============================================================================
#  Ambiente local — E7 do enunciado
#
#  A `arquitetura.md` (§9) define o ambiente local como *"Docker: aplicação +
#  Supabase CLI (Postgres, Auth, Storage)"*, e é literalmente isso: **este
#  arquivo sobe a aplicação; o Supabase CLI sobe os serviços de apoio** — que
#  também são containers, gerenciados por ele.
#
#  A divisão não é acidental. Reimplementar Postgres e o servidor de
#  autenticação aqui produziria um ambiente local que **não é** o de produção:
#  em produção quem serve o Auth é o Supabase, e um Auth diferente no local é
#  exatamente o "roda na minha máquina" que esta tarefa existe para não
#  produzir.
#
#  ---------------------------------------------------------------------------
#   Como subir, do zero
#  ---------------------------------------------------------------------------
#
#    npm run local                       # faz tudo: provedor, .env.local,
#                                        # migrações, storage e a aplicação
#
#  Depois: http://host.docker.internal:3000 — e o host **importa**, não é
#  preferência: o `@supabase/ssr` deriva o nome do cookie de sessão do host,
#  então abrir por `localhost` produz uma sessão que a aplicação não relê.
#
#  Os quatro comandos que este arquivo listava aqui até 30/08/2026 (`supabase
#  start`, `db reset`, `cp .env.example .env.local`, `docker compose up`) saíram:
#  eles descreviam o caminho de antes do `ferramentas/ambiente-local.mjs`, e o
#  `db reset` **apaga o banco local** — instrução errada para uma segunda subida.
#
#  O procedimento completo, com o que conferir a cada passo, está no README.
# =============================================================================

# **Nome de projeto explícito, e não o derivado da pasta.** Sem esta linha o
# Compose nomeia o projeto pelo diretório — aqui, `8fsdt-hackathon` —, o que
# produzia dois grupos de significado obscuro no Docker Desktop: este, e o
# `resolve-ai` que a **CLI do Supabase** cria com o `project_id` do
# `supabase/config.toml`. São ferramentas diferentes, e agora dizem qual é qual.
#
# O nome **não** pode ser `resolve-ai`: colidiria com o do Supabase, e um
# `docker compose down --remove-orphans` passaria a considerar Postgres e Auth
# containers órfãos deste arquivo — e os removeria.
name: resolve-ai-local

services:
  aplicacao:
    build:
      context: .
      # **Sem `args`.** A imagem não recebe configuração em tempo de build
      # (ADR-0004: ela é pública). Se um dia aparecer um `args` aqui, é
      # regressão — não conveniência.
      dockerfile: Dockerfile
    image: resolve-ai:local
    container_name: resolve-ai

    # **`no`, e não `unless-stopped`.** Ver o bloco do `azurite` abaixo: a
    # política de reinício ressuscita o container pelo daemon, fora do Compose,
    # e o mapeamento de porta pode não voltar com ele. Este é um arquivo de
    # ambiente **local** — quem quer o ambiente de pé roda `npm run local`.
    restart: "no"

    ports:
      - "3000:3000"

    # As variáveis da aplicação chegam em tempo de execução, do arquivo que o git
    # ignora. Nenhuma delas está na imagem.
    env_file:
      - .env.local

    # **Só `NODE_ENV` aqui, e a razão custou depuração de verdade.**
    #
    # `environment:` tem precedência sobre `env_file:` no Compose. A primeira
    # versão deste arquivo trazia `SUPABASE_URL` e `BANCO_URL` aqui, com um
    # `${VAR:-padrão}` "para ajudar" — e o padrão **sobrescreveu em silêncio** o
    # valor do `.env.local`, porque a interpolação lê o ambiente do shell (ou o
    # `.env` do Compose), nunca o `env_file`. O container subiu **saudável**,
    # servindo `/entrar` com `200`, apontando para uma porta que não existia
    # mais; a falha só apareceu na primeira requisição que precisava do
    # provedor — e apareceu como `401`, que é indistinguível de credencial
    # errada.
    #
    # Regra que fica: **as variáveis da aplicação vivem em um lugar só.**
    environment:
      NODE_ENV: production

    # Dentro do container, `127.0.0.1` é o próprio container — não a máquina. O
    # `.env.local` aponta para `host.docker.internal`, e este mapeamento o torna
    # resolvível também em Linux, onde ele não existe nativamente.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # O mesmo `/entrar` do HEALTHCHECK da imagem — declarado aqui só para que
    # `docker compose ps` mostre o estado sem precisar inspecionar a imagem.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/entrar').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------------
  #  Azurite — o storage local
  #
  #  **A ADR-0004 escolheu Azure Blob Storage, e o local fala a API real.** A
  #  alternativa era um adaptador falso servido pela própria aplicação, e ela
  #  faria a API LOCAL RECEBER OS BYTES — exatamente o que a §10.1 do contrato
  #  proíbe em produção, no ponto único em que a decisão se importou. O caminho
  #  exercitado aqui é o mesmo que vai à nuvem: SAS assinada, PUT direto.
  #
  #  **A ressalva, declarada:** o Azurite não tem motor de regra de ciclo de
  #  vida. A faxina do objeto pendente é CONFIGURAÇÃO DE INFRAESTRUTURA, não
  #  código — não é conferível localmente em desenho nenhum, nem apontando para
  #  o Azure de verdade, cuja granularidade é de dias.
  #
  #  As credenciais são as públicas e fixas do emulador. Elas podem estar no
  #  `.env.example` porque não são segredo de ninguém — é o que preserva o
  #  "clone limpo, sem passo manual" do critério 39.1.
  # ---------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: resolve-ai-azurite

    # ---------------------------------------------------------------------
    #  **`no`, e a razão custou uma manhã (30/08/2026).**
    #
    #  Com `unless-stopped`, o container é reiniciado **pelo daemon**, fora do
    #  Compose. Numa dessas voltas ele subiu SEM o mapeamento de porta, e o
    #  estado ficou assim:
    #
    #      HostConfig.PortBindings   {"10000/tcp":[{"HostPort":"10000"}]}   ← pedido
    #      NetworkSettings.Ports     {"10000/tcp":[]}                       ← entregue
    #
    #  O `docker compose ps` mostrava `Healthy`, o `docker port` devolvia
    #  vazio, e `npm run local` morria com `ECONNREFUSED` dez quadros abaixo,
    #  dentro do SDK do Azure. Recriar o container resolveu; a política some
    #  para que o estado não possa ser reencontrado em silêncio.
    # ---------------------------------------------------------------------
    restart: "no"

    command: azurite-blob --blobHost 0.0.0.0 --location /dados --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-dados:/dados

    # **Este healthcheck prova pouco, e é bom saber o quê.** O Compose roda o
    # teste DENTRO do container, então ele responde "o Azurite subiu?" — nunca
    # "o host alcança o Azurite?". No incidente acima ele ficou verde com a
    # porta sem binding. Quem responde a segunda pergunta é o `ambiente-local.mjs`,
    # que sonda `127.0.0.1:10000` **do host** depois do `up`. Um não substitui
    # o outro: este pega Azurite que não iniciou, aquele pega porta que não saiu.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/devstoreaccount1?comp=list').then(()=>process.exit(0)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  azurite-dados:

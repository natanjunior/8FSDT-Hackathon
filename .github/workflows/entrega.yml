# =============================================================================
#  A esteira de entrega — arquitetura.md §9
#
#    merge em main → verifica → migra o banco → constrói a imagem →
#    publica no ghcr.io → Container Apps cria uma revisão nova
#
#  **A ordem entre migrar e publicar não é estética.** O rollback da aplicação é
#  imediato (reativar a revisão anterior e reapontar o tráfego, sem rebuild); o do
#  banco não é. Então a ordem segura é **migração compatível primeiro, código
#  depois** — e o passo de migração falhando interrompe a cadeia, que é o
#  comportamento desejado: *código novo sobre esquema velho é o modo de falha
#  que a ordem existe para evitar*.
#
#  Quem aplica a migração é **o próprio workflow**. A alternativa era comando
#  manual antes do merge, recusada pelo mesmo motivo das ADR-0001 e 0003: com
#  ela, a ordem segura passa a depender de alguém lembrar.
# =============================================================================

name: entrega

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez. Sem isso, dois merges próximos podem migrar o banco em
# ordem e publicar fora de ordem.
concurrency:
  group: entrega-${{ github.ref }}
  cancel-in-progress: false

# **Não há `env: IMAGEM` aqui, e a ausência é deliberada.** O nome da imagem tem
# de estar em minúsculas: `github.repository` devolve a caixa original do
# repositório — `natanjunior/8FSDT-Hackathon` — e a referência de imagem Docker
# não aceita maiúscula no caminho. As expressões do Actions não têm função de
# minúsculas, então a conversão só existe em shell, e o nome nasce no passo
# `etiquetas` do job `publicar`.

jobs:
  # ---------------------------------------------------------------------------
  # 1 · Verificar. Roda em push E em pull request: falha bloqueia merge
  #     (arquitetura.md §7).
  # ---------------------------------------------------------------------------
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # **Postgres nu, e não a pilha inteira do provedor.** O que o teste do
      # critério A4 mede é a consulta que vai ao banco, não o servidor de
      # autenticação — e subir a pilha do provedor custaria mais de um minuto
      # em toda execução, num pipeline que vai ser pago dezenas de vezes nas
      # próximas cinco semanas. O `auth.users` de que a FK depende vem do shim
      # declarado em `testes/integracao/esquema-de-auth.sql`, cujo risco está
      # escrito lá — e que a migração de produção, no job seguinte, fecha.
      banco:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resolveai_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --- Qualidade do código (DoD) -------------------------------------
      - name: lint — as regras de fronteira da ADR-0006
        run: npm run lint

      - name: verificação de tipos
        run: npm run tipos

      # --- Testes (DoD) --------------------------------------------------
      # **Um passo só, e a fusão é o que impede a suíte de rodar duas vezes.**
      # O `npm run cobertura` é `vitest run --coverage` sem `--project`: roda o
      # `unitario` e o `integracao` numa execução, instrumentada. Manter os dois
      # passos antigos e acrescentar a cobertura depois pagaria cada teste duas
      # vezes; instrumentar cada passo em separado exigiria fundir dois
      # relatórios. O que se perde é o nome do projeto no título do passo, e ele
      # continua na saída do Vitest, linha a linha.
      #
      # **Cobertura é relatório, nunca portão.** O piso não existe aqui nem no
      # `vitest.config.mts`, pela razão escrita lá (ADR-0008): um limiar que o
      # projeto não alcança deixa o build vermelho por uma métrica que ninguém
      # pediu. O passo falha quando um teste falha, e só então.
      #
      # Os três `--coverage.reporter` substituem a lista do arquivo de
      # configuração só aqui: o `html` é o relatório navegável do artefato, e o
      # laço local continua sem pagá-lo.
      - name: teste unitário e de integração, com cobertura — critério A4 incluído
        run: >-
          npm run cobertura --
          --coverage.reporter=text-summary
          --coverage.reporter=json-summary
          --coverage.reporter=html
        env:
          BANCO_URL_TESTE: postgresql://postgres:postgres@127.0.0.1:5432/resolveai_teste

      # A tabela vai para o sumário do emprego, legível sem baixar nada. Roda
      # também quando um teste falhou, desde que o Vitest tenha escrito o
      # resumo; sem ele, diz que não há número em vez de morrer calado.
      - name: cobertura no sumário do emprego
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";
          import { relative } from "node:path";

          const arquivo = ".cobertura/coverage-summary.json";
          if (!existsSync(arquivo)) {
            console.log("## Cobertura\n\nO Vitest não escreveu o resumo: a execução parou antes do relatório.");
            process.exit(0);
          }
          const resumo = JSON.parse(readFileSync(arquivo, "utf8"));
          const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
          const linha = (nome, m) =>
            `| ${nome} | ${pct(m.lines)} | ${pct(m.statements)} | ${pct(m.functions)} | ${pct(m.branches)} |`;
          const cabecalho = "| Arquivo | Linhas | Instruções | Funções | Ramos |\n|---|--:|--:|--:|--:|";

          const { total, ...porArquivo } = resumo;
          const arquivos = Object.entries(porArquivo)
            .map(([caminho, m]) => [relative(process.cwd(), caminho).replaceAll("\\", "/"), m])
            .sort(([a], [b]) => a.localeCompare(b));

          console.log("## Cobertura\n");
          console.log("Medição, não portão: nenhum piso faz este emprego falhar.\n");
          console.log(cabecalho);
          console.log(linha("**Total**", total));
          console.log(`\n<details><summary>Por arquivo (${arquivos.length})</summary>\n`);
          console.log(cabecalho);
          for (const [caminho, m] of arquivos) console.log(linha(`\`${caminho}\``, m));
          console.log("\n</details>");
          JS

      - name: relatório de cobertura como artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: .cobertura/
          if-no-files-found: warn
          retention-days: 14

      # --- Documentação (DoD) --------------------------------------------
      # Os três verificadores. Falham o build: a §15 do contrato e o DoD
      # dependem deles.
      - name: verificador de diagrama — com controle diferencial
        run: npm run verificar:mermaid

      - name: verificador de contrato — as três regras mecânicas da §15
        run: npm run verificar:openapi

      - name: verificador de links e referências
        run: npm run verificar:referencias

      # O portão de estilo mede as peças do catálogo no Chromium (item 44q). O job não instalava
      # navegador; o `--with-deps` traz as bibliotecas de sistema que o Ubuntu do runner não tem.
      - name: navegador do portão de estilo
        run: npx playwright install --with-deps chromium

      - name: verificador de estilo — as peças contra a prancheta, com controle diferencial
        run: npm run verificar:estilo

      # --- E o build tem de passar antes de valer a pena construir imagem --
      - name: build
        run: npm run build

      # --- A documentação como o leitor a recebe ------------------------
      # Os verificadores acima leem os arquivos; este lê as páginas montadas.
      # Os arquivos já passaram em tudo enquanto o site tinha link quebrado e
      # diagrama como código, então a conferência tem de ser das páginas.
      #
      # As duas variáveis são fictícias: só a raiz do produto as lê, e sem
      # sessão ela redireciona para `/entrar` sem chamar o provedor.
      - name: verificador do site — as páginas montadas, antes da imagem
        env:
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_CHAVE_ANONIMA: ficticia
        run: |
          npx next start -p 3000 &
          for tentativa in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:3000/documentacao/README" && break
            sleep 2
          done
          npm run verificar:site -- http://127.0.0.1:3000

  # ---------------------------------------------------------------------------
  # 1b · O compose num runner limpo. **Critério 5 do item 39, e é o verificador
  #      do A6.** O que ele prova não é que a imagem sobe: é que ela sobe **do
  #      zero, sem nada da máquina de quem implementou** — e prova a cada push,
  #      em vez de valer para o commit em que alguém olhou.
  #
  #      **Alcance e custo, porque este é o emprego mais caro do arquivo.** Ele
  #      roda em push E em pull request, e paga o preço inteiro nas duas — pilha
  #      do Supabase mais construção da imagem num runner sem cache. Em push ele
  #      barra estruturalmente, porque `migrar` declara `needs: [verificar,
  #      compose]`. **Em pull request quem o torna obrigatório é a proteção de
  #      branch, não este arquivo** — sem ela, `migrar` já é pulado e não há o
  #      que barrar.
  # ---------------------------------------------------------------------------
  compose:
    name: Subir o compose, do zero
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # **Este `npm ci` não existia, e a razão de ele passar a existir está no
      # comentário abaixo.** O emprego foi escrito sem instalação de propósito:
      # `ambiente-local.mjs` não tinha dependência nenhuma. O item 13a lhe deu
      # uma — `ferramentas/azurite.mjs` importa `@azure/storage-blob` para criar
      # o contêiner e configurar CORS no emulador. Sem `node_modules`, o script
      # morre em `ERR_MODULE_NOT_FOUND` e leva o emprego junto.
      #
      # **O que o emprego continua provando não muda:** as dependências da
      # APLICAÇÃO seguem vindo do Dockerfile, instaladas pelo
      # `docker compose up --build`. Isto aqui é só o que o script do HOST
      # precisa.
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # **Pinada, e não `latest`.** Os nomes que o `ambiente-local.mjs` lê
          # do `supabase status -o env` — `API_URL`, `DB_URL`,
          # `PUBLISHABLE_KEY` — foram conferidos nesta versão. Com `latest`, um
          # release de terceiro renomeando qualquer um deles quebra a esteira
          # num dia em que ninguém tocou no repositório.
          version: 2.101.0

      # **Login antes de baixar imagem, e a razão foi medida.** Em 23/09/2026
      # este emprego morreu em `toomanyrequests` do ghcr.io sem ninguém ter
      # tocado no repositório: quem baixa como anônimo divide a cota com o IP do
      # runner, que é público e compartilhado. O emprego "Publicar a imagem" já
      # autentica assim desde sempre; aqui faltava, e a esteira inteira parou —
      # `migrar`, `publicar` e `implantar` declaram `needs` que passam por aqui.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só o que a aplicação usa: banco, autenticação e o gateway que a serve.
      # Estúdio, storage, realtime e o resto são minutos de download que nada
      # aqui exercita. `auth` não é excluível, e é justamente o que queremos.
      #
      # **Os nomes são os da CLI, e errar um só rende um aviso.** Até 23/09/2026
      # esta linha pedia `inbucket`, `storage`, `analytics`, `functions` e
      # `meta`: cinco nomes que a 2.101.0 não conhece. Ela imprime um WARNING no
      # meio de mil linhas de download e sobe os contêineres assim mesmo, então
      # `mailpit` e `postgres-meta` desciam a cada execução, à toa. Os outros
      # três não custavam nada porque `supabase/config.toml` já os desliga.
      - name: Postgres e Auth locais
        run: supabase start -x studio,imgproxy,realtime,storage-api,logflare,vector,edge-runtime,postgres-meta,mailpit

      # **O mesmo comando que o README manda rodar.** O `npm ci` acima serve
      # **só** ao `ferramentas/azurite.mjs`; as dependências da aplicação
      # continuam vindo do Dockerfile, que é justamente o que se quer provar.
      - name: npm run local, desanexado
        run: npm run local -- --desanexado

      - name: bater na aplicação por HTTP
        run: |
          tela=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/entrar)
          api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/contexto)
          echo "tela /entrar       → $tela (esperado 200)"
          echo "API  /api/contexto → $api (esperado 401, porque não há sessão)"
          [ "$tela" = "200" ] || { echo "::error::A tela não respondeu 200."; exit 1; }
          [ "$api" = "401" ]  || { echo "::error::A API não respondeu 401 sem sessão."; exit 1; }

          # As duas sondas acima não provam que o container alcança o provedor:
          # `auth.getUser()` sem cookie devolve `AuthSessionMissingError` sem
          # nenhuma chamada de rede, e `/entrar` não toca o banco (Dockerfile).
          # Um container que não resolve coisa nenhuma passaria nas duas do
          # mesmo jeito — e é o modo de falha mais provável na primeira
          # execução real: no Linux, `host-gateway` resolve para `172.17.0.1`,
          # que só alcança porta publicada em `0.0.0.0`, ao contrário do Docker
          # Desktop de quem implementou. Esta sonda roda de dentro do
          # container e prova a rede de verdade, não só a lógica local.
          docker compose exec -T aplicacao node -e "fetch(process.env.SUPABASE_URL+'/auth/v1/health').then(r=>{console.log('provedor alcançável →',r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error('::error::O container não alcança o provedor:',e.message);process.exit(1)})"

      # Sem isto, um compose que sobe e morre aparece como uma linha de curl com
      # o número errado, e a causa fica dentro do container que já foi embora.
      #
      # **A guarda existe porque este passo já foi a segunda vítima.** O
      # `docker-compose.yml` declara `env_file: .env.local`, e quem gera esse
      # arquivo é o `npm run local`. Numa falha anterior a ele o Compose recusa
      # até o `logs`, e o passo que serve para explicar morre sem imprimir linha.
      - name: os logs, quando algo falha
        if: failure()
        run: |
          [ -f .env.local ] || { echo "Sem .env.local: a pilha não chegou a subir, a falha é anterior ao compose."; exit 0; }
          docker compose logs --no-color --tail 200

  # ---------------------------------------------------------------------------
  # 1c · O Auth publicado. **A esteira publica migração e imagem; a
  #      configuração de Auth do projeto hospedado não é publicada por nada
  #      disto, e nunca foi.** O bloco `[auth]` de `supabase/config.toml`
  #      governa só a pilha local — quem o lê é a CLI. Em 31/08/2026 isso
  #      apareceu como `http://localhost:3000/?code=…` no navegador de quem
  #      tentou usar o produto em produção: a *Site URL* da nuvem seguia no
  #      padrão de fábrica.
  #
  #      **Por que é emprego e não passo dentro do `migrar`.** O portão precisa
  #      de um X vermelho com **nome próprio**. Enterrado no "Migrar o banco", a
  #      falha lê-se como problema de migração e a causa aparente é a errada —
  #      o mesmo modo de falha que este arquivo já combate por escrito em outros
  #      três lugares.
  #
  #      **Ele apenas LÊ.** `supabase config push` publicaria o `config.toml`
  #      inteiro, e este arquivo declara portas locais, `major_version`,
  #      `[storage]`, `[inbucket]`, `[studio]` — vinte e tantas afirmações sobre
  #      a máquina de quem desenvolve. Além disso `site_url` e
  #      `additional_redirect_urls` **têm** de divergir entre os ambientes. E
  #      `config push` não falha na divergência: ele a **apaga**. Vermelho é
  #      informação.
  #
  #      **Num fork, sem os segredos, ele falha em `exit 2`** — e leva a entrega
  #      junto, porque `migrar` depende dele. O repositório tem um implementador
  #      e os PRs saem dele mesmo; o custo está aceito, e está escrito aqui para
  #      não ser redescoberto.
  # ---------------------------------------------------------------------------
  auth:
    name: Conferir o Auth publicado
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # **Sem `npm ci`, de propósito:** o verificador só usa builtins do Node.
      # **Sem `needs`:** ele não depende de `verificar` nem de `compose`, e
      # correndo em paralelo dá o vermelho mais cedo. **Sem
      # `if: github.event_name != 'pull_request'`:** pegar a divergência no PR é
      # estritamente melhor que pegá-la depois do merge.
      - name: a configuração publicada bate com a declarada
        env:
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run verificar:auth

  # ---------------------------------------------------------------------------
  # 2 · Migrar. **Antes do deploy, e antes até de construir a imagem.**
  #
  #     **`auth` no `needs` barra a entrega INTEIRA, e é deliberado.** Como
  #     `publicar` depende de `migrar` e `implantar` de `publicar`, um Auth
  #     divergente para também as mudanças que não têm nada a ver com
  #     autenticação. Portão que não barra é portão que ninguém olha, e foi
  #     exatamente isso que produziu o lote 10. A saída de emergência não é
  #     apagar o portão: é a válvula `DIVERGENCIAS` do
  #     `ferramentas/verificadores/auth-publicado.mjs`, que exige razão escrita,
  #     aparece no diff e imprime em toda execução.
  # ---------------------------------------------------------------------------
  migrar:
    name: Migrar o banco
    needs: [verificar, compose, auth]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          # **Pinada, e não `latest`.** Os nomes que o `ambiente-local.mjs` lê
          # do `supabase status -o env` — `API_URL`, `DB_URL`,
          # `PUBLISHABLE_KEY` — foram conferidos nesta versão. Com `latest`, um
          # release de terceiro renomeando qualquer um deles quebra a esteira
          # num dia em que ninguém tocou no repositório.
          version: 2.101.0

      - name: aplicar as migrações versionadas
        # A migração é aplicada **ao projeto Supabase de verdade**, com o
        # `auth.users` de verdade. É isto que fecha o risco do shim do job
        # anterior: se a migração mentir contra a tabela do provedor, a esteira
        # para aqui, antes de qualquer deploy.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push --yes

  # ---------------------------------------------------------------------------
  # 3 · Construir e publicar a imagem no ghcr.io.
  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar a imagem
    needs: migrar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # O `GITHUB_TOKEN` do Actions já autentica no ghcr.io — sem recurso nem
      # segredo novo. Foi um dos argumentos que recusaram o ACR (ADR-0004).
      packages: write

    outputs:
      etiqueta: ${{ steps.etiquetas.outputs.etiqueta }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: etiquetas
        # A etiqueta é o SHA do commit, não `latest`: é o que faz cada revisão
        # do Container Apps apontar para um artefato identificável, e é o que
        # torna o rollback uma escolha de revisão em vez de um rebuild.
        #
        # `${GITHUB_REPOSITORY,,}` é a expansão do bash para minúsculas, e ela
        # não é estética: sem ela o buildx recusa a etiqueta antes de publicar,
        # com `invalid tag … repository name must be lowercase`.
        run: |
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "etiqueta=$IMAGEM:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "movel=$IMAGEM:main"                 >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # **Construir sem publicar, e carregar no daemon local.** É o que permite
      # conferir a imagem ANTES de ela existir para o mundo — a imagem é pública
      # (ADR-0004), e imagem publicada com segredo dentro não se desfaz.
      - name: construir a imagem para conferência
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: resolve-ai:conferencia
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verificador de imagem — nenhum segredo assado
        run: npm run verificar:imagem -- resolve-ai:conferencia

      - name: construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Sem `build-args`. A imagem não recebe configuração em tempo de
          # build, e ela é pública (ADR-0004).
          tags: |
            ${{ steps.etiquetas.outputs.etiqueta }}
            ${{ steps.etiquetas.outputs.movel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4 · Publicar a revisão no Azure Container Apps.
  # ---------------------------------------------------------------------------
  implantar:
    name: Implantar no Container Apps
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # **OIDC federado, e o `environment` logo abaixo é a âncora dele.** O token
    # só é emitido para um job que declare este environment.
    #
    # O *subject* que casa é o **formato imutável** — com os IDs numéricos do
    # dono e do repositório, que o GitHub emite para o vínculo sobreviver a
    # renomeações. O nomeado está registrado como segunda credencial, como rede.
    # Escrever só o nomeado dá `AADSTS700213`, que não diz nada disso
    # (`docs/arquitetura.md` §9).
    #
    # Declarar `permissions` no job substitui o padrão inteiro, então
    # `contents: read` precisa estar aqui mesmo sem ser novidade.
    permissions:
      id-token: write
      contents: read

    environment:
      name: producao
      url: ${{ steps.endereco.outputs.url }}

    steps:
      # **O clone sobe para cá por causa da sonda de ambiente.** Ela roda antes
      # do `update`, e precisa do `.env.example` e do verificador. O
      # verificador de site, lá no fim, usa o mesmo clone — não há um segundo.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # **Vermelho aqui não cria revisão e não move tráfego**, que é a razão de
      # o passo estar antes do `update` e não depois.
      #
      # **Ele não é emprego próprio como o `auth`.** Aquele barra a entrega
      # inteira porque a divergência que ele pega é declarada no repositório —
      # dá para vê-la num pull request. Variável faltando no Container App é
      # fato do recurso, e só este emprego fala com ele.
      #
      # **Sem `npm ci`, de propósito:** o verificador só usa builtins do Node.
      - name: as variáveis de execução declaradas existem no Container App
        run: |
          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[].name" -o json \
            | npm run --silent verificar:ambiente

      - name: nova revisão com a imagem recém-publicada
        # **As variáveis de ambiente da aplicação NÃO passam por aqui.** Elas
        # ficam no próprio Container App, definidas uma vez no provisionamento
        # (`az containerapp create --env-vars`). Assim os segredos de execução
        # não precisam existir como segredo do repositório — e o que não está
        # aqui não pode vazar num log de Actions.
        #
        # **`vars.` e não `secrets.` para os dois nomes de recurso, e a diferença
        # é visível.** Nome de Container App e de grupo de recursos não são
        # credencial — saber o FQDN não dá acesso a nada, porque a aplicação é
        # pública por desenho. Como segredo, eles mascaravam a URL no resumo
        # (`https://***.jollypebble-…`) e faziam o GitHub **recusar** o
        # `environment url` com *"environment 'producao' may contain secret"* —
        # deixando o ambiente sem link clicável. O critério 1 do item 40 pede uma
        # URL pública onde a revisão funcional acontece; ela existia e estava
        # invisível para quem ia revisar.
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.publicar.outputs.etiqueta }}"

      # **Em modo de múltiplas revisões, criar revisão não move tráfego.** O
      # modo é o que torna verdadeiro o caminho de volta que a `arquitetura.md`
      # §9 e o `definition-of-done.md` descrevem — *reativar a revisão anterior
      # e reapontar o tráfego, sem rebuild* —, e o preço dele é este passo. Sem ele o
      # deploy sobe, a URL continua servindo a revisão velha e o `curl` do fim
      # do emprego passa: **o modo de falha mais traiçoeiro deste arquivo é o
      # que fica verde.**
      #
      # **Este passo exige o modo `Multiple`.** Em `Single` o `az` recusa antes
      # de chamar a API — *"is configured for single revision. Set revision
      # mode to multiple in order to set ingress traffic"* —, e a recusa cairia
      # aqui, depois de a imagem já estar publicada. O modo é trocado no O-1a,
      # antes do merge que traz este passo para `main`.
      - name: mandar o tráfego para a revisão nova
        run: |
          az containerapp ingress traffic set \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --revision-weight latest=100

      - id: endereco
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"
          echo "Publicado em https://$FQDN" >> "$GITHUB_STEP_SUMMARY"

      - name: conferir que a URL pública responde
        # Não é enfeite: um deploy verde com a aplicação em `CrashLoopBackOff`
        # é o modo de falha mais comum de container em nuvem, e sem este passo
        # ele passaria como sucesso. A primeira requisição depois de ociosidade
        # é justamente o cold start do RNF5, então a espera é generosa.
        run: |
          for tentativa in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.endereco.outputs.url }}/entrar" || true)
            echo "tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 6
          done
          echo "A URL pública não respondeu 200 em /entrar. Reaponte o tráfego para a revisão anterior."
          exit 1

      # **Revisão sem tráfego com mínimo de réplicas acima de zero cobra sem
      # servir ninguém** (ADR-0023). A revisão nova copia o mínimo da anterior,
      # e em modo `Multiple` a anterior continua ativa com peso zero: com
      # mínimo 1, cada entrega deixaria mais uma réplica de pé. O teste de
      # 04/10/2026 mostrou isso ao vivo, com a revisão velha a 0% de tráfego e
      # uma réplica rodando.
      #
      # **Vem depois da conferência da URL, e não antes.** Se a revisão nova não
      # responde, este passo não roda e a anterior continua ativa, como alvo de
      # volta. Desativada, ela não se perde: voltar atrás passa a ser reativá-la
      # e apontar o tráfego, ainda sem rebuild.
      #
      # Com mínimo 0 a consulta volta vazia e o passo não faz nada; o filtro de
      # peso zero impede que ele derrube a revisão que está servindo.
      - name: desativar as revisões sem tráfego que seguram réplica
        run: |
          for revisao in $(az containerapp revision list \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?properties.active && properties.trafficWeight==\`0\` && properties.template.scale.minReplicas>\`0\`].name" \
              -o tsv); do
            echo "desativando $revisao"
            az containerapp revision deactivate \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --revision "$revisao"
            echo "- $revisao desativada (sem tráfego, mínimo acima de zero)" >> "$GITHUB_STEP_SUMMARY"
          done

      # A mesma conferência do emprego `verificar`, agora contra o que está no
      # ar. Ela só lê: vermelho aqui não desfaz nada, e avisa que a revisão
      # nova publicou uma documentação quebrada.
      - name: verificador do site — a documentação publicada
        run: node ferramentas/verificadores/site.mjs "${{ steps.endereco.outputs.url }}"

# =============================================================================
#  Aquecer a aplicação — a sonda em janela do item 79
#
#  Sem tráfego, o Container Apps escala a zero, e a primeira requisição depois
#  leva uns vinte segundos (ADR-0004). Este arquivo segura a aplicação acordada
#  em dois modos, e em nenhum outro momento:
#
#    · FAIXA  — agendada, a linha de cron abaixo. Uma batida a cada 5 min. O
#               contêiner dorme poucos minutos depois da última requisição e o
#               agendador do GitHub atrasa, então a faixa deixa buraco: torna a
#               espera rara, não impossível. É para quem abre sem hora marcada.
#    · JANELA — disparada à mão (Actions → aquecer a aplicação → Run workflow).
#               Uma batida a cada 2 min pela duração escolhida, sem buraco. É
#               para gravação, mentoria e ensaio.
#
#  A sonda só faz GET em duas páginas públicas que não consultam o banco, e não
#  recebe segredo nenhum: só a variável URL_PUBLICA.
#
#  **O orçamento que morde é o do Actions, e não o da Azure.** Com o
#  repositório privado são 2.000 min/mês, e o mesmo saldo roda o
#  `manter-o-banco-acordado.yml`. Se acabar, o banco pausa depois de sete dias.
#  Toda troca da faixa refaz a conta do comentário dela.
# =============================================================================

name: aquecer a aplicação

on:
  schedule:
    # FAIXA · 09/10 (sex) e 13 a 16/10 (ter a sex), das 09:00 às 17:55 de
    # Brasília (12–20 UTC), a cada 5 min. 12/10 é feriado. 5 dias × 9 h × 12 =
    # 540 execuções ≈ 540 min de Actions. Trocar a faixa é trocar esta linha.
    # O dia da semana fica `*`: restringir os dois campos faz o cron casar por OU.
    - cron: "*/5 12-20 9,13-16 10 *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Quantos minutos a aplicação fica quente (de 1 a 240)"
        required: true
        default: 120
        type: number

jobs:
  # ---------------------------------------------------------------------------
  # A faixa: uma batida e pronto. A nova tentativa existe porque a batida que
  # encontra a aplicação fria pode estourar o gateway (504) antes de ela subir.
  # ---------------------------------------------------------------------------
  faixa:
    name: Bater uma vez (faixa)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: GET em /entrar e /documentacao/README
        env:
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: |
          URL="${URL_PUBLICA%/}"
          if [ -z "$URL" ]; then
            echo "::error::URL_PUBLICA não está cadastrada em Settings → Variables."
            exit 1
          fi

          bater() {
            ok=1
            for rota in /entrar /documentacao/README; do
              r=$(curl -s -o /dev/null --max-time 60 -w "%{http_code} %{time_total}" "$URL$rota" || true)
              codigo="${r%% *}"; tempo="${r##* }"
              [ -n "$r" ] || { codigo=000; tempo=60; }
              echo "$(date -u +%H:%M:%S) $rota HTTP $codigo ${tempo}s"
              [ "$rota" = /entrar ] && tempo_entrar="$tempo" && codigo_entrar="$codigo"
              [ "$codigo" = 200 ] || ok=0
            done
            [ "$ok" = 1 ]
          }

          if ! bater; then
            echo "falhou; nova tentativa em 30 s"
            sleep 30
            if ! bater; then
              echo "### faixa: a aplicação não respondeu em duas tentativas" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::A aplicação não respondeu 200 em duas tentativas."
              exit 1
            fi
          fi

          # Acima de 5 s é despertar: quente mede ~0,3 s, fria ~20 s.
          estado=$(awk -v t="$tempo_entrar" 'BEGIN { print (t > 5 ? "despertou" : "quente") }')
          echo "### faixa: /entrar HTTP $codigo_entrar em ${tempo_entrar}s ($estado)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # A janela: de pé pela duração pedida, batendo a cada 2 min. O contêiner
  # escala a zero uns 4 a 5 min depois da última requisição, e 2 min fica
  # abaixo disso. Custa um despertar (a primeira batida) e 60 min de Actions
  # por hora. Disparar de novo substitui a janela em curso.
  # ---------------------------------------------------------------------------
  janela:
    name: Segurar quente (janela)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Teto 240 + 10. Expressão do Actions não faz aritmética; quem encerra na
    # duração pedida é o laço, e isto é só a rede de segurança.
    timeout-minutes: 250
    concurrency:
      group: aquecer-janela
      cancel-in-progress: true

    steps:
      - name: GET a cada 2 min em /entrar e /documentacao/README
        env:
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
          MINUTOS: ${{ inputs.minutos }}
          INTERVALO: 120
        run: |
          URL="${URL_PUBLICA%/}"
          if [ -z "$URL" ]; then
            echo "::error::URL_PUBLICA não está cadastrada em Settings → Variables."
            exit 1
          fi
          if ! [[ "$MINUTOS" =~ ^[0-9]+$ ]] || [ "$MINUTOS" -lt 1 ] || [ "$MINUTOS" -gt 240 ]; then
            echo "::error::minutos tem de ser um inteiro de 1 a 240, e veio '$MINUTOS'."
            exit 1
          fi

          fim=$(( $(date +%s) + MINUTOS * 60 ))
          n=0; falhas=0; seguidas=0; primeira=""; tempos=()

          resumo() {
            mediana="-"
            if [ "${#tempos[@]}" -gt 0 ]; then
              mediana=$(printf '%s\n' "${tempos[@]}" | sort -g | awk '{ v[NR] = $1 } END { print v[int((NR + 1) / 2)] }')
            fi
            {
              echo "### janela de $MINUTOS min"
              echo ""
              echo "| batidas | com falha | /entrar na primeira | mediana de /entrar nas demais |"
              echo "|---|---|---|---|"
              echo "| $n | $falhas | ${primeira:--}s | ${mediana}s |"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          while [ "$(date +%s)" -lt "$fim" ]; do
            n=$((n + 1)); ok=1
            for rota in /entrar /documentacao/README; do
              r=$(curl -s -o /dev/null --max-time 60 -w "%{http_code} %{time_total}" "$URL$rota" || true)
              codigo="${r%% *}"; tempo="${r##* }"
              [ -n "$r" ] || { codigo=000; tempo=60; }
              echo "$(date -u +%H:%M:%S) batida $n $rota HTTP $codigo ${tempo}s"
              if [ "$rota" = /entrar ]; then
                if [ "$n" = 1 ]; then primeira="$tempo"; else tempos+=("$tempo"); fi
              fi
              [ "$codigo" = 200 ] || ok=0
            done

            if [ "$ok" = 1 ]; then
              seguidas=0
            else
              falhas=$((falhas + 1))
              # A primeira batida é a partida a frio, e um 504 nela é esperado.
              if [ "$n" -gt 1 ]; then seguidas=$((seguidas + 1)); fi
              if [ "$seguidas" -ge 3 ]; then
                resumo
                echo "::error::Três batidas seguidas sem 200. A aplicação está fora do ar."
                exit 1
              fi
            fi

            [ "$(date +%s)" -lt "$fim" ] && sleep "$INTERVALO"
          done

          resumo

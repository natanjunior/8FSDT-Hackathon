        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 60 }
                ordem: { type: integer, minimum: 0, maximum: 999 }
                ativa: { type: boolean }

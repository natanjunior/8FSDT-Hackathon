              example: { id: "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e", nome: "Apartamento 302", tipo: "privativa", ativa: true, ocorrenciasComTipoAnterior: 3 }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/AreaNaoEncontrada" }
        "409": { $ref: "#/components/responses/NomeDuplicado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /areas/ordem:
    put:
      tags: [Configuração]
      operationId: reordenarAreas
      summary: Reordenar as áreas, a lista inteira de uma vez
      description: |
        Recebe **a lista inteira** das áreas da organização, ativas e inativas, na ordem nova. Numa
        transação só, a área na posição *i* recebe `ordem = i`, de 1 a *n*; se qualquer passo falhar, nada
        muda. É a ordem em que o formulário de registro oferece as áreas, e por isso a que mais pesa no
        tempo do registro.

        Só as linhas que mudaram de posição recebem `atualizado_em` e o autor da alteração. **A
        reordenação não toca o registro de reclassificação**, que só muda quando `tipo` muda em
        `PATCH /areas/{areaId}`.

        Conjunto diferente do atual responde `409 LISTA_DESATUALIZADA`, igual nos quatro casos (faltando,
        sobrando, de outra organização, inexistente), e o cliente recarrega a lista com
        `GET /areas?ativa=false`. Lista vazia, mais de 999 itens e id repetido respondem `400`.

        *Capacidade: editar áreas. Comando: `Definir áreas do local`. Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reordenacao" }
            example:
              ids:
                - "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e"
                - "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e"
                - "0f9a4d71-2222-4b2c-9d3e-4f5a6b7c8d9e"
      responses:
        "200":
          description: A lista inteira, na ordem nova, na forma de `GET /areas?ativa=false`.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Area" }
              example:
                itens:
                  - { id: "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e", nome: "Apartamento 302", tipo: "privativa", ativa: true, ordem: 1 }
                  - { id: "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e", nome: "Garagem — Subsolo 1", tipo: "comum", ativa: true, ordem: 2 }
                  - { id: "0f9a4d71-2222-4b2c-9d3e-4f5a6b7c8d9e", nome: "Salão de festas", tipo: "comum", ativa: true, ordem: 3 }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/ListaDesatualizada" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /anexos/autorizacoes:
    post:
      tags: [Anexo]
      operationId: autorizarUploadDeAnexo
      summary: Autorizar o upload do anexo, direto para o storage
      description: |
        Devolve uma **credencial temporária de escrita** para o cliente enviar a evidência **direto ao
        storage** — a API nunca recebe, nunca repassa e nunca guarda bytes.

        O fluxo completo:

        1. O cliente **comprime no aparelho** para ~400 KB / 1600 px no maior lado (RNF8).
        2. Chama esta operação e recebe `chave`, `ticket` e `upload`.
        3. Faz `PUT` na `upload.url` com os bytes e os `upload.cabecalhos` — **fora desta API**, contra o
           storage. Este passo não aparece na especificação porque não é operação nossa.
        4. Envia `anexos: [{ chave, ticket }]` em `POST /ocorrencias`.

        **A validação acontece no passo 4, não no 3.** Ao reivindicar, o servidor confere a assinatura do
        `ticket`, confere que o portador é quem pediu, e faz um `HEAD` no objeto — que devolve tamanho e
        tipo reais sem baixar nada. Objeto ausente, grande demais ou de outro tipo derruba o registro.

        Por que assim: a aplicação roda com franquia medida em vCPU-segundos, e *streaming* de arquivo é
        exatamente o trabalho que consome franquia sem produzir nada. E o passo 3 corre **em paralelo** com
        o preenchimento do formulário — é o que faz o registro caber em menos de um minuto (RNF6).

        ## O que esta operação aceita hoje, e por que o nome é `anexos`

        **O corpo aceita `image/jpeg` e `image/png`, e nada mais** — é o escopo desta entrega
        (RNF8, e a capacidade *"anexar uma imagem"* do escopo). O caminho fala em anexo porque o conceito
        do domínio é **evidência**, e imagem é um tipo dela; o dia em que outro tipo entrar, o que muda é a
        lista de `tipoConteudo` aceitos, **não o caminho, não o schema e não o cliente**.

        **O cliente nunca envia o tipo de anexo.** O `tipo` da linha em `anexos` é **derivado** do
        `tipoConteudo` pelo servidor, no ato de reivindicar. É o que mantém o enum de tipos fora de todo
        schema de entrada — e é o que torna acrescentar um tipo novo uma mudança aditiva.

        ## O objeto que nunca é reivindicado

        O passo 4 pode nunca acontecer — o aplicativo fechou, a rede caiu na garagem, a pessoa desistiu.
        Nesse caso o objeto ficaria no storage e **nada no sistema saberia que ele existe**: não há linha no
        banco, e o `ticket` era um token que expirou.

        Por isso **todo objeto nasce marcado `estado=pendente`**, numa etiqueta de índice escrita pelo
        servidor. Reivindicar troca a marca para `estado=confirmado` **e grava a linha em `anexos`** — a
        troca da etiqueta é uma operação de metadado, que **não move bytes** e portanto não desfaz a razão
        de este desenho existir. Uma regra de ciclo de vida do contêiner apaga o que continuar `pendente`;
        como a granularidade do provedor é de dias, um objeto abandonado vive entre 24 e 48 horas. Ele já
        era irrecuperável depois de 15 minutos, quando o `ticket` expirou: o resto é espera de faxina, não
        janela de risco.

        **Este é o único endpoint do contrato com limite de chamadas** — 30 por Pessoa por hora. É o único
        que permite a alguém autenticado consumir armazenamento externo **sem criar registro de domínio
        nenhum**; todos os outros criam linha em tabela e já esbarram nas regras do próprio domínio.

        *Capacidade: anexar uma imagem, comprimida no próprio celular · `ENUNCIADO · aberto` (S6) + RNF8.*
        *Não é comando do Event Storming: é decomposição técnica de `Registrar ocorrência`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoConteudo, tamanhoBytes]
              properties:
                tipoConteudo:
                  type: string
                  enum: [image/jpeg, image/png]
                  description: |
                    **Os dois tipos desta entrega** (RNF8). O servidor deriva daqui o `tipo` do anexo
                    — hoje sempre `imagem`. Aceitar um tipo novo é acrescentar um valor a esta lista, e é a
                    única mudança de entrada que a ampliação do anexo exigiria.
                tamanhoBytes:
                  type: integer
                  minimum: 1
                  maximum: 524288
                  description: Teto de 512 KB — os 400 KB do RNF8, com margem.
            example: { tipoConteudo: "image/jpeg", tamanhoBytes: 391244 }
      responses:
        "201":
          description: Autorização emitida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoDeUpload" }
              example:
                chave: "anx_01JB8Z6K9T2M4N7Q"
                chaveMiniatura: "anx_01JB8Z6K9T2M4N7Q_mini"
                ticket: "eyJhbGciOiJIUzI1NiJ9.eyJjaGF2ZSI6ImFueF8wMUpCOFo2SzlUMk00TjdRIn0"
                estado: "pendente"
                upload:
                  url: "https://exemplo.blob.core.windows.net/anexos/anx_01JB8Z6K9T2M4N7Q?sv=2024-11-04&sig=..."
                  metodo: "PUT"
                  cabecalhos:
                    x-ms-blob-type: "BlockBlob"
                    x-ms-blob-content-type: "image/jpeg"
                  expiraEm: "2026-08-20T13:17:00Z"
                uploadMiniatura:
                  url: "https://exemplo.blob.core.windows.net/anexos/anx_01JB8Z6K9T2M4N7Q_mini?sv=2024-11-04&sig=..."
                  metodo: "PUT"
                  cabecalhos:
                    x-ms-blob-type: "BlockBlob"
                    x-ms-blob-content-type: "image/webp"
                  expiraEm: "2026-08-20T13:17:00Z"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "422":
          description: Tipo ou tamanho fora do permitido.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/anexo-acima-do-limite"
                title: "Arquivo grande demais"
                status: 422
                detail: "A imagem precisa ser comprimida no aparelho antes de subir."
                codigo: "ANEXO_ACIMA_DO_LIMITE"
                traceId: "01JB8Z6K9T2M4N7Q"
        "429":
          description: |
            Mais de 30 autorizações por Pessoa por hora. Existe porque este endpoint é o único que consome
            armazenamento externo sem criar registro de domínio.
          headers:
            Retry-After:
              description: Segundos até a próxima autorização ser aceita.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/limite-de-autorizacoes-de-upload"
                title: "Muitos envios em pouco tempo"
                status: 429
                detail: "Aguarde alguns minutos para enviar outra imagem."
                codigo: "LIMITE_DE_AUTORIZACOES_DE_UPLOAD"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias:
    post:
      tags: [Ocorrências — comandos]
      operationId: registrarOcorrencia
      summary: Registrar a ocorrência
      description: |
        Registra a ocorrência e **grava o primeiro registro da trilha**, com `statusAnterior` nulo — a
        premissa P1. Ele volta na resposta, em `ultimaTransicao`.

        **Quatro coisas o servidor escreve e o cliente não pode enviar:** `status` (nasce `aberta`),
        `prioridade` (nasce `normal`, D6), `areaTipo` (cópia congelada do tipo da Área, que decide a
        visibilidade para sempre) e o registro de transição.

        O anexo chega como **referência já enviada** (`chave` + `ticket`), nunca como bytes. Ao aceitar a
        referência, o servidor **confirma o objeto no storage e grava a linha em `anexos`**, na mesma
        transação que cria a ocorrência e o primeiro registro da trilha — o que o tira da faxina automática
        descrita em `POST /anexos/autorizacoes`.

        **`anexos` aceita no máximo um item nesta entrega** (`maxItems: 1`), e o único tipo que chega até
        aqui é imagem, porque a autorização não emite outro. A lista é a forma permanente; o teto é o
        escopo, e mora aqui — **não no banco**, que não tem restrição alguma de quantidade.

        *Capacidades: registrar com título, descrição e categoria · `ENUNCIADO · literal` (S3, S4);
        informar a localização · `ENUNCIADO · aberto` (S5) + D10; anexar uma imagem · `ENUNCIADO · aberto`
        (S6). Comando: `Registrar ocorrência`. Permissão: `ocorrencia.registrar` — Solicitante e Gestor.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroDeOcorrencia" }
            examples:
              comFoto:
                summary: Área comum, com foto
                value:
                  titulo: "Lâmpada queimada na garagem"
                  descricao: "A lâmpada da vaga 34 está queimada há três dias; à noite o corredor fica escuro."
                  categoriaId: "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d"
                  areaId: "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e"
                  localizacaoComplemento: "ao lado da vaga 34"
                  anexos:
                    - { chave: "anx_01JB8Z6K9T2M4N7Q", ticket: "eyJhbGciOiJIUzI1NiJ9...", titulo: "Lâmpada da vaga 34" }
              semFoto:
                summary: Unidade privativa, sem foto
                value:
                  titulo: "Infiltração na parede do quarto"
                  descricao: "Mancha crescendo na parede que dá para a área externa, depois da chuva de ontem."
                  categoriaId: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d"
                  areaId: "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e"
      responses:
        "201":
          description: Ocorrência registrada, com o primeiro registro da trilha.
          headers:
            Location:
              description: URL da ocorrência criada.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OcorrenciaDetalhe" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409":
          description: |
            Organização divergente do cabeçalho de afirmação; ou anexo **já reivindicado** por outra
            ocorrência.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                organizacaoDivergente:
                  value: { type: "https://resolveai.app/erros/organizacao-divergente", title: "Organização divergente", status: 409, detail: "A organização afirmada não é a organização ativa da sessão.", codigo: "ORGANIZACAO_DIVERGENTE", traceId: "01JB8Z6K9T2M4N7Q" }
                anexoJaReivindicado:
                  summary: O mesmo objeto sendo anexado duas vezes
                  description: |
                    Acontece no reenvio da tela: o `POST` chegou ao servidor, a resposta se perdeu na rede e
                    o cliente refez a chamada com a **mesma** `chave` (o comportamento desenhado, para a
                    foto não subir duas vezes). A primeira chamada tinha funcionado. `ocorrenciaId` diz para
                    onde navegar em vez de registrar de novo.
                  value: { type: "https://resolveai.app/erros/anexo-ja-reivindicado", title: "Este anexo já foi registrado", status: 409, detail: "Este arquivo já está anexado a uma ocorrência.", codigo: "ANEXO_JA_REIVINDICADO", traceId: "01JB8Z6K9T2M4N7Q", ocorrenciaId: "9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8" }
        "422":
          description: |
            Categoria ou área inexistente **nesta organização** ou desativada; anexo não reconhecido;
            campo cuja capacidade é evolução prevista (`ocorrenciaOrigemId`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                categoriaInvalida:
                  value: { type: "https://resolveai.app/erros/categoria-invalida", title: "Categoria inválida", status: 422, detail: "Esta categoria não existe nesta organização ou está desativada.", codigo: "CATEGORIA_INVALIDA", traceId: "01JB8Z6K9T2M4N7Q" }
                areaInvalida:
                  value: { type: "https://resolveai.app/erros/area-invalida", title: "Área inválida", status: 422, detail: "Esta área não existe nesta organização ou está desativada.", codigo: "AREA_INVALIDA", traceId: "01JB8Z6K9T2M4N7Q" }
                anexo:
                  value: { type: "https://resolveai.app/erros/anexo-nao-reconhecido", title: "Anexo não reconhecido", status: 422, detail: "A autorização expirou ou o arquivo não chegou ao storage.", codigo: "ANEXO_NAO_RECONHECIDO", traceId: "01JB8Z6K9T2M4N7Q" }
                campoDeEvolucaoPrevista:
                  summary: Campo cuja capacidade ainda não existe
                  value: { type: "https://resolveai.app/erros/campo-nao-suportado", title: "Campo não suportado", status: 422, detail: "O vínculo com a ocorrência original é evolução prevista.", codigo: "CAMPO_NAO_SUPORTADO", traceId: "01JB8Z6K9T2M4N7Q", erros: [{ campo: "ocorrenciaOrigemId", codigo: "CAMPO_NAO_SUPORTADO" }] }
        "500": { $ref: "#/components/responses/ErroInterno" }

    get:
      tags: [Ocorrências — leitura]
      operationId: listarOcorrencias
      summary: Listar ocorrências
      description: |
        **A mesma URL devolve conjuntos diferentes conforme quem pergunta**, e isso é a regra de
        visibilidade, não um filtro escondido:

        - quem tem `ocorrencia.ler_todas` (Gestor) recebe **todas** as da organização ativa;
        - quem tem só `ocorrencia.ler_propria` (Solicitante) recebe **apenas as de que é autor**.

        Nesta entrega toda ocorrência é visível apenas ao autor e aos Gestores — a visibilidade
        comunitária das áreas comuns é evolução prevista. A resposta declara o recorte aplicado em
        `visibilidadeAplicada`.

        O Gestor que também mora no prédio usa `autor=eu` para ver as próprias — é o síndico morador,
        resolvido por parâmetro e não por um segundo vínculo.

        A ordenação padrão é por `atualizadaEm` decrescente — o que mudou por último vem primeiro — e é
        parametrizável por `ordem` e `sentido`. O desempate é sempre `atualizadaEm` decrescente e o
        identificador, para que dois pedidos iguais devolvam a mesma ordem. Ordenar por `responsavel`
        põe quem não tem responsável no fim, nos dois sentidos. A **paginação é numerada sobre um instante
        de corte** (`pagina`, `limite`, `ate`), e o corte continua sendo em `registradaEm`, qualquer que
        seja a ordem pedida.

        O corte imobiliza a fronteira superior do conjunto — `registradaEm` nunca muda —, então uma
        ocorrência registrada entre duas páginas **não aparece duas vezes**; ela é contada à parte, em
        `novasDesdeOCorte`. O corte **não** imobiliza a pertinência de cada item: quem sai do recorte
        (uma triagem entre páginas, por exemplo) encolhe o conjunto, e é a **compensação de deslocamento**
        — via `totalNoCorte` — que impede o pulo.

        O corte também não imobiliza a **posição**. Com a ordem por `atualizadaEm`, uma ocorrência
        atualizada entre a leitura de duas páginas sobe para o topo: se ela estava numa página ainda não
        vista, a primeira linha da página seguinte repete a última da anterior, e uma linha é pulada. A
        compensação trata saída do recorte, não troca de posição, e não alcança este caso. Pedir a
        primeira página de novo traz tudo.

        **O envelope traz contagens**, todas sob a mesma visibilidade que a listagem aplica.

        *Capacidades: listar todas as ocorrências · `ENUNCIADO · aberto` (G1); filtrar por categoria,
        status e prioridade · `ENUNCIADO · literal` (G2); ver as minhas ocorrências · `ENUNCIADO · aberto` (S7).*
      parameters:
        - name: status
          in: query
          description: Um ou mais status.
          schema:
            type: array
            items: { $ref: "#/components/schemas/StatusOcorrencia" }
          style: form
          explode: false
          example: [aberta, em_analise]
        - name: categoriaId
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: false
        - name: prioridade
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/PrioridadeOcorrencia" }
          style: form
          explode: false
        - name: autor
          in: query
          description: |
            `eu` restringe às ocorrências de que o chamador é autor. É o que dá ao Gestor a visão de
            Solicitante sem um segundo vínculo.
          schema: { type: string, enum: [eu] }
        - name: compartilhadas
          in: query
          description: |
            `comigo` troca o conjunto da página pelas ocorrências que foram compartilhadas com o chamador
            — a aba *Compartilhadas comigo* (item 87). **Não se soma a `autor`**: as duas descrevem
            conjuntos disjuntos, e pedir as duas é `400`.

            **Não conta como filtro:** o vazio dela tem frase própria, e *Limpar filtros* não tira a
            pessoa da aba.
          schema: { type: string, enum: [comigo] }
        - name: titulo
          in: query
          description: |
            Casa por prefixo de palavra, sem acento e sem caixa, e todos os termos precisam casar.
            `vaz gar` acha *Vazamento na garagem*; `ana` não acha *Mariana*.
          schema: { type: string, maxLength: 120 }
        - name: areaId
          in: query
          description: Uma ou mais áreas. Identificador de outra organização devolve lista vazia.
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: false
        - name: responsavelPessoaId
          in: query
          description: |
            Uma ou mais Pessoas, casando a **atribuição vigente** — quem responde hoje, não quem já
            respondeu.
          schema:
            type: array
            items: { type: string, format: uuid }
          style: form
          explode: false
        - name: ordem
          in: query
          description: |
            A coluna da ordenação. Ausente é o padrão, `atualizacao` decrescente; `ordem=atualizacao` com
            `sentido=decrescente` é o mesmo padrão escrito por extenso.
          schema:
            type: string
            enum: [status, titulo, area, prioridade, responsavel, atualizacao]
        - name: sentido
          in: query
          description: |
            Inverte a ordem pedida. Sem `ordem`, é ignorado; o sentido natural de cada coluna é o
            crescente.
          schema: { type: string, enum: [decrescente] }
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Ate"
        - $ref: "#/components/parameters/TotalNoCorte"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Página de ocorrências.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    itens,
                    total,
                    pagina,
                    limite,
                    ate,
                    totalNoCorte,
                    saidasDesdeOCorte,
                    novasDesdeOCorte,
                    contagens,
                    visibilidadeAplicada,
                  ]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/OcorrenciaResumo" }
                  total:
                    type: integer
                    description: Tamanho do conjunto **filtrado**, no corte.
                  pagina: { type: integer }
                  limite: { type: integer }
                  ate:
                    type: string
                    format: date-time
                    description: O corte aplicado. A primeira página o fixa; repasse-o nas seguintes.
                  totalNoCorte:
                    type: integer
                    description: |
                      O `total` da primeira página, ecoado. **É este o campo a repassar** — não o `total`.
                  saidasDesdeOCorte:
                    type: integer
                    description: Quantas saíram do recorte desde o corte. Não custa consulta.
                  novasDesdeOCorte:
                    type: integer
                    description: |
                      Quantas foram registradas **depois** do corte e casam com o recorte aplicado.
                  contagens:
                    type: object
                    required: [todas, minhas, emAberto, semResponsavel, compartilhadasNaoAbertas]
                    description: |
                      O painel. **Calculado sem os filtros de status, categoria e prioridade**: estes
                      números existem para o leitor decidir qual recorte pedir, e recalculá-los dentro do
                      recorte já pedido seria um espelho de frente para outro.
                    properties:
                      todas:
                        type: integer
                        description: |
                          Quantas existem sob a visibilidade de quem pergunta, no corte — **sem** os
                          filtros e **sem** o recorte de autor. É a regra de `minhas`, do outro lado:
                          os dois existem para o leitor escolher o recorte.
                      minhas: { type: integer }
                      emAberto:
                        type: integer
                        description: Status não terminal.
                      semResponsavel:
                        type: integer
                        description: Sem responsável vigente **e** não terminal.
                      compartilhadasNaoAbertas:
                        type: integer
                        description: |
                          Quantas ocorrências compartilhadas com quem pergunta ainda **não** foram
                          abertas por ela, nesta organização. Ignora o corte e os filtros: a pergunta é
                          quantas esperam, e não quantas desta página. Vem `0` para quem pode ler todas,
                          que não recebe compartilhamento.
                  visibilidadeAplicada:
                    type: string
                    enum: [todas, apenas_minhas, compartilhadas_comigo]
                    description: |
                      O recorte que o servidor aplicou, para a interface poder dizê-lo ao usuário.
                      `compartilhadas_comigo` é a aba do item 87, e o conjunto dela **não** é o do autor.
              example:
                visibilidadeAplicada: "todas"
                total: 137
                pagina: 2
                limite: 20
                ate: "2026-09-09T08:00:00Z"
                totalNoCorte: 140
                saidasDesdeOCorte: 3
                novasDesdeOCorte: 5
                contagens: { todas: 53, minhas: 2, emAberto: 41, semResponsavel: 12, compartilhadasNaoAbertas: 0 }
                itens:
                  - id: "9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8"
                    titulo: "Lâmpada queimada na garagem"
                    status: "em_analise"
                    statusRotulo: "Em análise"
                    motivoPausa: null
                    prioridade: "normal"
                    categoria: { id: "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d", nome: "Iluminação" }
                    area: { id: "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e", nome: "Garagem — Subsolo 1", tipo: "comum" }
                    autor: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }
                    responsavel: null
                    quantidadeDeAnexos: 1
                    avaliada: false
                    registradaEm: "2026-08-20T13:02:11Z"
                    atualizadaEm: "2026-08-20T14:10:00Z"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}:
    get:
      tags: [Ocorrências — leitura]
      operationId: obterOcorrencia
      summary: Detalhe da ocorrência
      description: |
        Devolve a ocorrência com **`acoesDisponiveis`** — a lista dos comandos que **este** chamador pode
        executar **agora**.

        A lista aplica **todas** as precondições de cada comando, não apenas o status e a permissão. Entram
        também as invariantes que não são sobre status: `iniciar-atendimento` exige responsável atribuído;
        `alterar-prioridade` não aparece em ocorrência já resolvida ou cancelada, porque a prioridade
        congela em estado terminal; e `avaliar` não aparece duas vezes.

        Isso existe para que o cliente **não reimplemente a tabela de transições**. Sem esse campo,
        passaria a existir uma segunda cópia da máquina de estados na camada que não pode conter regra de
        negócio — e ela divergiria na primeira mudança de regra. Um comando ausente daqui é um comando que
        **vai** ser recusado se for chamado.

        **`404` quando a ocorrência não é visível a quem pediu**, seja porque é de outra organização, seja
        porque é de outro Solicitante: o que você não pode ver não existe para você.

        *Capacidade: listar/consultar ocorrências · `ENUNCIADO · aberto` (G1, S7).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Ocorrência.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OcorrenciaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/linha-do-tempo:
    get:
      tags: [Ocorrências — leitura]
      operationId: obterLinhaDoTempo
      summary: Linha do tempo — o que o Solicitante acompanha
      description: |
        **Transições + mensagens + atribuições**, intercaladas na ordem em que aconteceram, com os status
        em **rótulo de linguagem de gente** (*"Em execução"* para o Solicitante onde o Gestor lê
        *"Em atendimento"*). Os rótulos são definidos no glossário do projeto e calculados no servidor.

        Não confundir com a **trilha de auditoria**: a trilha é só transições, com os nomes internos, e é a
        fonte; a linha do tempo é a apresentação dela somada à conversa e às atribuições.

        *Capacidades: ver a linha do tempo · `ENUNCIADO · aberto` (S9); rótulos em linguagem de gente ·
        `NOSSO` (D19). Modelo de leitura: "linha do tempo da ocorrência" (passo 7).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Eventos em ordem cronológica.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/EventoDaLinhaDoTempo" }
              example:
                itens:
                  - tipo: "transicao"
                    ocorridoEm: "2026-08-20T13:02:11Z"
                    autor: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }
                    rotulo: "Recebida — aguardando análise"
                    statusNovo: "aberta"
                    statusAnterior: null
                  - tipo: "transicao"
                    ocorridoEm: "2026-08-20T14:10:00Z"
                    autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }
                    rotulo: "Em análise"
                    statusNovo: "em_analise"
                    statusAnterior: "aberta"
                    observacao: "Vou verificar se temos lâmpada em estoque."
                  - tipo: "atribuicao"
                    ocorridoEm: "2026-08-20T14:12:00Z"
                    autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }
                    responsavel: { pessoaId: "9d3e2f81-0a1b-4c2d-8e3f-4a5b6c7d8e9f", nome: "Antônio Ferreira" }
                  - tipo: "mensagem"
                    ocorridoEm: "2026-08-20T15:00:00Z"
                    autor: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }
                    texto: "Obrigado! A vaga ao lado também está escura."
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/trilha-de-auditoria:
    get:
      tags: [Ocorrências — leitura]
      operationId: obterTrilhaDeAuditoria
      summary: Trilha de auditoria — só as transições, imutáveis
      description: |
        A sequência completa dos **registros de transição**, cada um com os cinco campos exigidos pelo
        desafio: status anterior · novo status · data e horário · autor da transição · observação.

        **É a única forma de alcançar um registro de transição pela API, e é somente leitura.** Não existe
        `POST`, `PATCH` nem `DELETE` neste recurso: registro de transição é objeto de valor imutável dentro
        do agregado e nasce como **efeito** de um comando. Se um dia aparecer escrita aqui, a garantia
        central do produto terá sido perdida.

        *Capacidade: agregado com máquina de estados e trilha imutável · `ENUNCIADO · literal` (F4–F6) · ADR-0001.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Registros de transição, do mais antigo para o mais recente.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/RegistroDeTransicao" }
              example:
                itens:
                  - { statusAnterior: null, statusNovo: "aberta", ocorreuEm: "2026-08-20T13:02:11Z", autor: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }, observacao: null, motivoPausa: null, motivoCancelamento: null }
                  - { statusAnterior: "aberta", statusNovo: "em_analise", ocorreuEm: "2026-08-20T14:10:00Z", autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }, observacao: "Vou verificar se temos lâmpada em estoque.", motivoPausa: null, motivoCancelamento: null }
                  - { statusAnterior: "em_analise", statusNovo: "pausada", ocorreuEm: "2026-08-21T09:00:00Z", autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }, observacao: "Sem lâmpada no estoque; pedido feito ao fornecedor.", motivoPausa: "aguardando_peca", motivoCancelamento: null }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/anexos/{anexoId}:
    get:
      tags: [Anexo]
      operationId: obterAnexoDaOcorrencia
      summary: Abrir um anexo da ocorrência
      description: |
        Responde **`302`** para uma URL assinada de leitura, válida por 10 minutos. **A API não faz proxy
        dos bytes** — pelo mesmo motivo de custo que decidiu o upload.

        A URL **deste endpoint** é estável, então serve em `<img src>`; a URL assinada, que muda a cada
        pedido, nunca aparece em payload de listagem. O `anexoId` é o identificador da linha, que nunca
        muda — o cliente **não o constrói**: ele vem pronto em `OcorrenciaDetalhe.anexos[].url`.

        O contêiner não é público: ocorrência em unidade privativa é visível só ao autor e aos Gestores, e
        a autorização é feita aqui, **a cada leitura** — é a ocorrência que decide quem vê, nunca a posse
        de um link.

        *Capacidade: anexar uma imagem · `ENUNCIADO · aberto` (S6).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/AnexoId"
        - name: variante
          in: query
          required: false
          description: |
            `miniatura` devolve a versão reduzida, se existir. Ausente devolve o objeto principal.

            **É parâmetro e não caminho novo de propósito:** a miniatura é outra *representação* do mesmo
            anexo, não outro recurso — e assim a operação continua sendo uma, com a URL igualmente
            estável. `404` quando o anexo existe e não tem miniatura.
          schema: { type: string, enum: [miniatura] }
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "302":
          description: Redirecionamento para a URL assinada.
          headers:
            Location:
              description: URL assinada de leitura, com validade de 10 minutos.
              schema: { type: string }
            Referrer-Policy:
              description: Sempre `no-referrer` — a URL assinada não deve vazar por cabeçalho de origem.
              schema: { type: string }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "404":
          description: |
            A ocorrência não existe para quem pediu, ou o anexo não é dela. **A mesma resposta para os dois
            casos** — anexo de outra ocorrência responde como anexo inexistente, pela regra da §6.3 do
            contrato.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/anexo-nao-encontrado", title: "Anexo não encontrado", status: 404, detail: "Este anexo não existe nesta ocorrência.", codigo: "ANEXO_NAO_ENCONTRADO", traceId: "01JB8Z6K9T2M4N7Q" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/comentarios:
    get:
      tags: [Conversa]
      operationId: listarComentarios
      summary: Comentários da ocorrência
      description: |
        O **canal 1**: Gestores e o Solicitante autor. É o que o desafio chama de *"adicionar comentários"*.

        Os participantes são **derivados**, não listados: Gestores da organização mais o autor da
        ocorrência. Quem não é nenhum dos dois nem chega aqui — recebe `404` da ocorrência.

        Os outros dois canais (nota interna e conversa da atribuição) são evolução prevista e terão caminho
        próprio; expor um `tipo` polimórfico agora criaria dois valores inalcançáveis.

        *Capacidade: comentar com os Gestores dentro da ocorrência · `ENUNCIADO · aberto` (S8, G6) + D9.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Página de comentários, do mais antigo para o mais recente.
          content:
            application/json:
              schema:
                type: object
                required: [itens, proximoCursor]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Comentario" }
                  proximoCursor: { type: [string, "null"] }
              example:
                proximoCursor: null
                itens:
                  - id: "c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f"
                    texto: "Obrigado! A vaga ao lado também está escura."
                    autor: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }
                    criadoEm: "2026-08-20T15:00:00Z"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    post:
      tags: [Conversa]
      operationId: enviarComentario
      summary: Comentar na ocorrência
      description: |
        Publica no canal 1 e atualiza `atualizadaEm` da ocorrência.

        **Sem edição e sem exclusão** — o modelo não tem coluna para isso, e nada foi decidido a respeito.
        Consequência declarada: dois toques criam dois comentários; esta é a única operação de escrita do
        contrato que não é protegida por repetição.

        *Capacidade: comentar com os Gestores · `ENUNCIADO · aberto` (S8, G6) + D9.*
        *Comando: `Enviar mensagem no canal`. Permissão: `ocorrencia.comentar`.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 4000 }
            example: { texto: "A lâmpada nova já foi instalada — obrigado pelo aviso." }
      responses:
        "201":
          description: Comentário publicado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comentario" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/compartilhamentos:
    post:
      tags: [Compartilhamento]
      operationId: compartilharOcorrencia
      summary: Abrir a ocorrência, só para leitura, a outra pessoa da organização
      description: |
        O autor e quem tem `ocorrencia.ler_todas` abrem uma ocorrência a outra pessoa da mesma
        organização. Quem recebe **lê e não age**: nenhum comando, nenhuma mensagem, nenhum repasse.

        **É dado, e não permissão.** Nada muda no papel de quem recebe, e não existe permissão
        `ocorrencia.ler_compartilhada` — o que muda é a definição de *"ocorrência que eu posso ver"*, num
        lugar só. Ver a ADR-0017.

        **`201` quando a linha nasce, `200` quando ela já existia**, e as duas trazem a linha: duas abas
        mandando o mesmo pedido terminam com uma linha e nenhuma vê erro.

        **Estado da ocorrência não importa:** resolvida e cancelada continuam compartilháveis.

        *Capacidade: compartilhar uma ocorrência com quem é da organização · `NOSSO` (item 87).*
        *Permissão na porta: `ocorrencia.ler_propria`; a regra fina é sobre o recurso.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pessoaId]
              properties:
                pessoaId:
                  type: string
                  format: uuid
                  description: |
                    Uma pessoa da lista de `GET /ocorrencias/{id}/candidatos-ao-compartilhamento`. Quem não
                    tem vínculo ativo **nesta** organização responde `404` da ocorrência, e não `422`:
                    confirmar que o identificador existe em outra organização é o vazamento que a §6.3
                    existe para impedir.
            example: { pessoaId: "9d3e2f81-0a1b-4c2d-8e3f-4a5b6c7d8e9f" }
      responses:
        "200":
          description: A ocorrência já estava compartilhada com esta pessoa. A linha devolvida é a que existe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compartilhamento" }
        "201":
          description: Compartilhada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compartilhamento" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "422":
          description: |
            O destino existe nesta organização e não serve: já vê a ocorrência, ou está fora do alcance de
            quem compartilha.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                jaVe:
                  summary: Já vê a ocorrência
                  value:
                    type: "https://resolveai.app/erros/destinatario-invalido"
                    title: "Não dá para compartilhar com esta pessoa"
                    status: 422
                    codigo: "DESTINATARIO_INVALIDO"
                    detail: "Esta pessoa já vê esta ocorrência."
                    erros: [{ campo: "pessoaId", codigo: "JA_VE_A_OCORRENCIA" }]
                    traceId: "01JB8Z6K9T2M4N7Q"
                foraDoAlcance:
                  summary: Fora do alcance de quem compartilha
                  value:
                    type: "https://resolveai.app/erros/destinatario-invalido"
                    title: "Não dá para compartilhar com esta pessoa"
                    status: 422
                    codigo: "DESTINATARIO_INVALIDO"
                    detail: "Você só compartilha com quem pode registrar ocorrências."
                    erros: [{ campo: "pessoaId", codigo: "FORA_DO_ALCANCE" }]
                    traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/compartilhamentos/{pessoaId}:
    delete:
      tags: [Compartilhamento]
      operationId: desfazerCompartilhamento
      summary: Desfazer um compartilhamento
      description: |
        Quem compartilhou desfaz o seu; quem tem `ocorrencia.ler_todas` desfaz qualquer um. Quem recebeu
        não desfaz e não repassa.

        **`DELETE`, e não um comando.** O compartilhamento é um recurso com identidade — o par ocorrência e
        pessoa — e desfazer apaga a linha. Não há histórico de compartilhamento: a regra *"a escrita é
        comando"* vale para os comandos de domínio do agregado, e este não é um deles.

        **`204` também quando a linha não existe**, pela mesma razão do `200` do `POST`: duas abas
        desfazendo o mesmo não veem erro.

        *Capacidade: compartilhar uma ocorrência com quem é da organização · `NOSSO` (item 87).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/PessoaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "204":
          description: Desfeito. A ocorrência sai da aba de quem recebia.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/candidatos-ao-compartilhamento:
    get:
      tags: [Compartilhamento]
      operationId: buscarCandidatosAoCompartilhamento
      summary: Quem pode receber esta ocorrência
      description: |
        A busca do painel de compartilhar. **Parte do vínculo**, dentro da organização ativa: quem só
        existe em outra organização não aparece.

        **Traz nome e papel, e nada mais.** Sem contato — que é só para quem gere vínculos — e sem área,
        que é a unidade de moradia de um vizinho.

        **Quem já vê aparece marcado, em vez de sumir**, para a tela poder recusar dizendo por quê; quem
        está fora do alcance de quem pergunta não aparece.

        O mínimo de duas letras e o teto de vinte itens limitam, sem impedir, que um participante descubra
        os nomes dos outros. Está declarado em `docs/seguranca.md`.

        *Capacidade: compartilhar uma ocorrência com quem é da organização · `NOSSO` (item 87).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - name: busca
          in: query
          required: true
          description: |
            Casa por prefixo de palavra, sem acento e sem caixa, e todos os termos precisam casar — a
            mesma regra do `titulo` de `GET /ocorrencias`.
          schema: { type: string, minLength: 2, maxLength: 120 }
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Até vinte pessoas, por nome.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/CandidatoAoCompartilhamento" }
              example:
                itens:
                  - pessoaId: "9d3e2f81-0a1b-4c2d-8e3f-4a5b6c7d8e9f"
                    nome: "Diego Fontes"
                    papel: "solicitante"
                    situacao: "disponivel"
                    motivo: null
                  - pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f"
                    nome: "Marcos Vieira"
                    papel: "gestor"
                    situacao: "ja_ve"
                    motivo: "le_todas"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/analisar:
    post:
      tags: [Ocorrências — comandos]
      operationId: analisar
      summary: "Comando: analisar"
      description: |
        `Aberta` → `Em análise`. Marca que o Gestor começou a olhar — e é a transição que tira a ocorrência
        do limbo do ponto de vista do Solicitante.

        `observacao` é **opcional** aqui: é avanço rotineiro, e exigir texto onde não há decisão a
        justificar produz "ok" e mata o dado (D23).

        *Capacidade: analisar · `ENUNCIADO · literal` (F2). Comando: `Analisar`. Permissão: `ocorrencia.analisar` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoComObservacaoOpcional" }
            example: { observacao: "Vou verificar se temos lâmpada em estoque." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/alterar-prioridade:
    post:
      tags: [Ocorrências — comandos]
      operationId: alterarPrioridade
      summary: "Comando: alterar prioridade"
      description: |
        **Não transiciona status e não gera registro na trilha** — a trilha é só de status. É a razão de a
        alteração de prioridade não aparecer na linha do tempo, e é limitação conhecida do modelo.

        **Recusada em `resolvida` e `cancelada`** (invariante 7, D6): se a prioridade mudasse depois do
        fim, *"quantas ocorrências de prioridade alta resolvemos em setembro"* responderia coisas
        diferentes conforme o dia da pergunta — e indicador que muda o passado não é indicador.

        Nada sobe de prioridade sozinho: **nenhuma política altera prioridade** (D16); o envelhecimento
        apenas sinaliza.

        **`observacao` não é aceita nesta operação:** como este comando não gera registro de transição, o
        texto não teria onde ser guardado — `atribuicoes` não tem coluna de observação, e a alteração de
        prioridade nem aparece na linha do tempo. Enviar o campo devolve `422 CAMPO_NAO_SUPORTADO`, na
        mesma forma com que `/cancelar` recusa `ocorrenciaOrigemId`. O destino dele, quando existir, é a
        **conversa da atribuição — o canal 3** (D9), que é evolução prevista.
        *(Corrigido em 30/08/2026: até esta data o `requestBody` declarava
        `observacao: { type: string, maxLength: 1000 }` e o exemplo a trazia preenchida; o produto a recusa
        com `422` desde o item 17, critério 17.6. Item 16 da fila da frente de documentação.)*

        *Capacidade: alterar a prioridade · `ENUNCIADO · aberto` (G3) + D6. Comando: `Alterar prioridade`.
        Permissão: `ocorrencia.alterar_prioridade` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prioridade]
              properties:
                prioridade: { $ref: "#/components/schemas/PrioridadeOcorrencia" }
            example: { prioridade: "alta" }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409":
          description: Ocorrência em estado terminal — a prioridade está congelada.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/prioridade-imutavel-em-estado-terminal"
                title: "Prioridade congelada"
                status: 409
                detail: "A prioridade não muda depois de resolvida ou cancelada, para o dashboard não mudar o passado."
                codigo: "PRIORIDADE_IMUTAVEL_EM_ESTADO_TERMINAL"
                traceId: "01JB8Z6K9T2M4N7Q"
                statusAtual: "resolvida"
        "422":
          description: |
            Campo cuja capacidade é evolução prevista (`observacao`) — recusado em voz alta, e não
            descartado em silêncio.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/campo-nao-suportado"
                title: "Campo não suportado"
                status: 422
                detail: "Um ou mais campos enviados não são aceitos por esta operação."
                codigo: "CAMPO_NAO_SUPORTADO"
                traceId: "01JB8Z6K9T2M4N7Q"
                erros: [{ campo: "observacao", codigo: "CAMPO_NAO_SUPORTADO" }]
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/atribuir-responsavel:
    post:
      tags: [Ocorrências — comandos]
      operationId: atribuirResponsavel
      summary: "Comando: atribuir responsável (e reatribuir)"
      description: |
        Designa **qualquer Pessoa com vínculo ativo** na organização — Encarregado **ou** Gestor. Papel e
        atribuição são ortogonais (D21): o Gestor se atribui em um clique enviando o próprio `pessoaId`,
        sem precisar de um segundo vínculo. **Não há endpoint separado de auto-atribuição.**

        **Este endpoint realiza dois comandos do domínio.** Se já houver responsável, ele *reatribui*: a
        atribuição vigente é encerrada com motivo `reatribuicao`, e a POL-04 arquiva a conversa daquela
        atribuição — **arquivada, nunca apagada**. A resposta diz qual dos dois aconteceu, em
        `reatribuicao`.

        > **Nesta entrega a POL-04 não tem canal para arquivar.** O canal 3 — a conversa privada da
        > atribuição — é evolução prevista (D9). A política fica declarada porque o encadeamento é do
        > desenho e volta inteiro quando o canal existir; **hoje reatribuir encerra a atribuição anterior e
        > para aí.** *(Acrescentado em 30/08/2026: a redação anterior prometia, sem ressalva, que "a
        > conversa daquela atribuição é arquivada, nunca apagada" — o `contrato-de-api.md` §3.4 já
        > carregava a ressalva e a especificação publicada não a repetia. Item 16 da fila da frente de
        > documentação, emenda de 29/08/2026.)*

        **`observacao` não é aceita nesta operação:** o texto não tem destino em lugar nenhum — as colunas
        de `atribuicoes` não incluem observação, o comando não gera registro de transição, e o
        `EventoAtribuicao` da linha do tempo não tem campo para ela. Enviar o campo devolve
        `422 CAMPO_NAO_SUPORTADO`, na mesma forma com que `/cancelar` recusa `ocorrenciaOrigemId`. O
        destino dele, quando existir, é a **conversa da atribuição — o canal 3** (D9).
        *(Corrigido em 30/08/2026: até esta data o `requestBody` declarava
        `observacao: { type: string, maxLength: 1000 }`; o produto a recusa com `422` desde o item 19,
        critério 19.6. Item 16 da fila da frente de documentação.)*

        **Não transiciona status** — mas é pré-condição de `iniciar-atendimento`.

        **De onde pode ser chamado:** `aberta`, `em_analise`, `em_atendimento` e `pausada`. Nos dois estados
        terminais — `resolvida` e `cancelada` — responde `409 TRANSICAO_NAO_PERMITIDA`, pela mesma razão da
        invariante 7: registro fechado não recebe escrita nova. **`aberta` entra de propósito**, porque a
        auto-atribuição em um clique acontece na triagem, e proibi-la ali transformaria um clique em dois.

        *Capacidades: atribuir o responsável · `ENUNCIADO · aberto` (G4) + D21; auto-atribuição em um
        clique · `NOSSO`; reatribuir · `NOSSO`. Comandos: `Atribuir responsável`, `Reatribuir`.
        Permissão: `ocorrencia.atribuir` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responsavelPessoaId]
              properties:
                responsavelPessoaId:
                  type: string
                  format: uuid
                  description: Uma Pessoa da lista de `GET /vinculos`. Para auto-atribuição, o `pessoaId` do próprio chamador.
            example: { responsavelPessoaId: "9d3e2f81-0a1b-4c2d-8e3f-4a5b6c7d8e9f" }
      responses:
        "200":
          description: Responsável atribuído (ou reatribuído).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OcorrenciaDetalhe"
                  - type: object
                    properties:
                      reatribuicao:
                        type: boolean
                        description: |
                          `true` quando havia responsável anterior — a atribuição dele foi encerrada com
                          motivo `reatribuicao`. O arquivamento da conversa daquela atribuição é a POL-04,
                          e **nesta entrega ela não tem canal para arquivar**: o canal 3 é evolução
                          prevista (D9). *(Corrigido em 30/08/2026: a redação anterior era "`true` quando
                          havia responsável anterior — a atribuição dele foi encerrada e a conversa,
                          arquivada", que prometia o arquivamento como fato desta entrega. Item 16 da fila
                          da frente de documentação.)*
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "422":
          description: |
            A pessoa indicada não tem vínculo ativo nesta organização; ou campo cuja capacidade é evolução
            prevista (`observacao`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                semVinculoAtivo:
                  value: { type: "https://resolveai.app/erros/responsavel-sem-vinculo-ativo", title: "Pessoa sem vínculo ativo", status: 422, detail: "Só é possível atribuir a quem tem vínculo ativo nesta organização.", codigo: "RESPONSAVEL_SEM_VINCULO_ATIVO", traceId: "01JB8Z6K9T2M4N7Q" }
                campoDeEvolucaoPrevista:
                  summary: Campo cuja capacidade ainda não existe
                  value: { type: "https://resolveai.app/erros/campo-nao-suportado", title: "Campo não suportado", status: 422, detail: "Um ou mais campos enviados não são aceitos por esta operação.", codigo: "CAMPO_NAO_SUPORTADO", traceId: "01JB8Z6K9T2M4N7Q", erros: [{ campo: "observacao", codigo: "CAMPO_NAO_SUPORTADO" }] }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/iniciar-atendimento:
    post:
      tags: [Ocorrências — comandos]
      operationId: iniciarAtendimento
      summary: "Comando: iniciar atendimento"
      description: |
        `Em análise` → `Em atendimento`.

        **Exige responsável atribuído** (invariante 9, D21). Não é burocracia: *"quem está fazendo"* é
        exatamente a informação que hoje se perde, e a atribuição é o que a torna registrada. Sem
        responsável, `409 RESPONSAVEL_NAO_ATRIBUIDO` — a única pré-condição de estado do contrato que não
        é sobre o `status`.

        *Capacidade: iniciar o atendimento · `ENUNCIADO · literal` (F2) + D21. Comando: `Iniciar atendimento`.
        Permissão: `ocorrencia.iniciar_atendimento` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoComObservacaoOpcional" }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409":
          description: Transição não permitida, ou nenhum responsável atribuído.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                semResponsavel:
                  value:
                    type: "https://resolveai.app/erros/responsavel-nao-atribuido"
                    title: "Ninguém atribuído"
                    status: 409
                    detail: "Atribua um responsável antes de iniciar o atendimento."
                    codigo: "RESPONSAVEL_NAO_ATRIBUIDO"
                    traceId: "01JB8Z6K9T2M4N7Q"
                    statusAtual: "em_analise"
                    acoesDisponiveis: ["atribuir-responsavel", "pausar", "alterar-prioridade", "cancelar"]
                transicao:
                  value:
                    type: "https://resolveai.app/erros/transicao-nao-permitida"
                    title: "Transição não permitida"
                    status: 409
                    detail: "Só é possível iniciar o atendimento de uma ocorrência em análise."
                    codigo: "TRANSICAO_NAO_PERMITIDA"
                    traceId: "01JB8Z6K9T2M4N7Q"
                    statusAtual: "aberta"
                    acoesDisponiveis: ["analisar", "atribuir-responsavel", "alterar-prioridade", "cancelar"]
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/pausar:
    post:
      tags: [Ocorrências — comandos]
      operationId: pausar
      summary: "Comando: pausar"
      description: |
        `Em análise` **ou** `Em atendimento` → `Pausada`.

        `Pausada` é acréscimo nosso ao ciclo de vida, e existe porque **é onde o trabalho se perde hoje**:
        nomear a espera é o que permite vigiá-la. Por isso **motivo e observação são obrigatórios** —
        aqui há uma decisão a justificar, e é o caso em que a D23 exige texto.

        *Capacidade: pausar com motivo estruturado · `NOSSO` (D8). Comando: `Pausar`.
        Permissão: `ocorrencia.pausar` — Gestor (e o responsável atribuído, quando ele tiver acesso próprio).*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, observacao]
              properties:
                motivo: { $ref: "#/components/schemas/MotivoPausa" }
                observacao: { type: string, minLength: 1, maxLength: 1000 }
            example: { motivo: "aguardando_peca", observacao: "Sem lâmpada no estoque; pedido feito ao fornecedor." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/retomar:
    post:
      tags: [Ocorrências — comandos]
      operationId: retomar
      summary: "Comando: retomar"
      description: |
        `Pausada` → **o status anterior à pausa**.

        **O cliente não escolhe o destino, e não o conhece antes de pedir**: o agregado lê o
        `statusAnterior` do registro de pausa e volta para lá (invariante 6). Não há campo para isso — é
        um dividendo direto de a trilha ser conceito de domínio.

        *Capacidade: retomar, voltando ao status anterior · `NOSSO` (D8). Comando: `Retomar`.
        Permissão: `ocorrencia.retomar` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoComObservacaoOpcional" }
            example: { observacao: "Lâmpada chegou." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/registrar-solucao-aplicada:
    post:
      tags: [Ocorrências — comandos]
      operationId: registrarSolucaoAplicada
      summary: "Comando: registrar solução aplicada"
      description: |
        Grava **o que foi efetivamente feito**. Não transiciona status e não gera registro na trilha.

        Não é obrigatória por regra do sistema (D22): a obrigação vem por interface — o formulário de
        resolver abre com o campo em foco, e pular exige um clique a mais. O objetivo é que `Resolvida`
        **signifique** algo; campo obrigatório em momento rotineiro é preenchido com "ok" e o dado morre.

        Na prática, o caminho comum é enviar `solucaoAplicada` no próprio `/resolver` — uma requisição em
        vez de duas.

        **Não transiciona status, e de onde pode ser chamado:** `em_atendimento` e `pausada`. Em `aberta` e
        `em_analise` responde `409 TRANSICAO_NAO_PERMITIDA` — solução aplicada descreve trabalho feito, e
        antes de o atendimento começar não há trabalho a descrever. Nos dois terminais, a recusa é a da
        invariante 7.

        *Capacidade: registrar a solução aplicada · `ENUNCIADO · aberto` (G7) + D22.
        Comando: `Registrar solução aplicada`. Permissão: `ocorrencia.registrar_solucao` — Gestor.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solucaoAplicada]
              properties:
                solucaoAplicada: { type: string, minLength: 1, maxLength: 4000 }
            example: { solucaoAplicada: "Trocada a lâmpada da vaga 34 e revisado o reator do corredor." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/resolver:
    post:
      tags: [Ocorrências — comandos]
      operationId: resolver
      summary: "Comando: resolver"
      description: |
        `Em atendimento` → `Resolvida`. **Estado terminal de verdade: não existe reabertura.** Problema que
        volta é uma ocorrência nova vinculada à original (D24).

        **Só o Gestor resolve, sempre.** É a regra de autorização mais firme do produto — apareceu idêntica
        nas duas personas da pesquisa: *"sempre eu que decido que acabou"*.

        Aceita `solucaoAplicada` no mesmo corpo, para que o formulário induzido pela D22 seja uma
        requisição só. O registro de transição continua sendo **um**.

        Se a organização exige a solução, resolver sem ela, no corpo ou já registrada, responde `422`
        (`/configuracao`). Sem a regra ligada, que é o padrão, resolver sem solução continua respondendo
        `200`.

        *Capacidade: resolver · `ENUNCIADO · literal` (F2). Comando: `Resolver`.
        Permissão: `ocorrencia.resolver` — **Gestor apenas**.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                solucaoAplicada: { type: string, maxLength: 4000 }
                observacao: { type: string, maxLength: 1000 }
            example: { solucaoAplicada: "Trocada a lâmpada da vaga 34 e revisado o reator do corredor." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "422":
          description: A organização exige a solução aplicada, e nenhuma foi informada nem registrada antes.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/solucao-obrigatoria"
                title: "Solução obrigatória"
                status: 422
                detail: "Esta organização exige a solução aplicada para resolver."
                codigo: "SOLUCAO_OBRIGATORIA"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/cancelar:
    post:
      tags: [Ocorrências — comandos]
      operationId: cancelar
      summary: "Comando: cancelar"
      description: |
        `Aberta`, `Em análise`, `Em atendimento` ou `Pausada` → `Cancelada`. Terminal.

        **Motivo e observação são obrigatórios** (D12, D23): `Cancelada` não é *"resolvida com resultado
        ruim"*, e o motivo importa tanto quanto o fato — é o que faz o cancelamento virar indicador em vez
        de buraco.

        **Duas checagens de autorização**, e elas são diferentes entre si:

        - **Quem:** o Solicitante cancela **a própria** ocorrência até `Em análise`; a partir de
          `Em atendimento` **só o Gestor**, porque alguém já está trabalhando e pode haver custo incorrido.
          O Solicitante continua podendo **pedir** o cancelamento pelo comentário.
        - **Qual motivo:** Solicitante usa `desistencia`, `resolvido_por_conta_propria`,
          `aberta_por_engano` e `duplicada`; o Gestor usa os sete.

        **`ocorrenciaOrigemId` não é aceito nesta entrega:** o motivo `duplicada` existe, mas o vínculo com
        a ocorrência original é evolução prevista — enviar o campo devolve `422 CAMPO_NAO_SUPORTADO`, e é
        assim que o contrato reserva o lugar sem fingir que a capacidade existe.

        *Capacidade: cancelar com motivo estruturado e observação · `ENUNCIADO · literal` (F3) + D12.
        Comando: `Cancelar`. Permissões: `ocorrencia.cancelar_propria` · `ocorrencia.cancelar_qualquer`.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, observacao]
              properties:
                motivo: { $ref: "#/components/schemas/MotivoCancelamento" }
                observacao: { type: string, minLength: 1, maxLength: 1000 }
            examples:
              peloSolicitante:
                summary: O Solicitante desiste
                value: { motivo: "resolvido_por_conta_propria", observacao: "Chamei um eletricista por conta própria." }
              peloGestor:
                summary: O Gestor cancela por improcedência
                value: { motivo: "improcedente", observacao: "A área não pertence ao condomínio; é da concessionária." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: A partir de `em_atendimento`, só o Gestor cancela.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/somente-o-gestor-cancela-neste-estado"
                title: "Só o Gestor cancela agora"
                status: 403
                detail: "O atendimento já começou. Peça o cancelamento pelo comentário."
                codigo: "SOMENTE_O_GESTOR_CANCELA_NESTE_ESTADO"
                traceId: "01JB8Z6K9T2M4N7Q"
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409": { $ref: "#/components/responses/TransicaoNaoPermitida" }
        "422":
          description: Motivo fora da lista permitida ao papel, ou campo de evolução prevista.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/motivo-nao-permitido-para-o-papel"
                title: "Motivo não disponível"
                status: 422
                codigo: "MOTIVO_NAO_PERMITIDO_PARA_O_PAPEL"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /ocorrencias/{ocorrenciaId}/avaliar:
    post:
      tags: [Ocorrências — comandos]
      operationId: avaliar
      summary: "Comando: avaliar a resolução"
      description: |
        A nota que o **Solicitante autor** dá à resolução. **Não é um sexto estado** (D1): a ocorrência
        continua `Resolvida` depois de avaliada — é ação sobre um estado terminal, não um estado novo.

        É a **única medida de qualidade que o produto tem**. Nota inteira de 1 a 5, comentário opcional.

        Três recusas: quem não é o autor (`403`), ocorrência que não está resolvida (`409`) e segunda
        avaliação (`409`) — a avaliação é `0..1` por ocorrência.

        *Capacidade: avaliar a resolução · `ENUNCIADO · aberto` (S10) + D1. Comando: `Avaliar resolução`.
        Permissão: `ocorrencia.avaliar` — **só o Solicitante autor**.*
      parameters:
        - $ref: "#/components/parameters/OcorrenciaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nota]
              properties:
                nota: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string, maxLength: 1000 }
            example: { nota: 5, comentario: "Resolveram no mesmo dia e avisaram quando terminou." }
      responses:
        "200": { $ref: "#/components/responses/ComandoExecutado" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: Só o Solicitante autor avalia.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/somente-o-autor-pode-avaliar"
                title: "Só quem registrou pode avaliar"
                status: 403
                codigo: "SOMENTE_O_AUTOR_PODE_AVALIAR"
                traceId: "01JB8Z6K9T2M4N7Q"
        "404": { $ref: "#/components/responses/OcorrenciaNaoEncontrada" }
        "409":
          description: Ocorrência não está resolvida, ou já foi avaliada.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                naoResolvida:
                  value: { type: "https://resolveai.app/erros/avaliacao-exige-resolvida", title: "Ainda não dá para avaliar", status: 409, codigo: "AVALIACAO_EXIGE_RESOLVIDA", traceId: "01JB8Z6K9T2M4N7Q", statusAtual: "em_atendimento" }
                jaAvaliada:
                  value: { type: "https://resolveai.app/erros/ja-avaliada", title: "Já avaliada", status: 409, codigo: "JA_AVALIADA", traceId: "01JB8Z6K9T2M4N7Q", statusAtual: "resolvida" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: obterDashboard
      summary: Indicadores de gestão
      description: |
        Os indicadores do painel, em **uma requisição** — o dashboard é uma tela, e a aplicação escala a
        zero: cinco requisições poderiam significar cinco esperas de partida a frio.

        O corte que organiza os números: **a listagem responde *o que eu faço agora*; o dashboard responde
        *o que eu mudo no mês*.** Por isso `backlogPorStatus` e `abertasPorCategoria` são fotografia de
        agora (os dois ignoram a janela) e `recorrencia` é série mensal dentro dela.

        **Os dois blocos de fotografia contam conjuntos diferentes, e não somam o mesmo número.**
        `backlogPorStatus` conta tudo o que a organização registrou, inclusive o que já terminou;
        `abertasPorCategoria` conta só o que está em aberto. A tela escreve isso nos dois quadros.

        **O painel conta também a idade do que está em aberto, e é o único número que olha para o que
        NÃO terminou.** Os outros saem do que já acabou — uma operação que deixasse os casos difíceis de
        lado veria os indicadores melhorarem. `abertasPorIdade` conta o mesmo conjunto que
        `abertasPorCategoria`, por outro corte, e as duas somas fecham.

        **A recorrência é o que tira o Gestor do reativo.** As duas séries contam o volume, cada uma por
        uma dimensão; `duplasRecorrentes` cruza as duas na linha da ocorrência e diz o que está voltando.
        A tela soma as séries de categoria para saber quanto entrou em cada mês, e não desenha
        `recorrenciaPorArea`, que continua na resposta para não quebrar quem já a lê.

        **O saldo do período é o que entrou menos o que saiu**, e sai é resolvida ou cancelada: a soma
        das séries de categoria, menos `tempoDeResolucao.porMes[].resolvidas`, menos `canceladasPorMes`.
        `emAbertoNoInicio` é medido na trilha, e não derivado: por isso a conta *em aberto agora menos o
        saldo é o que estava em aberto no início* pode ser conferida, e fecha quando a janela termina
        hoje. Com `ate` no passado, o que entrou e saiu depois dele mexe no agora e em nenhum dos termos.

        `maisVelhasEmAberto` aponta as ocorrências que esperam há mais tempo, e é o único campo do painel
        que nomeia um caso.

        `mediaDasAvaliacoes` e `tempoDeResolucao` vêm com o denominador de propósito: sem ele, a média
        mente quando poucos avaliam, e o percentil mente quando o mês teve duas resoluções.

        `tempoDeResolucao` é **tempo de calendário** — do registro à resolução, pausas incluídas.
        Separar calendário de tempo ativo é evolução prevista. Cada mês traz a **mediana** e o **p90**, e
        não a média: duração de atendimento tem cauda longa. Mês sem nenhuma resolução aparece com
        `mediana: null`, em vez de sumir da série: buraco é informação, e omitir o mês faria o gráfico
        mentir.

        *Ocorrências por status, em aberto por categoria e por idade, as mais velhas em aberto, entradas e
        saídas por mês, o que está voltando, tempo de resolução mês a mês e a satisfação com a
        distribuição das notas. Permissão: `dashboard.ler` — Gestor.*
      parameters:
        - name: de
          in: query
          description: Início da janela, em America/Sao_Paulo. Padrão — 90 dias atrás.
          schema: { type: string, format: date }
        - name: ate
          in: query
          description: Fim da janela, em America/Sao_Paulo. Padrão — hoje.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Indicadores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
              example:
                periodo: { de: "2026-05-23", ate: "2026-08-20" }
                backlogPorStatus:
                  - { status: "aberta", statusRotulo: "Aberta", quantidade: 12 }
                  - { status: "em_analise", statusRotulo: "Em análise", quantidade: 7 }
                  - { status: "em_atendimento", statusRotulo: "Em atendimento", quantidade: 4 }
                  - { status: "pausada", statusRotulo: "Pausada", quantidade: 3 }
                # As duas listas do exemplo são recortes, não conjuntos completos: `backlogPorStatus`
                # mostra quatro dos seis status e `abertasPorCategoria` mostra duas das categorias. Por
                # isso as somas não fecham aqui. Na resposta de verdade elas fecham: a soma de
                # `abertasPorCategoria` é IGUAL à soma das quatro linhas não terminais de
                # `backlogPorStatus`, porque toda ocorrência tem categoria.
                abertasPorCategoria:
                  - { categoria: { id: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d", nome: "Vazamentos" }, quantidade: 8, envelhecidas: 5 }
                  - { categoria: { id: "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d", nome: "Iluminação" }, quantidade: 6, envelhecidas: 0 }
                abertasPorIdade:
                  - { deDias: 0, ateDias: 7, quantidade: 12 }
                  - { deDias: 8, ateDias: 30, quantidade: 5 }
                  - { deDias: 31, ateDias: 90, quantidade: 2 }
                  - { deDias: 91, ateDias: null, quantidade: 1 }
                mediaDasAvaliacoes:
                  media: 4.3
                  avaliadas: 31
                  resolvidas: 47
                  distribuicao:
                    - { nota: 1, quantidade: 1 }
                    - { nota: 2, quantidade: 1 }
                    - { nota: 3, quantidade: 2 }
                    - { nota: 4, quantidade: 8 }
                    - { nota: 5, quantidade: 19 }
                recorrenciaPorCategoria:
                  - categoria: { id: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d", nome: "Vazamentos" }
                    porMes:
                      - { mes: "2026-06", quantidade: 3 }
                      - { mes: "2026-07", quantidade: 5 }
                      - { mes: "2026-08", quantidade: 4 }
                recorrenciaPorArea:
                  - area: { id: "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e", nome: "Garagem — Subsolo 1", tipo: "comum" }
                    porMes:
                      - { mes: "2026-06", quantidade: 2 }
                      - { mes: "2026-07", quantidade: 6 }
                      - { mes: "2026-08", quantidade: 4 }
                duplasRecorrentes:
                  - area: { id: "0f9a4d71-1111-4b2c-9d3e-4f5a6b7c8d9e", nome: "Garagem — Subsolo 1", tipo: "comum", ativa: true, ordem: 3 }
                    categoria: { id: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d", nome: "Vazamentos" }
                    quantidade: 8
                tempoDeResolucao:
                  porMes:
                    - { mes: "2026-06", mediana: 10.42, p90: 92.5, amostra: null, resolvidas: 11 }
                    - { mes: "2026-07", mediana: 0.2, p90: null, amostra: [0.07, 0.2, 1.54], resolvidas: 3 }
                    - { mes: "2026-08", mediana: null, p90: null, amostra: null, resolvidas: 0 }
                # O exemplo é um recorte, mas a conferência fecha dentro dele: 12 registradas (a série
                # de Vazamentos), 14 resolvidas e 2 canceladas dão saldo de −4, e 24 − 4 é a soma de
                # `abertasPorIdade`.
                canceladasPorMes:
                  - { mes: "2026-06", quantidade: 1 }
                  - { mes: "2026-07", quantidade: 0 }
                  - { mes: "2026-08", quantidade: 1 }
                emAbertoNoInicio: 24
                maisVelhasEmAberto:
                  - { id: "3c2b1a09-1111-4d5e-8f70-1a2b3c4d5e6f", titulo: "Infiltração no teto da garagem", status: "pausada", statusRotulo: "Pausada", idadeEmDias: 104 }
                  - { id: "3c2b1a09-2222-4d5e-8f70-1a2b3c4d5e6f", titulo: "Portão da garagem não fecha", status: "em_atendimento", statusRotulo: "Em atendimento", idadeEmDias: 61 }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

components:

  securitySchemes:
    sessaoSupabase:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: |
        Cookie de sessão emitido pelo provedor de autenticação (Supabase Auth). É como o PWA se autentica.
        **Criar conta, entrar e sair não são operações desta API** — autenticação é subdomínio genérico,
        comprado e integrado como Conformista, com camada anticorrupção: o domínio nunca vê token.
    bearerSupabase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` — a mesma sessão, para `curl`, Postman e testes de ponta a
        ponta. **A organização ativa continua vindo do cookie de sessão**, então clientes fora do navegador
        precisam guardar cookies (`curl -c/-b`) depois de chamar `PUT /contexto/organizacao`.

  parameters:
    OrganizacaoAfirmada:
      name: X-Organizacao-Id
      in: header
      required: false
      description: |
        **Afirmação, nunca fonte.** Este cabeçalho não escolhe a organização — apenas confirma a que a
        sessão já escolheu. Ausente, não há verificação; presente e diferente da organização ativa, a
        requisição é recusada com `409 ORGANIZACAO_DIVERGENTE` e **nada é executado**.

        Existe para uma falha operacional real: duas abas do PWA compartilham o cookie, e trocar de
        organização numa delas muda silenciosamente o contexto da outra.
      schema: { type: string, format: uuid }
    OcorrenciaId:
      name: ocorrenciaId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: "9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8"
    AnexoId:
      name: anexoId
      in: path
      required: true
      description: |
        O anexo é endereçado **dentro da ocorrência**, nunca no nível superior: é ela que decide quem pode
        ler. O valor vem pronto em `OcorrenciaDetalhe.anexos[].url` — o cliente não o monta.
      schema: { type: string, format: uuid }
      example: "c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f"
    PedidoId:
      name: pedidoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PessoaId:
      name: pessoaId
      in: path
      required: true
      description: A Pessoa é endereçada **através do vínculo**, dentro da organização ativa. Não existe endereço global de Pessoa.
      schema: { type: string, format: uuid }
    CategoriaId:
      name: categoriaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AreaId:
      name: areaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limite:
      name: limite
      in: query
      description: Tamanho da página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Pagina:
      name: pagina
      in: query
      description: |
        Número da página, começando em 1. A navegação é numerada **sobre um instante de corte** — ver
        `Ate`. Acima de 1000 é `400`: deslocamento fundo é varredura, e nenhuma tela do produto oferece o
        milésimo clique.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    Ate:
      name: ate
      in: query
      description: |
        O **instante de corte** da navegação, ISO 8601 com fuso. A primeira página o fixa em *agora* e o
        devolve; as seguintes o repassam, e a consulta filtra `registradaEm <= ate`. Ocorrência registrada
        depois **não entra no conjunto** e portanto não desloca nada — é o que substitui a imunidade que o
        cursor dava.

        Valor no futuro é **limitado a agora**, não recusado: relógio de aparelho adiantado por segundos é
        rotina. Valor ilegível é `400`, nunca *agora*.

        **Não confundir com o `ate` de `GET /dashboard`**, que é um **dia** (`AAAA-MM-DD`) e delimita a
        janela do indicador. Mesma palavra, dois endpoints, duas gramáticas — registrado em vez de
        renomeado, porque o critério 14b.2 nomeia este parâmetro.
      schema: { type: string, format: date-time }
      example: "2026-09-09T08:00:00Z"
    TotalNoCorte:
      name: totalNoCorte
      in: query
      description: |
        O `total` que a **primeira** página devolveu, repassado. O servidor mede quanto o conjunto encolheu
        desde o corte (`totalNoCorte − total`) e **recua o deslocamento na mesma medida** — é o que impede
        que uma ocorrência triada entre duas páginas faça outra ser **pulada**.

        **É dica, não autoridade.** Valor alto demais limita o deslocamento em zero e repete a primeira
        página; valor baixo demais devolve o deslocamento cru. Nenhum valor produz salto além do que um
        deslocamento sem compensação já produziria.

        **Copie o campo `totalNoCorte` da resposta**, nunca o `total`: o `total` é recalculado a cada
        página e usá-lo desliga a compensação sem nenhum sintoma visível.
      schema: { type: integer, minimum: 0 }
    Cursor:
      name: cursor
      in: query
      description: |
        Cursor opaco devolvido em `proximoCursor`. Codifica o par (instante, id) — o mesmo par do índice
        de ordenação. Não é deslocamento numérico, e por isso a lista não duplica itens quando algo novo é
        registrado entre uma página e outra.

        **Usado apenas na conversa.** A listagem de ocorrências passou a paginação numerada em 09/09/2026
        — ver §7.7 do contrato.
      schema: { type: string }

  responses:
    ComandoExecutado:
      description: |
        Comando executado. Devolve a ocorrência atualizada **com `ultimaTransicao`** — o registro de
        auditoria recém-gravado. É `200`, e não `201`, porque nenhum recurso endereçável foi criado: o
        registro de transição não tem URL própria, por desenho.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OcorrenciaDetalhe" }
    FormatoInvalido:
      description: |
        Requisição mal formada — campo faltando, tipo errado, tamanho fora do limite. Rejeitada na camada
        de interface, contra o schema, antes de o domínio ser acionado.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/formato-invalido"
            title: "Requisição inválida"
            status: 400
            detail: "Confira os campos indicados."
            codigo: "FORMATO_INVALIDO"
            traceId: "01JB8Z6K9T2M4N7Q"
            erros:
              - { campo: "titulo", codigo: "OBRIGATORIO", mensagem: "Informe um título." }
              - { campo: "descricao", codigo: "TAMANHO_MAXIMO", mensagem: "A descrição excede o limite." }
    NaoAutenticado:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "https://resolveai.app/erros/nao-autenticado", title: "Não autenticado", status: 401, codigo: "NAO_AUTENTICADO", traceId: "01JB8Z6K9T2M4N7Q" }
    SemOrganizacaoAtiva:
      description: |
        Autenticado, mas a sessão ainda não tem organização ativa. Chame `PUT /contexto/organizacao`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/sem-organizacao-ativa"
            title: "Escolha uma organização"
            status: 403
            detail: "Sua sessão ainda não tem organização ativa."
            codigo: "SEM_ORGANIZACAO_ATIVA"
            traceId: "01JB8Z6K9T2M4N7Q"
    SemPermissao:
      description: |
        O papel do vínculo não tem a permissão exigida — ou a operação depende de uma relação com o recurso
        (ser o autor, ser o responsável) que o chamador não tem. As checagens perguntam o que o vínculo
        **pode**, nunca qual é o papel dele.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/permissao-insuficiente"
            title: "Sem permissão"
            status: 403
            detail: "Seu papel nesta organização não permite esta ação."
            codigo: "PERMISSAO_INSUFICIENTE"
            traceId: "01JB8Z6K9T2M4N7Q"
    OrganizacaoDivergente:
      description: |
        O cabeçalho `X-Organizacao-Id` afirma uma organização diferente da que está ativa na sessão.
        **Nada foi executado.**
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/organizacao-divergente"
            title: "Contexto trocado"
            status: 409
            detail: "Sua sessão está em outra organização. Recarregue a página."
            codigo: "ORGANIZACAO_DIVERGENTE"
            traceId: "01JB8Z6K9T2M4N7Q"
    OcorrenciaNaoEncontrada:
      description: |
        A ocorrência não existe **para quem pediu**. A resposta é idêntica quando ela nunca existiu, quando
        pertence a outra organização e quando é de outro Solicitante — porque `403` confirmaria que aquele
        identificador existe, e isso seria vazar informação pelo código de status num produto cujo primeiro
        requisito não funcional é isolamento.

        Para depurar: o corpo traz `organizacaoAtiva` — metade das vezes a resposta é *"estou na organização
        errada"* — e o `traceId`, que no log do servidor distingue *inexistente* de *fora da organização*.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/ocorrencia-nao-encontrada"
            title: "Ocorrência não encontrada"
            status: 404
            codigo: "OCORRENCIA_NAO_ENCONTRADA"
            traceId: "01JB8Z6K9T2M4N7Q"
            organizacaoAtiva: { id: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed", nome: "Condomínio Recanto Azul" }
    PedidoNaoEncontrado:
      description: O pedido não existe nesta organização.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "https://resolveai.app/erros/pedido-nao-encontrado", title: "Pedido não encontrado", status: 404, codigo: "PEDIDO_NAO_ENCONTRADO", traceId: "01JB8Z6K9T2M4N7Q" }
    CategoriaNaoEncontrada:
      description: A categoria não existe nesta organização.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "https://resolveai.app/erros/categoria-nao-encontrada", title: "Categoria não encontrada", status: 404, codigo: "CATEGORIA_NAO_ENCONTRADA", traceId: "01JB8Z6K9T2M4N7Q" }
    AreaNaoEncontrada:
      description: A área não existe nesta organização.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "https://resolveai.app/erros/area-nao-encontrada", title: "Área não encontrada", status: 404, codigo: "AREA_NAO_ENCONTRADA", traceId: "01JB8Z6K9T2M4N7Q" }
    NomeDuplicado:
      description: |
        Já existe outra categoria (ou área) com este nome na organização. Não é capricho: dois nomes iguais
        quebrariam o indicador de recorrência, que é o número mais importante do dashboard.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "https://resolveai.app/erros/categoria-nome-duplicado", title: "Nome já usado", status: 409, codigo: "CATEGORIA_NOME_DUPLICADO", traceId: "01JB8Z6K9T2M4N7Q" }
    ListaDesatualizada:
      description: |
        **Nada foi gravado.** O conjunto de `ids` não é o conjunto atual da lista
        (`LISTA_DESATUALIZADA`), e o cliente recarrega a lista antes de tentar de novo; ou o cabeçalho
        `X-Organizacao-Id` afirma outra organização (`ORGANIZACAO_DIVERGENTE`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          examples:
            listaDesatualizada:
              summary: A lista mudou desde que foi lida
              value:
                type: "https://resolveai.app/erros/lista-desatualizada"
                title: "Lista desatualizada"
                status: 409
                detail: "A lista mudou desde que você a abriu."
                codigo: "LISTA_DESATUALIZADA"
                traceId: "01JB8Z6K9T2M4N7Q"
            organizacaoDivergente:
              summary: A aba está em outra organização
              value:
                type: "https://resolveai.app/erros/organizacao-divergente"
                title: "Organização divergente"
                status: 409
                detail: "Esta aba está em outra organização. Recarregue a página antes de continuar."
                codigo: "ORGANIZACAO_DIVERGENTE"
                traceId: "01JB8Z6K9T2M4N7Q"
    TransicaoNaoPermitida:
      description: |
        O par (status atual, comando) não está na tabela de transições do agregado. **Toda transição fora
        dela é este erro.** O corpo traz `statusAtual` e `acoesDisponiveis`, para que o cliente descubra
        pelo próprio erro o que pode fazer.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example:
            type: "https://resolveai.app/erros/transicao-nao-permitida"
            title: "Transição não permitida"
            status: 409
            detail: "Não é possível resolver uma ocorrência que está aberta."
            codigo: "TRANSICAO_NAO_PERMITIDA"
            traceId: "01JB8Z6K9T2M4N7Q"
            statusAtual: "aberta"
            acoesDisponiveis: ["analisar", "atribuir-responsavel", "alterar-prioridade", "cancelar"]
    ErroInterno:
      description: Falha inesperada. Sem detalhe de domínio — só o `traceId`, que liga ao log.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
          example: { type: "about:blank", title: "Erro interno", status: 500, codigo: "ERRO_INTERNO", traceId: "01JB8Z6K9T2M4N7Q" }

  schemas:

    Problema:
      type: object
      description: |
        Corpo de erro uniforme, no formato RFC 9457 (`application/problem+json`), com três extensões.

        **`codigo` é o contrato**: estável, comparável por código de cliente. `title` e `detail` são texto
        para gente e podem mudar sem aviso — nunca compare por eles.
      required: [type, title, status, codigo, traceId]
      properties:
        type: { type: string, format: uri, description: "URI de documentação do erro." }
        title: { type: string, description: "Resumo legível, em pt-BR." }
        status: { type: integer }
        detail: { type: string, description: "Explicação em pt-BR, exibível ao usuário." }
        instance: { type: string, description: "Caminho da requisição que falhou." }
        codigo: { type: string, description: "Código estável do erro.", example: "TRANSICAO_NAO_PERMITIDA" }
        traceId: { type: string, description: "Liga esta resposta à linha de log do servidor." }
        erros:
          type: array
          description: Só em `400` — uma entrada por campo violado.
          items:
            type: object
            required: [campo, codigo]
            properties:
              campo: { type: string }
              codigo: { type: string }
              mensagem: { type: string }
        statusAtual:
          description: Em conflitos de estado — o status da ocorrência no momento da recusa.
          $ref: "#/components/schemas/StatusOcorrencia"
        acoesDisponiveis:
          type: array
          description: Em conflitos de estado — o que o chamador pode fazer agora.
          items: { $ref: "#/components/schemas/Comando" }
        organizacaoAtiva:
          type: object
          description: Em `404` — a organização em que a sessão está, para desfazer o engano mais comum.
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        ocorrenciaId:
          type: string
          format: uuid
          description: |
            Só em `409 ANEXO_JA_REIVINDICADO` — a ocorrência que **já** tem este anexo. Existe para que o
            cliente possa navegar até ela em vez de pedir à pessoa que registre de novo. É seguro devolver:
            o `ticket` amarra a chave a quem pediu, então quem recebe este erro é o próprio autor.

    StatusOcorrencia:
      type: string
      description: |
        Os cinco status do desafio mais `pausada`, acréscimo autorizado pelo *"no mínimo"* do enunciado.
        `resolvida` e `cancelada` são terminais de verdade — **não existe reabertura**.
      enum: [aberta, em_analise, em_atendimento, pausada, resolvida, cancelada]

    PrioridadeOcorrencia:
      type: string
      description: Nasce `normal`; congela em estado terminal.
      enum: [baixa, normal, alta]

    TipoArea:
      type: string
      description: |
        Deriva a visibilidade da ocorrência, **conforme o tipo vigente no momento do registro** — não o
        atual. Reclassificar a Área não muda o que já foi registrado.
      enum: [comum, privativa]

    PapelVinculo:
      type: string
      description: |
        O que a Pessoa é dentro da Organização. O papel define a visão padrão e o conjunto de permissões —
        **não retira capacidade que o desafio concede**: o Gestor acumula as do Solicitante, e é por isso
        que o síndico que mora no prédio não precisa de um segundo vínculo.

        Nesta entrega, `encarregado` **não tem permissão nenhuma**: ele existe como cadastro e
        recebe atribuições, mas o acesso próprio dele é evolução prevista.
      enum: [gestor, solicitante, encarregado]

    MotivoPausa:
      type: string
      description: Obrigatório ao pausar. Nomear a espera é o que permite vigiá-la.
      enum: [aguardando_informacao_solicitante, aguardando_peca, aguardando_autorizacao, aguardando_terceiro]

    MotivoCancelamento:
      type: string
      description: |
        Conjunto único, filtrado por papel na autorização: o Solicitante usa `desistencia`,
        `resolvido_por_conta_propria`, `aberta_por_engano` e `duplicada`; o Gestor usa todos.
        `Cancelada` não é *"resolvida com resultado ruim"* — o motivo importa tanto quanto o fato.
      enum: [desistencia, resolvido_por_conta_propria, aberta_por_engano, duplicada, improcedente, fora_de_escopo, sem_informacao_suficiente]

    SituacaoPedidoEntrada:
      type: string
      enum: [pendente, aprovado, recusado]

    Comando:
      type: string
      description: |
        Os comandos do agregado, com o mesmo nome que têm no domínio.

        **A ordem deste enum é estável e significativa, e `acoesDisponiveis` a respeita**: os comandos que
        movem a ocorrência adiante vêm na sequência do ciclo de vida, e os que não movem — `alterar-prioridade`
        e `cancelar` — vêm por último.

        Isso existe para que o cliente **não mantenha uma segunda lista de comandos** só para ordená-los na
        tela: renderizar na ordem recebida já produz uma barra coerente. **Não é promessa de que o primeiro
        item seja a ação em destaque** — em `em_atendimento`, por exemplo, `pausar` precede `resolver`.
        Escolher o destaque é decisão de tela, e a regra está no inventário de telas.
      enum: [analisar, atribuir-responsavel, iniciar-atendimento, pausar, retomar, registrar-solucao-aplicada, resolver, avaliar, alterar-prioridade, cancelar]

    PessoaReferencia:
      type: object
      description: |
        Como uma Pessoa aparece **dentro** de um recurso escopado — autor, responsável, autor da transição.
        Nunca traz contato, e nunca é endereçável por conta própria.
      required: [pessoaId, nome]
      properties:
        pessoaId: { type: string, format: uuid }
        nome: { type: string, maxLength: 120 }

    TipoContato:
      type: string
      description: |
        O meio pelo qual se alcança a Pessoa. É o `system` do `ContactPoint` do HL7 FHIR, **podado aos dois
        valores que este produto alcança** — declarar `fax`, `pager` ou `url` seria publicar valores que
        ninguém produz.
      enum: [email, telefone]

    FinalidadeContato:
      type: string
      description: |
        Para que serve este contato. É o `use` do FHIR, traduzido: `recado` é o telefone de terceiro que
        aceita mensagem — a portaria, o escritório da terceirizada.
      enum: [pessoal, trabalho, recado]

    Contato:
      type: object
      description: |
        Uma forma de alcançar a Pessoa. **Contato é dado pessoal sob o RNF10** e só aparece em
        `GET /vinculos`, que exige `vinculo.gerir`.
      required: [id, tipo, valor, finalidade, temWhatsapp, ordem]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoContato" }
        valor:
          type: string
          maxLength: 255
          description: |
            **Telefone vem e vai em E.164** — `+5511987654321`, com `+`, código do país e até 15 dígitos.
            É o formato que o banco impõe por `CHECK` e o que um link de WhatsApp consome direto.
            Normalizar o que a pessoa digitou é do cliente ou do servidor, **antes** de chegar aqui.
          examples: ["+5511987654321", "sindica@exemplo.com"]
        finalidade: { $ref: "#/components/schemas/FinalidadeContato" }
        temWhatsapp:
          type: boolean
          description: |
            **Indicação sobre um número, não um tipo de contato** — por isso é booleano e não um valor de
            `tipo`. Só pode ser `true` quando `tipo` é `telefone`; o banco recusa o contrário.
        ordem:
          type: integer
          minimum: 1
          description: |
            Ordem de preferência: **`1` é para onde se tenta primeiro**. É o `rank` do FHIR. Substitui um
            booleano `principal`, que não diria o que fazer com o segundo contato.
        observacao:
          type: [string, "null"]
          maxLength: 200
          description: 'Instrução humana — "falar com a portaria", "só à tarde".'

    ContatoParaEscrita:
      type: object
      description: |
        Como um contato **entra**. Sem `id`: a escrita é **substituição** — o corpo traz a lista completa,
        e o servidor troca os contatos daquela Pessoa por ela.
      required: [tipo, valor]
      properties:
        tipo: { $ref: "#/components/schemas/TipoContato" }
        valor:
          type: string
          maxLength: 255
          description: Telefone **em E.164**; e-mail em forma normal. Fora disso é `400 FORMATO_INVALIDO`.
        finalidade: { $ref: "#/components/schemas/FinalidadeContato" }
        temWhatsapp: { type: boolean, default: false }
        ordem: { type: integer, minimum: 1, default: 1 }
        observacao: { type: [string, "null"], maxLength: 200 }

    PessoaComContato:
      allOf:
        - $ref: "#/components/schemas/PessoaReferencia"
        - type: object
          description: Só aparece em `GET /vinculos`, que exige permissão de gestão de vínculos — contato é dado pessoal.
          required: [contatos]
          properties:
            contatos:
              type: array
              description: |
                Lista vazia quando não há contato — nunca `null`, para o cliente não precisar de dois
                caminhos de leitura. Ordenada por `ordem`.
              items: { $ref: "#/components/schemas/Contato" }

    PessoaDoPedido:
      allOf:
        - $ref: "#/components/schemas/PessoaReferencia"
        - type: object
          description: |
            Como quem pediu entrada aparece para o Gestor que vai decidir. **Não é `PessoaComContato`, e a
            diferença é de privacidade, não de conveniência:** `contatos` é tabela **global**, então
            devolver a lista aqui mostraria ao Gestor desta organização os contatos que a pessoa cadastrou
            em **outra**. O pedido carrega apenas o telefone que a própria pessoa informou nele — um valor,
            não uma lista —, e é o mais que este Gestor tem direito de ver antes de aprovar.
          properties:
            telefoneInformado:
              type: [string, "null"]
              description: O telefone enviado no próprio pedido, em E.164. `null` se não foi informado.

    Contexto:
      type: object
      description: |
        Quem sou eu, em qual organização estou agora, o que posso fazer, e onde mais tenho vínculo.
        A lista de vínculos parte de `vinculos`, nunca de `pessoas`.
      required: [pessoa, organizacaoAtiva, papel, permissoes, vinculos, pedidosDeEntrada]
      properties:
        pessoa: { $ref: "#/components/schemas/PessoaReferencia" }
        organizacaoAtiva:
          oneOf:
            - $ref: "#/components/schemas/OrganizacaoResumo"
            - type: "null"
        papel:
          oneOf:
            - $ref: "#/components/schemas/PapelVinculo"
            - type: "null"
        permissoes:
          type: array
          description: O que este vínculo pode fazer. É a lista que a interface usa para desenhar (ou esconder) ações.
          items: { type: string }
        vinculos:
          type: array
          description: Todas as organizações em que a Pessoa tem vínculo ativo — o insumo do seletor de organização.
          items:
            type: object
            required: [organizacaoId, nome, papel, codigoPublico]
            properties:
              organizacaoId: { type: string, format: uuid }
              nome: { type: string }
              papel: { $ref: "#/components/schemas/PapelVinculo" }
              codigoPublico:
                type: string
                description: |
                  O código do cartaz do elevador da organização deste vínculo — **o mesmo campo do
                  `OrganizacaoResumo`**, aqui como propriedade solta e não por `$ref`, porque este item usa
                  `organizacaoId` e não `organizacao.id`.

                  **Para que serve:** casar o código digitado na tela de entrar numa organização com um
                  vínculo que a Pessoa já tem, **antes de enviar**. Sem ele o cliente só descobria o
                  encontro pelo `409 JA_VINCULADO`, cujo corpo não carrega identidade nenhuma — e a tela
                  não conseguia oferecer *"entrar nela"* nomeando a organização (critério **7b.4**). Com o
                  campo, o `409` volta a ser só o que é: corrida entre abas.

                  **Não é vazamento:** o que se publica é o código público **das organizações da própria
                  Pessoa, para ela mesma**, e ele já é *"público por natureza"* — quem o usa abre um pedido
                  de entrada, não um acesso. O dado já vinha do servidor em `VinculoNaOrganizacao`; a
                  projeção o descartava por escolha, e **nenhuma consulta muda**.

                  *(Acrescentado em 30/08/2026: até esta data o item declarava três propriedades, e o
                  produto já projetava a quarta desde o item 7b. Item 22 da fila da frente de
                  documentação.)*
        pedidosDeEntrada:
          type: array
          description: Pedidos da própria Pessoa, para a tela de quem ainda está esperando aprovação.
          items: { $ref: "#/components/schemas/PedidoDeEntrada" }

    OrganizacaoResumo:
      type: object
      required: [id, nome, codigoPublico]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        codigoPublico:
          type: string
          description: O código do cartaz do elevador. É público por natureza — quem o usa abre um pedido de entrada, não um acesso.

    Organizacao:
      allOf:
        - $ref: "#/components/schemas/OrganizacaoResumo"
        - type: object
          required: [criadoEm]
          properties:
            criadoEm: { type: string, format: date-time }
            categoriasSemeadas:
              type: integer
              description: Quantas categorias-semente a política criou junto com a organização.
            areasSemeadas:
              type: integer
              description: Quantas áreas-semente a política criou junto com a organização.

    MudancaDeConfiguracao:
      type: object
      description: |
        Uma mudança de configuração da organização. **A trilha é append-only**: o banco recusa alteração
        e remoção (D30). Os dois valores vão como texto, porque ali o dado é registro e não regra.

        Nas chaves de texto, o padrão aparece como texto vazio nas duas pontas: um Gestor pode escrever
        a palavra *padrão* como texto, e a trilha precisa distinguir as duas coisas.
      required: [chave, valorAnterior, valorNovo, autor, ocorridaEm]
      properties:
        chave:
          type: string
          enum:
            [
              exigir_solucao_ao_resolver,
              limite_cancelamento_solicitante,
              dias_para_parada,
              rotulo_aberta,
              rotulo_em_analise,
              rotulo_em_atendimento,
              rotulo_pausada,
              rotulo_resolvida,
              rotulo_cancelada,
            ]
        valorAnterior: { type: string }
        valorNovo: { type: string }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        ocorridaEm: { type: string, format: date-time }

    Configuracao:
      type: object
      description: |
        As regras do atendimento da organização, e a trilha de cada mudança delas. A lista vem da mais
        recente para a mais antiga, e é `[]` numa organização que nunca mudou regra nenhuma.
      required:
        [
          exigirSolucaoAoResolver,
          limiteDeCancelamentoDoSolicitante,
          diasParaParada,
          rotulosDoSolicitante,
          mudancas,
        ]
      properties:
        exigirSolucaoAoResolver:
          type: boolean
          description: Ligado, resolver sem a solução aplicada responde `422 SOLUCAO_OBRIGATORIA`.
        limiteDeCancelamentoDoSolicitante:
          type: string
          enum: [em_analise, em_atendimento]
          description: |
            Até qual estado o Solicitante autor cancela a própria ocorrência (D29). Em `em_atendimento`,
            inclui `Pausada`.
        diasParaParada:
          type: integer
          minimum: 1
          maximum: 90
          description: |
            Quantos dias sem atividade até a ocorrência contar como parada. A atividade é a última
            atualização da ocorrência — transição, atribuição ou mensagem no canal. As pausadas e as que
            já terminaram não contam.
        rotulosDoSolicitante:
          $ref: "#/components/schemas/RotulosDoSolicitante"
        mudancas:
          type: array
          items: { $ref: "#/components/schemas/MudancaDeConfiguracao" }

    RotulosDoSolicitante:
      type: object
      description: |
        O texto com que o Solicitante lê cada ponto do ciclo nesta organização. `null` significa que vale
        o padrão, e o padrão é o do glossário do projeto. O Gestor, o painel e o histórico oficial
        continuam com o nome do ciclo.

        Os seis vêm sempre, para que a tela não precise distinguir *não customizado* de *campo ausente*.
      required: [aberta, em_analise, em_atendimento, pausada, resolvida, cancelada]
      properties:
        aberta: { type: [string, "null"], maxLength: 40 }
        em_analise: { type: [string, "null"], maxLength: 40 }
        em_atendimento: { type: [string, "null"], maxLength: 40 }
        pausada: { type: [string, "null"], maxLength: 40 }
        resolvida: { type: [string, "null"], maxLength: 40 }
        cancelada: { type: [string, "null"], maxLength: 40 }

    Convite:
      type: object
      description: |
        O convite lido pelo código. **São exatamente três campos, e nada mais** — não há identificador,
        contagem, tipo nem pessoa, porque este corpo é entregue a quem não tem sessão.
      required: [organizacao, situacao]
      properties:
        organizacao:
          type: object
          description: Só o nome e o código.
          required: [nome, codigoPublico]
          properties:
            nome: { type: string }
            codigoPublico: { type: string, pattern: "^[A-Z0-9]{6,12}$" }
        situacao:
          type: string
          description: Decidida no servidor, para que a API e a página digam a mesma coisa.
          enum: [sem-sessao, pode-pedir, ja-participa, pedido-pendente]

    PedidoDeEntrada:
      type: object
      required: [id, situacao, criadoEm]
      properties:
        id: { type: string, format: uuid }
        organizacao:
          type: object
          description: Só o nome — o código é público, mas isso não autoriza ler quem está dentro.
          properties:
            nome: { type: string }
        situacao: { $ref: "#/components/schemas/SituacaoPedidoEntrada" }
        criadoEm: { type: string, format: date-time }

    PedidoDeEntradaDetalhe:
      type: object
      description: Como o Gestor vê o pedido, com os dados de contato de quem pediu.
      required: [id, pessoa, situacao, criadoEm]
      properties:
        id: { type: string, format: uuid }
        pessoa: { $ref: "#/components/schemas/PessoaDoPedido" }
        situacao: { $ref: "#/components/schemas/SituacaoPedidoEntrada" }
        criadoEm: { type: string, format: date-time }
        decididoEm: { type: [string, "null"], format: date-time }
        decididoPor:
          oneOf:
            - $ref: "#/components/schemas/PessoaReferencia"
            - type: "null"

    Vinculo:
      type: object
      description: A ligação entre uma Pessoa, um Papel e uma Organização. É a ponte entre o global e o escopado.
      required: [pessoa, papel, temConta, criadoEm, atualizadoEm]
      properties:
        pessoa: { $ref: "#/components/schemas/PessoaComContato" }
        papel: { $ref: "#/components/schemas/PapelVinculo" }
        area:
          description: |
            A **unidade** desta pessoa nesta organização — o apartamento 302, a sala 14. `null` para quem
            não tem unidade: Gestor, Encarregado terceirizado, e quem entrou por pedido de entrada sem
            informá-la. **Pertence ao vínculo e não à Pessoa**, porque a mesma pessoa mora num lugar e
            trabalha em outro.
          oneOf:
            - type: "null"
            - type: object
              required: [id, nome]
              properties:
                id: { type: string, format: uuid }
                nome: { type: string }
        temConta:
          type: boolean
          description: |
            `false` é o Encarregado sem conta — existe como cadastro, recebe atribuições e aparece como
            responsável, e **para agir no sistema seria preciso ter conta**.
        criadoEm: { type: string, format: date-time }
        atualizadoEm:
          type: [string, "null"]
          format: date-time
          description: |
            Quando este participante mudou pela última vez: a **maior** entre o relógio da Pessoa e o do
            Vínculo, os dois carimbados por gatilho do banco. `null` quer dizer **nenhuma alteração
            registrada** — a tela mostra um traço, e nunca a data de entrada.

            **O relógio da Pessoa é global.** Quem troca o próprio nome move esta data em toda
            organização onde participa, e a resposta não diz quem mexeu.

    IconeCategoria:
      type: string
      description: |
        O ícone da categoria — **identificador do conjunto `lucide`**, nunca emoji e nunca URL.

        **A lista é fechada**, e a fonte normativa é a §14.5 do `modelo-de-dados.md`. Ela existe porque um
        seletor de mil e quinhentos ícones num celular é busca, não seletor, e porque um `varchar` livre
        produz categoria sem ícone por erro de digitação, em silêncio e para sempre.

        **É opcional no corpo: o servidor grava `tag` quando o cliente não manda.** Obrigar a escolher um
        ícone para salvar um *nome* poria um seletor de 25 células entre o Gestor e a edição de uma
        palavra. A coluna é `NOT NULL` — nenhuma categoria existe sem ícone, e nenhuma tela precisa de
        caminho para nulo.
      default: tag
      enum:
        - lightbulb
        - unplug
        - accessibility
        - trash-2
        - droplets
        - shield
        - wrench
        - zap
        - flame
        - thermometer
        - wind
        - snowflake
        - door-open
        - key
        - camera
        - wifi
        - package
        - car
        - dog
        - bug
        - trees
        - volume-2
        - hammer
        - paintbrush
        - tag

    Categoria:
      type: object
      required: [id, nome, ativa, ordem, icone]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, maxLength: 60 }
        icone: { $ref: "#/components/schemas/IconeCategoria" }
        ativa:
          type: boolean
          description: Categoria sai de uso desativando — **nunca apagando**, porque ocorrência antiga aponta para ela.
        ordem: { type: integer, description: "Qual aparece antes é escolha do Gestor." }

    Area:
      type: object
      required: [id, nome, tipo, ativa, ordem]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, maxLength: 80 }
        tipo: { $ref: "#/components/schemas/TipoArea" }
        ativa: { type: boolean }
        ordem:
          type: integer
          description: |
            Qual Área aparece antes é escolha do Gestor, como já era em `Categoria`. Existe por um motivo
            medido: a lista de Áreas passa de trinta itens num condomínio médio e está no caminho crítico
            do RNF6 — em ordem alfabética ela custa cerca de 12 segundos de um orçamento de 60. Busca e
            "usadas recentemente" resolvem a partir do segundo registro; **`ordem` é o que resolve o
            primeiro**, e é o primeiro que decide se existe um segundo.

    Reordenacao:
      type: object
      description: |
        O corpo das duas reordenações. `ids` é a lista inteira, ativas e inativas, na ordem desejada: o
        primeiro recebe `ordem = 1`. Identificadores em maiúsculas são aceitos e comparados sem caixa, e o
        mesmo identificador em duas caixas conta como repetido.
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 999
          uniqueItems: true
          items: { type: string, format: uuid }

    RegistroDeOcorrencia:
      type: object
      description: |
        O corpo de `POST /ocorrencias`. **Não aceita `status`, `prioridade`, `areaTipo` nem qualquer campo
        escrito pelo servidor** — enviá-los devolve `422`.
      required: [titulo, descricao, categoriaId, areaId]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 150 }
        descricao: { type: string, minLength: 1, maxLength: 5000 }
        categoriaId: { type: string, format: uuid }
        areaId:
          type: string
          format: uuid
          description: |
            A localização é **uma Área mais um complemento em texto** — não há mapa nem coordenada. A Área
            é obrigatória porque é dela que a visibilidade deriva.
        localizacaoComplemento:
          type: [string, "null"]
          maxLength: 200
          description: 'Texto livre — "ao lado da vaga 34".'
        anexos:
          type: [array, "null"]
          maxItems: 1
          description: |
            As evidências **já enviadas ao storage**, por referência. Nunca bytes.

            **`maxItems: 1` é o escopo desta entrega, e é aqui que ele mora.** A tabela `anexos` do
            banco não tem restrição nenhuma de quantidade, de propósito: se o banco proibisse o segundo
            anexo, permiti-lo depois seria migração — e evitar migração é a razão inteira de o anexo ser
            tabela. Ampliar é trocar este número, o que **aceita mais e nunca menos**, e portanto não quebra
            cliente nenhum.
          items: { $ref: "#/components/schemas/ReferenciaDeAnexo" }

    OcorrenciaResumo:
      type: object
      description: Como a ocorrência aparece na listagem.
      required: [id, titulo, status, statusRotulo, motivoPausa, prioridade, categoria, area, autor, quantidadeDeAnexos, avaliada, registradaEm, atualizadaEm]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        status: { $ref: "#/components/schemas/StatusOcorrencia" }
        statusRotulo:
          type: string
          description: |
            O status em linguagem de gente, **calculado no servidor e dependente de quem lê**: o Solicitante
            vê "Em execução" onde o Gestor vê "Em atendimento". Em `pausada` o rótulo do Solicitante
            depende do motivo ("Parada — esperando material chegar"). Ficar no servidor mantém uma fonte só
            do texto; no cliente, cada cliente inventaria o seu.

            Quando a organização customizou o texto daquele ponto do ciclo, é o texto dela que o
            Solicitante recebe (ver `rotulosDoSolicitante` em `/configuracao`).

            A tabela de rótulos é propriedade do **glossário** do projeto, não deste contrato.
          examples: ["Em execução", "Parada — esperando você responder"]
        motivoPausa:
          description: |
            O motivo da pausa vigente; `null` fora de `pausada`. Está no resumo porque o rótulo do Gestor é
            sempre "Pausada" — sem este campo, a lista dele mostraria quatro esperas diferentes com a mesma
            palavra, escondendo justamente o que nomear a espera existe para tornar visível.
          oneOf:
            - $ref: "#/components/schemas/MotivoPausa"
            - type: "null"
        prioridade: { $ref: "#/components/schemas/PrioridadeOcorrencia" }
        categoria:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        area:
          type: object
          description: O `tipo` aqui é o **congelado no registro** — não necessariamente o tipo atual da Área.
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            tipo: { $ref: "#/components/schemas/TipoArea" }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        responsavel:
          description: Quem está cuidando. Visível ao Solicitante — mostrar constrói confiança —, mas não há canal direto entre os dois.
          oneOf:
            - $ref: "#/components/schemas/PessoaReferencia"
            - type: "null"
        quantidadeDeAnexos:
          type: integer
          minimum: 0
          description: |
            Quantos anexos a ocorrência tem. **Na listagem vai a contagem, não a lista** — uma lista de um
            elemento em cada item de página é verbosidade na leitura mais chamada do produto, e a tela só
            precisa da marca *"com foto"*, que é `quantidadeDeAnexos > 0`.

            É contagem e não booleano porque o número **já é a forma final**: o dia em que a ocorrência
            aceitar mais de um anexo, esta resposta continua correta sem nenhuma mudança de schema. A lista
            inteira está em `OcorrenciaDetalhe`, que é uma ocorrência só e não paga verbosidade.

            Hoje o valor é sempre `0` ou `1`, por escopo — não por schema.
          examples: [0, 1]
        avaliada:
          type: boolean
          description: |
            Se a resolução já foi avaliada — `avaliacao_nota is not null`. É a resposta curta de
            *"alguém já avaliou?"*, sem trazer a avaliação.

            **É booleano e não contagem**, e o precedente de `quantidadeDeAnexos` não se aplica: ali o
            `0..1` é *"por escopo — não por schema"*; aqui o `0..1` é **do schema** — a invariante 8, com
            `CHECK` no banco. Não há segundo valor para o qual o booleano quebre.

            **`OcorrenciaDetalhe` herda o campo pelo `allOf` e passa a carregar `avaliada` e `avaliacao`.**
            É deliberado, e é a mesma relação que este par de schemas já tem em `quantidadeDeAnexos` ↔
            `anexos`: o resumo leva a resposta curta, o detalhe leva as duas porque já tem o objeto na mão.

            **Não confundir com `acoesDisponiveis`**, que continua fora do resumo (critério 14.5): o que
            entra aqui é **fato da ocorrência**, como `status` e `motivoPausa`, nunca afazer calculado por
            leitor.

            *(Acrescentado em 30/08/2026: até esta data o schema declarava treze propriedades, e o produto
            já projetava a décima quarta desde o item 27. Item 21 da fila da frente de documentação.)*
          examples: [false, true]
        naoAberta:
          type: boolean
          description: |
            Presente apenas quando a listagem foi pedida com `compartilhadas=comigo`: diz se quem pergunta
            ainda não abriu esta ocorrência. Fora desse recorte a pergunta não é feita, e o campo não vem.

            A palavra é *aberta* aqui e na trilha; a tela escreve *vista*, porque *Aberta* é um status.
          examples: [true, false]
        registradaEm: { type: string, format: date-time }
        atualizadaEm:
          type: string
          format: date-time
          description: Muda a cada comando e a cada mensagem nova.

    OcorrenciaDetalhe:
      allOf:
        - $ref: "#/components/schemas/OcorrenciaResumo"
        - type: object
          required: [descricao, anexos, acoesDisponiveis, ultimaTransicao]
          properties:
            descricao: { type: string }
            localizacaoComplemento: { type: [string, "null"] }
            anexos:
              type: array
              description: |
                As evidências da ocorrência, da mais antiga para a mais recente. **Lista vazia quando não
                há anexo** — nunca `null`, para o cliente não precisar de dois caminhos de leitura.

                Nesta entrega a lista tem no máximo um item, do tipo `imagem`. Isso é **escopo**, não
                schema: nem o banco nem esta resposta limitam a quantidade.
              items: { $ref: "#/components/schemas/Anexo" }
              examples:
                - - id: "c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f"
                    tipo: "imagem"
                    titulo: "Lâmpada da vaga 34"
                    nomeArquivo: "IMG_20260820_130150.jpg"
                    tipoConteudo: "image/jpeg"
                    tamanhoBytes: 391244
                    url: "/api/ocorrencias/9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8/anexos/c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f"
                    miniaturaUrl: "/api/ocorrencias/9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8/anexos/c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f?variante=miniatura"
                    anexadoEm: "2026-08-20T13:02:11Z"
            solucaoAplicada: { type: [string, "null"] }
            avaliacao:
              description: Objeto de valor opcional, preenchido só depois de `resolvida`. Não é um estado.
              oneOf:
                - type: "null"
                - type: object
                  required: [nota, avaliadaEm]
                  properties:
                    nota: { type: integer, minimum: 1, maximum: 5 }
                    comentario: { type: [string, "null"] }
                    avaliadaEm: { type: string, format: date-time }
            ultimaTransicao:
              description: |
                O registro de transição mais recente. Presente na resposta de **todo comando** — é como o
                contrato afirma, de fora, que toda transição produziu exatamente um registro.
              $ref: "#/components/schemas/RegistroDeTransicao"
            acoesDisponiveis:
              type: array
              description: |
                Os comandos que **este chamador** pode executar **agora** — a máquina de estados cruzada com
                as permissões dele **e com todas as demais precondições do comando**. Existe para que o
                cliente não mantenha uma segunda cópia da tabela de transições.

                **Pode vir vazia, e vazia é resposta legítima.** Em `cancelada` não há um único comando
                disponível para ninguém; em `resolvida` a lista é vazia para todos menos para o Solicitante
                autor que ainda não avaliou, para quem é `["avaliar"]`. **Nunca vem nula e nunca vem
                ausente** — o campo é `required`, e a tela que renderiza exatamente esta lista precisa
                distinguir *"não há o que fazer"* de *"a lista não veio"*.
              items: { $ref: "#/components/schemas/Comando" }
            compartilhamento:
              description: |
                O compartilhamento, com **duas faces** (item 87). Quem participa da ocorrência — o autor e
                quem tem `ocorrencia.ler_todas` — recebe a lista de com quem ela está; quem a recebeu
                compartilhada recebe só quem a compartilhou, porque a lista nomeia outros vizinhos e a
                tela dele não a desenha.
              oneOf:
                - type: "null"
                - type: object
                  title: Gestão do compartilhamento
                  required: [tipo, pessoas]
                  properties:
                    tipo: { type: string, enum: [gestao] }
                    pessoas:
                      type: array
                      description: Do mais recente para o mais antigo. **Lista vazia**, nunca `null`.
                      items: { $ref: "#/components/schemas/Compartilhamento" }
                - type: object
                  title: Recebida por compartilhamento
                  required: [tipo, por, compartilhadoEm, naoAberta]
                  properties:
                    tipo: { type: string, enum: [recebida] }
                    por:
                      type: object
                      required: [nome, papel]
                      properties:
                        nome: { type: string, maxLength: 120 }
                        papel: { $ref: "#/components/schemas/PapelVinculo" }
                    compartilhadoEm: { type: string, format: date-time }
                    naoAberta:
                      type: boolean
                      description: |
                        Se quem está lendo ainda não tinha aberto esta ocorrência. Só existe neste ramo:
                        quem compartilhou não recebe recibo de leitura.

    Compartilhamento:
      type: object
      description: |
        Uma ocorrência aberta, só para leitura, a uma pessoa da mesma organização.

        **`podeDesfazer` é sobre quem lê, e não sobre a linha:** quem compartilhou desfaz o seu, e quem tem
        `ocorrencia.ler_todas` desfaz qualquer um. O autor que vê a linha do Gestor a vê sem a opção.

        **Quem recebeu e teve o vínculo revogado não aparece na lista**, e a linha continua no banco: ela
        fica sem efeito e volta a valer na readmissão. **Quem compartilhou continua nomeado mesmo
        revogado**, como quem transicionou continua nomeado na trilha.
      required: [com, por, compartilhadoEm, podeDesfazer]
      properties:
        com:
          allOf:
            - $ref: "#/components/schemas/PessoaReferencia"
            - type: object
              required: [papel]
              properties:
                papel: { $ref: "#/components/schemas/PapelVinculo" }
        por:
          allOf:
            - $ref: "#/components/schemas/PessoaReferencia"
            - type: object
              required: [papel]
              properties:
                papel: { $ref: "#/components/schemas/PapelVinculo" }
        compartilhadoEm: { type: string, format: date-time }
        podeDesfazer: { type: boolean }

    CandidatoAoCompartilhamento:
      type: object
      description: |
        Uma pessoa na busca do painel de compartilhar. **Nome e papel, e nada mais** — sem contato e sem
        área.
      required: [pessoaId, nome, papel, situacao, motivo]
      properties:
        pessoaId: { type: string, format: uuid }
        nome: { type: string, maxLength: 120 }
        papel: { $ref: "#/components/schemas/PapelVinculo" }
        situacao:
          type: string
          enum: [disponivel, ja_compartilhada, ja_ve]
          description: |
            `ja_ve` aparece desabilitada, com o motivo escrito; `ja_compartilhada` traz o desfazer ali
            mesmo.
        motivo:
          description: Por que a pessoa já vê. Nulo fora de `ja_ve`.
          oneOf:
            - type: "null"
            - type: string
              enum: [le_todas, autor]

    RegistroDeTransicao:
      type: object
      description: |
        A unidade da trilha de auditoria, com os cinco campos exigidos pelo desafio — um por campo, sem
        serialização. **Imutável**: nasce como efeito de um comando e nunca é editado nem apagado.
      required: [statusAnterior, statusNovo, ocorreuEm, autor]
      properties:
        statusAnterior:
          description: Nulo **apenas** no registro de criação, que é a origem da trilha.
          oneOf:
            - $ref: "#/components/schemas/StatusOcorrencia"
            - type: "null"
        statusNovo: { $ref: "#/components/schemas/StatusOcorrencia" }
        ocorreuEm: { type: string, format: date-time }
        autor:
          description: O **autor da transição** — quem fez a mudança. Aponta para a Pessoa, nunca para a credencial.
          $ref: "#/components/schemas/PessoaReferencia"
        observacao:
          type: [string, "null"]
          description: |
            A intenção humana declarada no momento do comando — não uma diferença de dados. É o campo que
            nenhuma auditoria genérica conseguiria produzir, e a razão de a trilha ser conceito de domínio.
            Obrigatória em `pausar` e `cancelar`; opcional no avanço rotineiro.
        motivoPausa:
          oneOf:
            - $ref: "#/components/schemas/MotivoPausa"
            - type: "null"
        motivoCancelamento:
          oneOf:
            - $ref: "#/components/schemas/MotivoCancelamento"
            - type: "null"

    EventoDaLinhaDoTempo:
      description: |
        Um item da linha do tempo. Três formas — transição, mensagem e atribuição —, distinguidas por
        `tipo`. É modelo de leitura derivado, não tabela.
      oneOf:
        - $ref: "#/components/schemas/EventoTransicao"
        - $ref: "#/components/schemas/EventoMensagem"
        - $ref: "#/components/schemas/EventoAtribuicao"
      discriminator:
        propertyName: tipo
        mapping:
          transicao: "#/components/schemas/EventoTransicao"
          mensagem: "#/components/schemas/EventoMensagem"
          atribuicao: "#/components/schemas/EventoAtribuicao"

    EventoTransicao:
      type: object
      required: [tipo, ocorridoEm, autor, statusNovo, rotulo]
      properties:
        tipo: { type: string, const: transicao }
        ocorridoEm: { type: string, format: date-time }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        rotulo:
          type: string
          description: |
            O status em linguagem de gente, conforme quem lê. Em `pausada` ele depende também do motivo:
            o Solicitante lê "Parada — esperando material chegar", o Gestor lê "Pausada".

            Quando a organização customizou o texto daquele ponto do ciclo, é o texto dela que o
            Solicitante recebe — inclusive nos eventos antigos, porque nada do texto é gravado aqui.
        statusAnterior:
          oneOf:
            - $ref: "#/components/schemas/StatusOcorrencia"
            - type: "null"
        statusNovo: { $ref: "#/components/schemas/StatusOcorrencia" }
        observacao: { type: [string, "null"] }
        motivoPausa:
          oneOf:
            - $ref: "#/components/schemas/MotivoPausa"
            - type: "null"
        motivoCancelamento:
          oneOf:
            - $ref: "#/components/schemas/MotivoCancelamento"
            - type: "null"

    EventoMensagem:
      type: object
      required: [tipo, ocorridoEm, autor, texto]
      properties:
        tipo: { type: string, const: mensagem }
        ocorridoEm: { type: string, format: date-time }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        texto: { type: string }

    EventoAtribuicao:
      type: object
      required: [tipo, ocorridoEm, autor, responsavel]
      properties:
        tipo: { type: string, const: atribuicao }
        ocorridoEm: { type: string, format: date-time }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        responsavel: { $ref: "#/components/schemas/PessoaReferencia" }
        encerradaEm: { type: [string, "null"], format: date-time }
        motivoEncerramento:
          type: [string, "null"]
          enum: [reatribuicao, recusa, null]

    Comentario:
      type: object
      description: Uma mensagem do canal 1 — Gestores e Solicitante. Sem edição e sem exclusão.
      required: [id, texto, autor, criadoEm]
      properties:
        id: { type: string, format: uuid }
        texto: { type: string }
        autor: { $ref: "#/components/schemas/PessoaReferencia" }
        criadoEm: { type: string, format: date-time }

    ComandoComObservacaoOpcional:
      type: object
      description: |
        Corpo dos comandos de avanço rotineiro. `observacao` é **opcional** aqui de propósito: exigir texto
        onde não há decisão a justificar produz "ok" e destrói o próprio dado.
      properties:
        observacao: { type: string, maxLength: 1000 }

    TipoAnexo:
      type: string
      description: |
        O **tipo de evidência**. Enum de **saída apenas** — o cliente nunca o envia: o servidor o deriva do
        `tipoConteudo` declarado na autorização de upload.

        **Um valor hoje, e isso é deliberado.** O escopo desta entrega é *"anexar uma imagem"*
        (`escopo.md`, atividade 2) com RNF8 fixando JPEG ou PNG; declarar `video`, `documento` e `audio`
        aqui seria publicar três caminhos de renderização para dado que nunca chega. Acrescentar um valor
        depois é `ALTER TYPE tipo_anexo ADD VALUE` no banco e **valor novo em enum de saída** no contrato —
        aditivo pelas duas regras, e sem cliente a atualizar.
      enum: [imagem]

    ReferenciaDeAnexo:
      type: object
      description: |
        Como o anexo **entra**: a referência a um objeto já enviado ao storage. Nunca bytes, e **nunca o
        tipo** — quem o determina é o servidor, a partir do que autorizou.
      required: [chave, ticket]
      properties:
        chave:
          type: string
          description: A chave opaca devolvida por `POST /anexos/autorizacoes`.
          example: "anx_01JB8Z6K9T2M4N7Q"
        ticket:
          type: string
          description: O token assinado da mesma autorização, com validade de 15 minutos.
        titulo:
          type: [string, "null"]
          maxLength: 150
          description: |
            Rótulo **opcional** que a pessoa escreve para a evidência — *"Orçamento do eletricista"*.
            É dado de domínio, diferente do nome do arquivo, que é resíduo do sistema de arquivos.
            **Custa segundos do orçamento do RNF6**, e é o primeiro campo a sair da tela se a medição
            estourar — sai sem tocar schema, porque é opcional.

    Anexo:
      type: object
      description: |
        Como o anexo **sai**: um item de `OcorrenciaDetalhe.anexos`. Note o que **não** está aqui — nome de
        arquivo original (texto de quem enviou, que ninguém exibe e que carrega dado pessoal com
        frequência), legenda e ordem. O que a interface precisa para desenhar é o tipo, a URL e o tamanho.
      required: [id, tipo, tipoConteudo, tamanhoBytes, url, anexadoEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoAnexo" }
        titulo:
          type: [string, "null"]
          maxLength: 150
          description: O rótulo que a pessoa escreveu, se escreveu. É o que uma lista de anexos deve exibir.
        nomeArquivo:
          type: [string, "null"]
          maxLength: 255
          description: |
            O nome do arquivo enviado, se houver. Para foto costuma ser ruído
            (`IMG_20260821_143022.jpg`); para documento é a única etiqueta humana que o arquivo tem.
            **Pode conter dado pessoal escrito por quem enviou.**
        miniaturaUrl:
          type: [string, "null"]
          description: |
            Caminho **estável** desta API para a miniatura — o mesmo do anexo, com `?variante=miniatura`.
            `null` quando o cliente não gerou miniatura, que é caso normal. A miniatura é gerada **no
            aparelho**, no mesmo passe de compressão do RNF8, e sobe pela **mesma autorização**.
        tipoConteudo:
          type: string
          description: |
            O tipo MIME real, conferido por `HEAD` no objeto na hora de reivindicar. `tipo` é o conceito do
            domínio; isto é o fato técnico, e é o que decide como a interface renderiza.
          example: "image/jpeg"
        tamanhoBytes:
          type: integer
          description: O tamanho real do objeto, também conferido no `HEAD`. Nunca o declarado pelo cliente.
          example: 391244
        url:
          type: string
          description: |
            Caminho **estável** desta API (`/ocorrencias/{id}/anexos/{anexoId}`), que responde `302` para
            uma URL assinada de vida curta. Nunca a URL do storage — ela expira e mudaria a cada resposta.
          example: "/api/ocorrencias/9a1f2b3c-4d5e-6f70-8192-a3b4c5d6e7f8/anexos/c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f"
        anexadoEm: { type: string, format: date-time }

    AutorizacaoDeUpload:
      type: object
      required: [chave, chaveMiniatura, ticket, estado, upload, uploadMiniatura]
      description: |
        **Uma autorização, dois destinos.** O anexo e a miniatura sobem por SAS distintas, mas com **um
        ticket só, um slot do limite de 30/h e uma reivindicação**. Duas autorizações dobrariam a ida e
        volta dentro do orçamento de 60 segundos do RNF6 — é por isso que não são duas.

        Enviar a miniatura é **opcional**: quem não a gerar simplesmente não usa `uploadMiniatura`, e o
        objeto pendente é recolhido pela faxina como qualquer outro.
      properties:
        chave:
          type: string
          description: |
            **Chave opaca do objeto.** É o que vai para o banco — nunca uma URL, nunca com nome de
            contêiner embutido. A plataforma de storage já mudou uma vez neste projeto; com chave opaca,
            trocar de provedor não toca o banco.
        chaveMiniatura:
          type: string
          description: |
            A chave do **segundo objeto**, opaca pela mesma regra. Distinta da principal, e o banco recusa
            que sejam iguais.
        ticket:
          type: string
          description: |
            Token assinado pelo servidor, com validade de 15 minutos, que amarra a chave a quem pediu.
            É apresentado em `POST /ocorrencias` e é o que permite validar o upload **na hora de
            reivindicar** — sem tabela de uploads pendentes.
        estado:
          type: string
          const: pendente
          description: |
            O objeto nasce pendente e é apagado pela regra de ciclo de vida se nunca for reivindicado.
            Reivindicar o promove a confirmado **e grava a linha em `anexos`**, na mesma transação da
            ocorrência. Devolvido para que o comportamento seja visível ao cliente, e não uma regra
            invisível do storage.
        upload:
          type: object
          required: [url, metodo, cabecalhos, expiraEm]
          properties:
            url: { type: string, description: "URL assinada de escrita, no storage. Enviar os bytes aqui, fora desta API." }
            metodo: { type: string, const: PUT }
            cabecalhos:
              type: object
              additionalProperties: { type: string }
              description: Cabeçalhos exigidos pelo storage no envio.
            expiraEm: { type: string, format: date-time }
        uploadMiniatura:
          type: object
          description: |
            O destino da miniatura. **Mesmo formato, mesma validade, mesmo ticket** — e o `PUT` corre no
            mesmo paralelo do principal, enquanto a pessoa digita.
          required: [url, metodo, cabecalhos, expiraEm]
          properties:
            url: { type: string }
            metodo: { type: string, const: PUT }
            cabecalhos:
              type: object
              additionalProperties: { type: string }
            expiraEm: { type: string, format: date-time }

    Dashboard:
      type: object
      description: |
        O que a listagem não responde: **padrão e tendência**, não item individual. `backlogPorStatus` e
        `abertasPorCategoria` são fotografia de agora; `recorrencia` é série mensal dentro da janela.

        Os dois blocos de fotografia contam conjuntos diferentes e **não somam o mesmo número**: um conta
        tudo o que existe, o outro só o que está em aberto.

        `abertasPorIdade` é a terceira fotografia, e a única que olha para o tempo do que ainda não
        terminou.
      required: [periodo, backlogPorStatus, abertasPorCategoria, abertasPorIdade, mediaDasAvaliacoes, recorrenciaPorCategoria, recorrenciaPorArea, duplasRecorrentes, tempoDeResolucao, canceladasPorMes, emAbertoNoInicio, maisVelhasEmAberto]
      properties:
        periodo:
          type: object
          properties:
            de: { type: string, format: date }
            ate: { type: string, format: date }
        backlogPorStatus:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/StatusOcorrencia" }
              statusRotulo: { type: string }
              quantidade: { type: integer }
        abertasPorCategoria:
          type: array
          description: |
            Quantas ocorrências **não terminais** existem agora em cada categoria — `aberta`,
            `em_analise`, `em_atendimento` e `pausada`. Ignora a janela, como `backlogPorStatus`, e
            **não soma com ele**: aquele conta os seis status, inclusive `resolvida` e `cancelada`.

            Toda categoria ativa aparece, mesmo a zero; a desativada aparece enquanto ainda carregar algo
            em aberto.
          items:
            type: object
            properties:
              categoria:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
              quantidade: { type: integer }
              envelhecidas:
                type: integer
                description: >-
                  Quantas destas passaram do limite da primeira faixa de idade, que é o `ateDias` da
                  primeira linha de `abertasPorIdade`. Mesma régua de idade das faixas: trocar o limite
                  move este número junto.
        abertasPorIdade:
          type: array
          description: |
            Quantas ocorrências **não terminais** existem agora em cada faixa de idade. Conta o mesmo
            conjunto que `abertasPorCategoria`, por outro corte — e as duas somas fecham.

            A idade é o tempo de **calendário** desde `registrada_em`, em dias inteiros, com o período
            pausado dentro dela, como no tempo de resolução. Ignora a janela `de`/`ate`: é fotografia de
            agora.

            **As quatro faixas vêm sempre, mesmo a zero**, em ordem crescente de idade — a estrutura
            ensina o que vai ser medido a quem ainda não tem volume. Cada uma publica os **próprios
            limites em dias** em vez de um nome: os limites são escolha de quem opera, e publicá-los é o
            que permite trocá-los sem mudar o formato da resposta. `ateDias: null` é a faixa sem teto, a
            mais velha.

            **Nenhum rótulo viaja.** O texto de cada faixa é os dois números escritos em português, e
            escrevê-lo é do cliente — ao contrário de `statusRotulo`, que depende de quem lê.
          items:
            type: object
            properties:
              deDias: { type: integer }
              ateDias: { type: [integer, "null"] }
              quantidade: { type: integer }
        mediaDasAvaliacoes:
          type: object
          description: |
            A única medida de qualidade do produto. `avaliadas` e `resolvidas` vêm junto porque sem o
            denominador a média mente quando poucos avaliam.

            **Respeita a janela `de`/`ate`, ancorada no instante da RESOLUÇÃO** — não é fotografia de agora
            como `backlogPorStatus` e `abertasPorCategoria`, e não é série mensal como a recorrência: é um
            número só, sobre um recorte de
            período. `resolvidas` conta as ocorrências resolvidas dentro da janela; `avaliadas` conta
            quantas **dessas** foram avaliadas; `media` é a média **dessas** notas. É o que mantém
            `avaliadas ≤ resolvidas` por construção, e o que faz `resolvidas` fechar com a soma de
            `tempoDeResolucao.porMes[].resolvidas` na mesma janela. **Nunca ancorada em `avaliada_em`:**
            avaliação que chega depois do fim da janela conta na janela em que a ocorrência foi resolvida.
            *(Acrescentado em 30/08/2026 — decisão do hub de 29/08/2026; nenhuma mudança de forma. Item 27
            da fila da frente de documentação.)*
          properties:
            media: { type: [number, "null"] }
            avaliadas: { type: integer }
            resolvidas: { type: integer }
            distribuicao:
              type: array
              description: >-
                Quantas avaliações deram cada nota, de 1 a 5. As cinco vêm sempre, mesmo a zero, e a
                soma é `avaliadas`: saem do mesmo conjunto que a média.
              items:
                type: object
                properties:
                  nota: { type: integer, minimum: 1, maximum: 5 }
                  quantidade: { type: integer }
        recorrenciaPorCategoria:
          type: array
          description: |
            Uma série mensal por categoria, recortada por `registrada_em`. A soma das séries num mês é
            quanto entrou naquele mês, porque toda ocorrência tem categoria.
          items:
            type: object
            properties:
              categoria:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
              porMes:
                type: array
                items:
                  type: object
                  properties:
                    mes: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                    quantidade: { type: integer }
        recorrenciaPorArea:
          type: array
          items:
            type: object
            properties:
              area: { $ref: "#/components/schemas/Area" }
              porMes:
                type: array
                items:
                  type: object
                  properties:
                    mes: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                    quantidade: { type: integer }
        duplasRecorrentes:
          type: array
          description: |
            As **duplas de área e categoria** que se repetiram dentro da janela, da maior contagem para a
            menor, com desempate pelo nome da área e depois pelo da categoria.

            `recorrenciaPorCategoria` e `recorrenciaPorArea` contam as duas dimensões **em separado**, e
            oito ocorrências da mesma categoria espalhadas por oito lugares produzem ali o mesmo número
            que oito no mesmo lugar. Esta lista cruza as duas na linha da ocorrência, que é onde o
            cruzamento existe, e é ela que aponta causa.

            **Só entra a dupla com duas ocorrências ou mais.** Uma ocorrência é um caso, não um padrão.
            A lista pode vir vazia, e vazia significa que nada se repetiu no período.

            Cada linha traz a Área inteira e a Categoria inline, as mesmas formas que as duas séries de
            recorrência publicam. **Nenhum rótulo viaja:** o texto da linha são os dois nomes com um
            separador, e escrevê-lo é do cliente. Os identificadores viajam embora a leitura seja pelos
            nomes — são o que permite a uma tela futura ligar a linha à listagem filtrada.
          items:
            type: object
            properties:
              area: { $ref: "#/components/schemas/Area" }
              categoria:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
              quantidade: { type: integer }
        tempoDeResolucao:
          type: object
          description: |
            O tempo de calendário entre o registro e a resolução, resumido mês a mês dentro da janela.
            **Dois números por mês, e nenhum deles é a média**: duração de atendimento tem cauda longa, e
            a média sobe acima do caso típico por causa de poucos casos arrastados. Se a mediana está
            subindo, o problema é estrutural — gente, fornecedor, orçamento.

            **O método do percentil é a interpolação linear** (`percentile_cont`): as durações do mês são
            ordenadas, o índice sai da fração multiplicada por `n − 1`, e o valor sai da interpolação
            entre os dois vizinhos desse índice. Outro método devolve outro número sobre os mesmos dados.

            Os valores em horas vêm com quatro casas decimais, e uma duração maior que zero nunca chega
            como zero: a menor que a resposta publica é `0.0001`, pouco mais de um terço de segundo.
          properties:
            porMes:
              type: array
              items:
                type: object
                properties:
                  mes: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
                  mediana:
                    type: [number, "null"]
                    description: >-
                      A duração do caso do meio, em horas. `null` quando o mês não teve nenhuma
                      resolução — o mês continua na série.
                  p90:
                    type: [number, "null"]
                    description: >-
                      Percentil 90 em horas, por interpolação linear entre os dois valores vizinhos do
                      índice. `null` quando o mês teve três resoluções ou menos, porque um percentil
                      sobre três pontos descreveria mais do que três pontos sustentam.
                  amostra:
                    type: [array, "null"]
                    items: { type: number }
                    description: >-
                      As durações cruas do mês, em horas e em ordem crescente, quando ele teve três
                      resoluções ou menos. `null` acima disso: `null` diz que não se aplica, e uma lista
                      vazia diria que não houve resolução, que já tem representação.
                  resolvidas:
                    type: integer
                    description: O denominador. Sem ele, um mês com duas resoluções parece igual a um mês com trinta.
        canceladasPorMes:
          type: array
          description: |
            Quantas ocorrências foram canceladas em cada mês da janela, **pelo instante do cancelamento**
            lido na trilha, a mesma âncora da resolução. Todo mês da janela aparece, com zero onde não
            houve. Com as resolvidas, é o que *saiu* no saldo do período.
          items:
            type: object
            properties:
              mes: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              quantidade: { type: integer }
        emAbertoNoInicio:
          type: integer
          description: |
            Quantas ocorrências estavam em aberto no instante em que a janela abre: registradas antes
            dele, e sem transição para `resolvida` ou `cancelada` antes dele. **Medido na trilha, e não
            derivado**: somado ao saldo do período, dá a soma de `abertasPorIdade` quando a janela termina
            hoje, e é essa conta que prova as três leituras.
        maisVelhasEmAberto:
          type: array
          description: |
            As ocorrências em aberto há mais tempo, **no máximo cinco**, da mais velha para a mais nova,
            com desempate estável. A idade é a mesma das faixas de `abertasPorIdade`, então a primeira
            da lista cai na faixa mais velha que tem alguém. Vazia quando nada está em aberto.
            `statusRotulo` é o do Gestor, como em `backlogPorStatus`.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              titulo: { type: string }
              status: { $ref: "#/components/schemas/StatusOcorrencia" }
              statusRotulo: { type: string }
              idadeEmDias: { type: integer }

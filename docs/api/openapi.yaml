      description: |
        **`tipo` é obrigatório e não tem padrão.** Um padrão implícito escolheria a visibilidade das
        ocorrências em silêncio — que é exatamente o que a D10 recusa ao dizer que a visibilidade é
        *derivação, não configuração*.

        *Capacidade: editar áreas · `NOSSO` (D18). Comando: `Definir áreas do local`. Permissão: `organizacao.configurar`.*

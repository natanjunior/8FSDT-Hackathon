                  - { id: "0f9a4d71-2222-4b2c-9d3e-4f5a6b7c8d9e", nome: "Salão de festas", tipo: "comum", ativa: true, ordem: 2 }
                  - { id: "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e", nome: "Apartamento 302", tipo: "privativa", ativa: true, ordem: 3 }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }

openapi: 3.1.0

info:
  title: Resolve Aí — API
  version: "1.0.0"
  summary: Gestão de ocorrências com trilha de auditoria imutável, multi-organização.
  description: |
    Superfície HTTP **desta entrega** do Resolve Aí. O raciocínio, as alternativas rejeitadas, as
    suposições declaradas e a rastreabilidade das 42 capacidades estão em `docs/contrato-de-api.md`.

    ## As cinco regras que explicam a forma desta API

    1. **Comando de domínio não vira campo.** O `status` de uma ocorrência **não é escrevível**. Nenhum
       corpo de requisição, em nenhuma operação, aceita `status`. Mudar status é chamar um comando
       nomeado (`analisar`, `pausar`, `resolver`…), e cada comando grava um registro de transição com os
       cinco campos exigidos pelo desafio — é assim que *"cada transição de status deve ser auditável"*
       deixa de depender de disciplina.
    2. **A organização vem da sessão, nunca da URL.** Não existe `/organizacoes/{id}/...`. O escopo é
       resolvido num ponto único no servidor (ADR-0003). Uma Pessoa com vínculo em várias organizações
       troca de contexto com `PUT /contexto/organizacao`.
    3. **Gente só existe dentro de uma organização.** Não existe `GET /pessoas`. Toda listagem de gente é
       listagem de **vínculos**.
    4. **A trilha é só de leitura.** Não existe `POST`, `PATCH` nem `DELETE` de registro de transição —
       ele nasce como efeito de um comando.
    5. **Quase nada é apagado, e as exceções são duas.** Ocorrência não se apaga (cancela-se), categoria e
       área não se apagam (desativam-se), mensagem não se apaga, registro de transição não se apaga.
       `DELETE /vinculos/{pessoaId}` remove um vínculo **sem histórico**, e quem delimita a exceção é o
       `ON DELETE RESTRICT` do esquema, que recusa apagar qualquer vínculo com linha dependente.
       `DELETE /ocorrencias/{id}/compartilhamentos/{pessoaId}` desfaz um compartilhamento, que por decisão
       não tem histórico: ele diz quem pode ler a ocorrência hoje, e desfazer é tirar isso.

    ## Antes de clicar em *Try it out*

    1. Autentique-se (botão **Authorize**): cookie de sessão do provedor, ou `Bearer <access_token>`.
    2. Chame `GET /contexto` para ver seus vínculos.
    3. Chame `PUT /contexto/organizacao` para escolher a organização ativa. **Sem isso, toda operação de
       negócio responde `403 SEM_ORGANIZACAO_ATIVA`.**

    ## Convenções

    - Vocabulário **pt-BR**, do glossário do projeto. Campos em `camelCase`; valores de enum em
      `snake_case`, idênticos aos do banco.
    - Datas ISO 8601 com fuso, em UTC na saída. Janelas do dashboard são `date` em America/Sao_Paulo.
    - Erros em `application/problem+json` (RFC 9457), sempre com `codigo` estável e `traceId`.
    - Paginação por **cursor**; a resposta traz `proximoCursor`.
    - Nos exemplos, pessoas são nomeadas **por função** — é a regra de vocabulário do projeto. Em
      produção o campo recebe o nome civil.
  contact:
    name: Resolve Aí — documentação do projeto
    url: https://github.com/natanjunior/8FSDT-Hackathon/tree/main/docs
  license:
    name: Uso acadêmico — pós-graduação FIAP, Fase 5

servers:
  - url: /api
    description: Mesma origem da aplicação (o PWA e a API sobem no mesmo container)
  - url: http://localhost:3000/api
    description: Ambiente local em Docker

tags:
  - name: Contexto
    description: |
      Quem sou eu, em quais organizações tenho vínculo, e qual delas está ativa. **São os dois únicos
      endpoints em que o cliente nomeia uma organização.**
  - name: Organização
    description: Criação por auto-serviço. Quem cria vira o Gestor inicial (D26).
  - name: Entrada na organização
    description: Pedido de entrada com o código público, e a decisão do Gestor. Nenhum vínculo nasce sem aprovação (D25).
  - name: Vínculos
    description: |
      A ponte entre a Pessoa (global) e a Organização. **Toda listagem de gente passa por aqui** — é o que
      substitui, de propósito, um inexistente `GET /pessoas`.
  - name: Configuração
    description: Categorias e Áreas da organização, configuráveis pelo Gestor (D18), semeadas na criação.
  - name: Ocorrências — leitura
    description: Listagem, detalhe, linha do tempo, trilha de auditoria e anexos.
  - name: Ocorrências — comandos
    description: |
      Os comandos do agregado. Cada um é `POST /ocorrencias/{id}/<comando>`, com o caminho no imperativo e
      idêntico ao nome do comando no domínio. Todos devolvem a ocorrência atualizada com
      `ultimaTransicao` — o registro de auditoria recém-gravado.
  - name: Conversa
    description: O comentário (canal 1 — Gestores e Solicitante). Os canais 2 e 3 são evolução prevista.
  - name: Compartilhamento
    description: |
      Abrir uma ocorrência, **só para leitura**, a outra pessoa da mesma organização. É dado, e não
      permissão: quem recebe não ganha papel nenhum e não age sobre a ocorrência (ADR-0017).
  - name: Anexo
    description: |
      A **evidência** anexada a uma ocorrência: autorização de upload direto para o storage, e leitura por
      URL assinada de vida curta. **Nesta entrega o anexo é exatamente um, do tipo `imagem`** — a
      forma é de anexo, o escopo é de imagem, e os dois são coisas diferentes de propósito.
  - name: Dashboard
    description: Os indicadores de gestão — o que a listagem não responde.

security:
  - sessaoSupabase: []
  - bearerSupabase: []

paths:
  /contexto:
    get:
      tags: [Contexto]
      operationId: obterContexto
      summary: Quem sou eu, e em quais organizações
      description: |
        Devolve a Pessoa da sessão, a **organização ativa** (se houver), o papel, as permissões e a lista de
        vínculos. É o primeiro pedido de qualquer cliente.

        **Funciona sem organização ativa** — é o que sustenta a tela de escolha de organização e a tela de
        quem ainda não entrou em nenhuma. A lista de vínculos parte de `vinculos`, nunca de `pessoas`.

        *Fundação técnica: isolamento por organização em ponto único · `NOSSO` (D2, D3, ADR-0003).*
      responses:
        "200":
          description: Contexto da sessão.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contexto" }
              examples:
                doisVinculos:
                  summary: Persona 1B — síndico profissional com vínculo em duas organizações
                  value:
                    pessoa: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }
                    organizacaoAtiva: { id: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed", nome: "Condomínio Recanto Azul", codigoPublico: "RECANTO7" }
                    papel: "gestor"
                    permissoes: ["ocorrencia.registrar", "ocorrencia.ler_todas", "ocorrencia.analisar", "ocorrencia.resolver", "vinculo.gerir", "dashboard.ler", "organizacao.configurar"]
                    vinculos:
                      - { organizacaoId: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed", nome: "Condomínio Recanto Azul", papel: "gestor", codigoPublico: "RECANTO7" }
                      - { organizacaoId: "3c7f2a10-11aa-4c3e-8f2b-77e9b0c1d2e3", nome: "Edifício Alvorada", papel: "solicitante", codigoPublico: "ALVRADA2" }
                    pedidosDeEntrada: []
                semVinculo:
                  summary: Conta recém-criada, ainda sem organização
                  value:
                    pessoa: { pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d", nome: "Helena Rocha" }
                    organizacaoAtiva: null
                    papel: null
                    permissoes: []
                    vinculos: []
                    pedidosDeEntrada:
                      - { id: "5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9", organizacao: { nome: "Condomínio Recanto Azul" }, situacao: "pendente", criadoEm: "2026-08-20T13:02:11Z" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /contexto/pessoa:
    patch:
      tags: [Contexto]
      operationId: corrigirPessoa
      summary: Corrigir os próprios dados
      description: |
        Corrige os dados da Pessoa **da sessão**. Não há `{pessoaId}` no caminho, e essa ausência é o
        mecanismo: sem identificador a passar, alterar os dados de outra pessoa não é improvável, é
        impossível. O caminho é `/contexto/pessoa` e não `/pessoas/{id}` porque todo endereço de gente é
        `/vinculos/{pessoaId}` (§4.6) — este é endereço da **sessão**, como os outros dois de `/contexto`.

        **Só `nome` é editável.** O **e-mail** é a credencial de acesso e o único canal de recuperação de
        senha: trocá-lo envolve o provedor, dois e-mails de confirmação por troca e um intervalo em que a
        conta tem dois endereços. Fica de fora desta entrega, e a tela o mostra em leitura com a razão.
        **`contatos[]`** fica de fora por outro motivo: a escrita é substituição da lista inteira, com
        `ordem`, `409 CONTATO_DUPLICADO` e normalização para E.164 — é superfície de um item, não de um
        campo. A **senha** já tem caminho próprio, e a tela aponta para ele.

        **O efeito é global e declarado:** `pessoas` é tabela única, então o nome novo passa a valer em
        **todas** as organizações da Pessoa. A trilha de auditoria guarda `autor_pessoa_id` e resolve o
        nome na leitura, então transições antigas passam a ser lidas com o nome de agora — quem lê a
        trilha vê **quem** agiu, não como essa pessoa se chamava na época.

        **Sem `403`:** permissão é atributo do Vínculo, e este endpoint roda sem vínculo. **Sem `404`:** a
        Pessoa é a da sessão. **Sem `409`:** não há unicidade sobre `nome`.

        *Capacidade: corrigir os próprios dados · `NOSSO` (PA-26). Não exige organização ativa — é um dos
        cinco endpoints fora do escopo (contrato, §4.4), e o único deles que uma tela de dentro da
        organização consome.*
        *Sem comando correspondente no Event Storming — lacuna registrada (contrato, §13).*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 120 }
            example: { nome: "Helena Rocha" }
      responses:
        "200":
          description: Pessoa corrigida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PessoaReferencia" }
              example:
                pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d"
                nome: "Helena Rocha"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /contexto/organizacao:
    put:
      tags: [Contexto]
      operationId: trocarOrganizacaoAtiva
      summary: Escolher a organização ativa da sessão
      description: |
        Define qual organização a sessão está usando. O servidor valida que existe **vínculo ativo** da
        Pessoa naquela organização e grava a escolha num cookie de sessão assinado.

        **É o único lugar do contrato onde o cliente nomeia uma organização.** Em todas as demais operações
        o escopo é derivado da sessão — o cliente não pode escolher, nem por engano.

        Organização inexistente e organização real sem vínculo ativo devolvem **a mesma resposta**, para
        não confirmar existência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizacaoId]
              properties:
                organizacaoId:
                  type: string
                  format: uuid
                  description: Uma das organizações devolvidas em `GET /contexto`.
            example: { organizacaoId: "3c7f2a10-11aa-4c3e-8f2b-77e9b0c1d2e3" }
      responses:
        "200":
          description: Organização ativa trocada. O cookie de sessão é atualizado.
          headers:
            Set-Cookie:
              description: Cookie de sessão assinado com a organização ativa.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contexto" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: Não há vínculo ativo da Pessoa naquela organização — ou a organização não existe.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/sem-vinculo-na-organizacao"
                title: "Sem vínculo nesta organização"
                status: 403
                detail: "Você não tem vínculo ativo nesta organização."
                codigo: "SEM_VINCULO_NA_ORGANIZACAO"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /organizacoes:
    post:
      tags: [Organização]
      operationId: criarOrganizacao
      summary: Criar a organização (auto-serviço)
      description: |
        Cria a organização, **vincula quem chamou como Gestor inicial** e deixa a nova organização ativa na
        sessão. É o bootstrap da D26: o primeiro Gestor não teria quem o aprovasse.

        Dois efeitos acontecem aqui por **política** (POL-01), sem chamada do cliente: as **sete
        categorias-semente** do desafio e as **áreas-semente** com os tipos *comum* e *privativa*.
        Verifique com `GET /categorias` e `GET /areas` logo em seguida.

        O `codigoPublico` é **gerado pelo servidor** — ele vive em cartaz de elevador e é digitado à mão, e
        deixar o cliente escolher permitiria adivinhação dirigida.

        *Capacidade: criar a organização por auto-serviço · `NOSSO` (D26). Comando: `Registrar organização`.*
        *Não exige organização ativa — é um dos cinco endpoints fora do escopo (contrato, §4.4). E também
        não a recusa: um Gestor de uma organização pode fundar outra, e a nova fica ativa pelo `Set-Cookie`
        da própria resposta.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, minLength: 1, maxLength: 120 }
            example: { nome: "Condomínio Recanto Azul" }
      responses:
        "201":
          description: Organização criada, com o vínculo de Gestor e as sementes.
          headers:
            Set-Cookie:
              description: A nova organização já fica ativa na sessão.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organizacao" }
              example:
                id: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed"
                nome: "Condomínio Recanto Azul"
                codigoPublico: "RECANTO7"
                criadoEm: "2026-08-20T12:00:00Z"
                categoriasSemeadas: 7
                areasSemeadas: 4
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    patch:
      tags: [Organização]
      operationId: corrigirOrganizacao
      summary: Corrigir a organização ativa
      description: |
        Corrige os dados da organização **da sessão**. Não há `{id}` no caminho: a organização vem da
        sessão, nunca da URL (§4.2), e é essa ausência que torna impossível editar organização alheia.

        **Só `nome` é editável.** O `codigoPublico` é gerado pelo servidor, não é aceito no corpo e **não
        é rotacionável nesta entrega**: código vazado produz um pedido de entrada aguardando aprovação,
        não acesso (D25). `logoCaminho` não tem mecanismo de storage e vira uma linha em `anexos` quando
        entrar. As **regras do atendimento** têm recurso próprio, `/configuracao`, porque deixam rastro de
        outra forma.

        **Sem `404`:** a organização é a da sessão e ela existe. **Sem `409` de nome duplicado:**
        `organizacoes` tem `UNIQUE (codigo_publico)` e nada sobre `nome` — duas organizações podem ter o
        mesmo nome, e é o código que as distingue.

        A alteração deixa rastro na forma **última escrita** — `atualizado_em` e
        `atualizado_por_pessoa_id` —, a mesma de `categorias` e `areas`. O nome não entra na trilha de
        configuração, que é só das regras (`/configuracao`).

        *Capacidade: corrigir o nome da organização · `NOSSO` (D25). Permissão: `organizacao.configurar`.*
        *Sem comando correspondente no Event Storming — lacuna registrada (contrato, §13).*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 120 }
            example: { nome: "Residencial Aurora" }
      responses:
        "200":
          description: Organização corrigida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizacaoResumo" }
              example:
                id: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed"
                nome: "Residencial Aurora"
                codigoPublico: "AURORA42"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /configuracao:
    get:
      tags: [Configuração]
      operationId: lerConfiguracao
      summary: As regras do atendimento, os textos de quem abriu, e as mudanças delas
      description: |
        As **regras do atendimento** da organização da sessão, o texto com que quem abriu lê cada ponto
        do ciclo, e a trilha de cada mudança das duas coisas — quem mudou, quando, de que valor para
        qual. A organização vem da sessão, nunca da URL (§4.2).

        A lista vem da mais recente para a mais antiga e **não pagina**: são duas regras que mudam
        raramente, e o volume de uma organização é de dezenas de linhas.

        **O Solicitante não lê a configuração.** O efeito dela chega a ele pronto, em `acoesDisponiveis`.

        *Capacidade: configurar as regras do atendimento · `NOSSO` (D29, D30). Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: As regras de agora e a história delas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Configuracao" }
              example:
                exigirSolucaoAoResolver: true
                limiteDeCancelamentoDoSolicitante: "em_analise"
                diasParaParada: 7
                rotulosDoSolicitante:
                  aberta: null
                  em_analise: "o síndico está avaliando"
                  em_atendimento: null
                  pausada: null
                  resolvida: null
                  cancelada: null
                mudancas:
                  - chave: "exigir_solucao_ao_resolver"
                    valorAnterior: "false"
                    valorNovo: "true"
                    autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }
                    ocorridaEm: "2026-09-29T17:32:00Z"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    patch:
      tags: [Configuração]
      operationId: alterarConfiguracao
      summary: Mudar as regras do atendimento e os textos de quem abriu
      description: |
        Muda as regras da organização da sessão. Cada mudança de valor vira uma linha em `mudancas`,
        escrita pelo banco na mesma instrução; gravar o valor que já está lá não deixa rastro. A trilha
        **não aceita alteração nem remoção** (D30).

        Com o limite em `em_atendimento`, o Solicitante autor cancela a própria também em `Em atendimento`
        e em `Pausada`; `em_analise` é o padrão de toda organização, e é o valor da D12.2. O Gestor
        cancela em qualquer estado não terminal, qualquer que seja o valor.

        Com `exigirSolucaoAoResolver` ligado, resolver sem solução responde `422` (ver `/resolver`).

        Cada texto que muda de valor vira uma linha em `mudancas`, com a chave `rotulo_` mais o ponto do
        ciclo; o padrão aparece nela como texto vazio. Um texto igual ao padrão não é customização, e não
        deixa rastro.

        *Capacidade: configurar as regras do atendimento · `NOSSO` (D29, D30). Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                exigirSolucaoAoResolver: { type: boolean }
                limiteDeCancelamentoDoSolicitante: { type: string, enum: [em_analise, em_atendimento] }
                diasParaParada:
                  type: integer
                  minimum: 1
                  maximum: 90
                  description: |
                    Quantos dias sem atividade até a ocorrência contar como parada. Fora da faixa, ou não
                    inteiro, é `400 VALOR_INVALIDO` antes do banco.
                rotulosDoSolicitante:
                  type: object
                  minProperties: 1
                  description: |
                    Mapa parcial do texto de quem abriu. Ponto do ciclo ausente **não é mexido**; `null`
                    ou texto em branco devolve aquele ao padrão.
                  properties:
                    aberta: { type: [string, "null"], maxLength: 40 }
                    em_analise: { type: [string, "null"], maxLength: 40 }
                    em_atendimento: { type: [string, "null"], maxLength: 40 }
                    pausada: { type: [string, "null"], maxLength: 40 }
                    resolvida: { type: [string, "null"], maxLength: 40 }
                    cancelada: { type: [string, "null"], maxLength: 40 }
            example: { exigirSolucaoAoResolver: true }
      responses:
        "200":
          description: A configuração depois da mudança, com a trilha atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Configuracao" }
              example:
                exigirSolucaoAoResolver: true
                limiteDeCancelamentoDoSolicitante: "em_analise"
                diasParaParada: 7
                rotulosDoSolicitante:
                  aberta: null
                  em_analise: "o síndico está avaliando"
                  em_atendimento: null
                  pausada: null
                  resolvida: null
                  cancelada: null
                mudancas:
                  - chave: "exigir_solucao_ao_resolver"
                    valorAnterior: "false"
                    valorNovo: "true"
                    autor: { pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f", nome: "Síndica do Recanto Azul" }
                    ocorridaEm: "2026-09-29T17:32:00Z"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /pedidos-de-entrada:
    post:
      tags: [Entrada na organização]
      operationId: pedirEntrada
      summary: Pedir entrada com o código público
      description: |
        Cria um **pedido de entrada** aguardando decisão do Gestor. **Nunca cria vínculo** — é o que faz
        *"código vazado não virar acesso, e sim um pedido aguardando aprovação"* (D25).

        **Não exige organização ativa** — o vínculo ainda não existe —, **e também não a recusa**: quem já
        está numa organização pede entrada em outra por aqui, que é o único caminho para o segundo vínculo
        da Persona 1B (contrato, §4.4). A resposta traz apenas o nome da
        organização — o código é público, mas isso não autoriza ler quem está lá dentro.

        *Capacidade: pedir entrada com o código, aguardando aprovação · `NOSSO` (D25).*
        *Sem comando correspondente no Event Storming — lacuna registrada (contrato, C-5).*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigoPublico]
              properties:
                codigoPublico:
                  type: string
                  pattern: "^[A-Z0-9]{6,12}$"
                  description: Sem minúscula e sem caractere ambíguo — ele é digitado à mão.
                nome: { type: string, maxLength: 120, description: "Preenche ou corrige o nome da Pessoa." }
                telefone:
                  type: string
                  maxLength: 20
                  description: |
                    **Em E.164** — `+5511999990000`. Vira o primeiro contato da Pessoa, com
                    `finalidade: pessoal`. É o único ponto do contrato em que um contato entra fora de
                    `/vinculos`, e ele existe porque **aqui ainda não há vínculo** (D25).
            example: { codigoPublico: "RECANTO7", nome: "Helena Rocha", telefone: "+5511999990000" }
      responses:
        "201":
          description: Pedido registrado, aguardando decisão do Gestor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoDeEntrada" }
              example:
                id: "5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9"
                organizacao: { nome: "Condomínio Recanto Azul" }
                situacao: "pendente"
                criadoEm: "2026-08-20T13:02:11Z"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404":
          description: Nenhuma organização com aquele código.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/codigo-publico-nao-encontrado"
                title: "Código não encontrado"
                status: 404
                detail: "Nenhuma organização usa este código."
                codigo: "CODIGO_PUBLICO_NAO_ENCONTRADO"
                traceId: "01JB8Z6K9T2M4N7Q"
        "409":
          description: Já existe vínculo ativo, ou já existe pedido pendente.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                jaVinculado:
                  value: { type: "https://resolveai.app/erros/ja-vinculado", title: "Você já está nesta organização", status: 409, codigo: "JA_VINCULADO", traceId: "01JB8Z6K9T2M4N7Q" }
                jaPendente:
                  value: { type: "https://resolveai.app/erros/pedido-de-entrada-pendente", title: "Pedido já enviado", status: 409, detail: "Seu pedido está aguardando a decisão do Gestor.", codigo: "PEDIDO_DE_ENTRADA_PENDENTE", traceId: "01JB8Z6K9T2M4N7Q" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    get:
      tags: [Entrada na organização]
      operationId: listarPedidosDeEntrada
      summary: Pedidos de entrada da organização
      description: |
        Lista os pedidos da organização ativa. É o modelo de leitura que precede `aprovar` e `recusar`.

        *Capacidade: Gestor aprova ou recusa o pedido de entrada · `NOSSO` (D25). Permissão: `vinculo.gerir`.*
      parameters:
        - name: situacao
          in: query
          description: Padrão — só os pendentes.
          schema:
            type: array
            items: { $ref: "#/components/schemas/SituacaoPedidoEntrada" }
            default: [pendente]
          style: form
          explode: false
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Pedidos.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/PedidoDeEntradaDetalhe" }
              example:
                itens:
                  - id: "5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9"
                    pessoa:
                      pessoaId: "2c9a1f30-4d5e-4a6b-8c7d-9e0f1a2b3c4d"
                      nome: "Helena Rocha"
                      contatos:
                        - { id: "dd44ee55-ff66-4a77-8b88-c99dd00ee11f", tipo: "email", valor: "302@exemplo.com", finalidade: "pessoal", temWhatsapp: false, ordem: 1, observacao: null }
                        - { id: "ee55ff66-aa77-4b88-8c99-d00ee11ff22a", tipo: "telefone", valor: "+5511999990000", finalidade: "pessoal", temWhatsapp: true, ordem: 2, observacao: null }
                    situacao: "pendente"
                    criadoEm: "2026-08-20T13:02:11Z"
                    decididoEm: null
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /convites/{codigo}:
    get:
      tags: [Entrada na organização]
      operationId: lerConvite
      summary: Ler o convite de uma organização
      description: |
        O que a página do convite mostra: o nome e o código da organização, e a situação de quem abre.

        **É a única operação que não exige sessão.** O código é a credencial, como no pedido de entrada:
        ele já circula em cartaz e mensagem, e o que ele abre é o nome da organização. Sem sessão, a
        resposta tem só o nome, o código e `situacao: sem-sessao`. Com sessão, a situação diz se a pessoa
        já participa, se já tem pedido pendente ou se pode pedir. Quem teve o vínculo revogado pode pedir,
        como qualquer pessoa.

        Código que nunca foi sorteado e código de organização apagada têm a mesma resposta.
      security:
        - {}
        - sessaoSupabase: []
        - bearerSupabase: []
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z0-9]{6,12}$" }
      responses:
        "200":
          description: O convite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Convite" }
              example:
                organizacao: { nome: "Condomínio Recanto Azul", codigoPublico: "RECANTO7" }
                situacao: "sem-sessao"
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "404":
          description: Nenhuma organização com aquele código.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/codigo-publico-nao-encontrado"
                title: "Código não encontrado"
                status: 404
                detail: "Nenhuma organização usa este código."
                codigo: "CODIGO_PUBLICO_NAO_ENCONTRADO"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /pedidos-de-entrada/{pedidoId}/aprovar:
    post:
      tags: [Entrada na organização]
      operationId: aprovarPedidoDeEntrada
      summary: Aprovar o pedido e criar o vínculo
      description: |
        Cria o **Vínculo** com o papel escolhido. É aqui que a invariante da D25 se fecha: *"o Vínculo só
        passa a existir com aprovação do Gestor"*.
        Quando a Pessoa já teve vínculo nesta organização e ele foi revogado, é o mesmo vínculo que volta a
        valer, com o papel e a unidade desta aprovação.

        *Capacidade: Gestor aprova ou recusa · `NOSSO` (D25). Permissão: `vinculo.gerir`.*
      parameters:
        - $ref: "#/components/parameters/PedidoId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [papel]
              properties:
                papel: { $ref: "#/components/schemas/PapelVinculo" }
                areaId:
                  type: [string, "null"]
                  format: uuid
                  description: |
                    A **unidade** desta pessoa nesta organização — o apartamento 302, a sala 14. Opcional, e
                    este é o **único momento em que ela pode ser informada para quem tem conta**: o `PATCH`
                    de vínculo recusa Pessoa com Usuário, e o morador sempre tem uma. Sem este campo,
                    `vinculos.area_id` seria preenchível apenas para quem **não** é morador — e ela existe
                    para descrever exatamente quem é. `422 AREA_INVALIDA` se a Área não for desta
                    organização ou estiver inativa.
            example: { papel: "solicitante", areaId: "0f9a4d71-3333-4b2c-9d3e-4f5a6b7c8d9e" }
      responses:
        "200":
          description: Pedido aprovado; vínculo criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vinculo" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/PedidoNaoEncontrado" }
        "409":
          description: Pedido já decidido, ou a Pessoa já tem vínculo ativo.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/pedido-ja-decidido", title: "Pedido já decidido", status: 409, codigo: "PEDIDO_JA_DECIDIDO", traceId: "01JB8Z6K9T2M4N7Q" }
        "422":
          description: A `areaId` informada não é Área desta organização, ou está inativa.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/area-invalida", title: "Área inválida", status: 422, detail: "Esta área não existe nesta organização ou está desativada.", codigo: "AREA_INVALIDA", traceId: "01JB8Z6K9T2M4N7Q" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /pedidos-de-entrada/{pedidoId}/recusar:
    post:
      tags: [Entrada na organização]
      operationId: recusarPedidoDeEntrada
      summary: Recusar o pedido
      description: |
        Marca o pedido como recusado. **Não cria nada.** Um pedido recusado pode ser refeito pela Pessoa —
        bloquear para sempre seria mais restritivo do que qualquer decisão registrada (suposição S-A12).

        *Capacidade: Gestor aprova ou recusa · `NOSSO` (D25). Permissão: `vinculo.gerir`.*
      parameters:
        - $ref: "#/components/parameters/PedidoId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                observacao:
                  type: string
                  maxLength: 500
                  description: |
                    O motivo da recusa, escrito pelo Gestor. **É guardado** em
                    `pedidos_de_entrada.observacao` — até 22/08/2026 este campo era aceito e **descartado**,
                    porque não havia coluna para ele. É a única explicação existente de por que alguém não
                    entrou; jogá-la fora produzia a pergunta que o produto veio eliminar.

                    **Mostrá-la a quem foi recusado é decisão de produto e ainda não foi tomada** —
                    `GET /contexto` devolve `situacao`, não o motivo.
            example: { observacao: "Não consta como morador na lista da administradora." }
      responses:
        "200":
          description: Pedido recusado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PedidoDeEntradaDetalhe" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/PedidoNaoEncontrado" }
        "409":
          description: Pedido já decidido.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /vinculos:
    get:
      tags: [Vínculos]
      operationId: listarVinculos
      summary: Quem está nesta organização
      description: |
        Lista os vínculos **ativos** da organização ativa, com a Pessoa embutida.

        **Este endpoint é o que substitui, de propósito, um `GET /pessoas` que não existe.** `pessoas` é
        tabela global, sem coluna de organização: uma listagem que partisse dela devolveria o cadastro do
        sistema inteiro. Aqui a consulta parte de `vinculos`, que já vem escopado, e faz `JOIN` para
        `pessoas` — nunca o contrário.

        **É também a lista de candidatos a responsável**, porque a atribuição aponta para *qualquer Pessoa
        com vínculo na organização* (D21). Não há — e não deve haver — endpoint de busca de pessoas.

        *Capacidade: cadastro de Encarregados · `NOSSO` (D27). Permissão: `vinculo.gerir`.*
        *Contato é dado pessoal sob o RNF10 e **só aparece aqui**, em nenhum outro endpoint do contrato.*
        *Telefone sai em **E.164** — é o formato que um link de WhatsApp consome sem tratamento.*
      parameters:
        - name: papel
          in: query
          description: Filtro opcional por papel.
          schema:
            type: array
            items: { $ref: "#/components/schemas/PapelVinculo" }
          style: form
          explode: false
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Vínculos ativos.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Vinculo" }
              example:
                itens:
                  - pessoa:
                      pessoaId: "9d3e2f81-0a1b-4c2d-8e3f-4a5b6c7d8e9f"
                      nome: "Antônio Ferreira"
                      contatos:
                        - { id: "aa11bb22-cc33-4d44-8e55-f66aa77bb88c", tipo: "telefone", valor: "+5511988881234", finalidade: "trabalho", temWhatsapp: true, ordem: 1, observacao: null }
                        - { id: "bb22cc33-dd44-4e55-8f66-a77bb88cc99d", tipo: "telefone", valor: "+5511933334444", finalidade: "recado", temWhatsapp: false, ordem: 2, observacao: "escritório da terceirizada" }
                    papel: "encarregado"
                    temConta: false
                    criadoEm: "2026-08-20T12:05:00Z"
                    atualizadoEm: null
                  - pessoa:
                      pessoaId: "8f14e45f-ceea-467a-9f1e-3a1b2c4d5e6f"
                      nome: "Síndica do Recanto Azul"
                      contatos:
                        - { id: "cc33dd44-ee55-4f66-8a77-b88cc99dd00e", tipo: "email", valor: "sindica@exemplo.com", finalidade: "trabalho", temWhatsapp: false, ordem: 1, observacao: null }
                    papel: "gestor"
                    temConta: true
                    criadoEm: "2026-08-20T12:00:00Z"
                    atualizadoEm: "2026-09-18T09:30:00Z"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    post:
      tags: [Vínculos]
      operationId: criarVinculo
      summary: Cadastrar Encarregado (ou pessoa sem conta)
      description: |
        Cria **Pessoa e Vínculo na mesma transação**. É o cadastro do Encarregado sem conta (D27) — o
        zelador que não usa celular existe como cadastro, recebe atribuições e aparece como responsável,
        mesmo sem nunca entrar no sistema.

        **Sempre cria uma Pessoa nova; nunca procura por e-mail.** Procurar exigiria consultar `pessoas`
        globalmente — a consulta proibida — e a resposta vazaria a existência de um cadastro em outra
        organização. O custo (linhas duplicadas para o mesmo ser humano em organizações diferentes) é
        coerente com o modelo, que **não** impõe unicidade global de e-mail em `contatos`.

        *Capacidade: cadastro de Encarregados, sem conta · `NOSSO` (D27). Comando: `Cadastrar pessoa`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, papel]
              properties:
                nome: { type: string, minLength: 1, maxLength: 120 }
                papel: { $ref: "#/components/schemas/PapelVinculo" }
                areaId:
                  type: [string, "null"]
                  format: uuid
                  description: |
                    A **unidade** desta pessoa nesta organização — o apartamento 302, a sala 14. Anulável:
                    Gestor e Encarregado terceirizado não têm unidade. Precisa ser uma Área **desta**
                    organização, senão `422 AREA_INVALIDA`.
                contatos:
                  type: array
                  description: |
                    Como alcançar esta pessoa. Contato **não** é credencial: os dois podem divergir, e nem
                    o e-mail nem o telefone são únicos — dois Encarregados de uma terceirizada podem
                    compartilhar o e-mail do escritório.
                  items: { $ref: "#/components/schemas/ContatoParaEscrita" }
            example:
              nome: "Antônio Ferreira"
              papel: "encarregado"
              contatos:
                - { tipo: "telefone", valor: "+5511988881234", finalidade: "trabalho", temWhatsapp: true, ordem: 1 }
                - { tipo: "telefone", valor: "+5511933334444", finalidade: "recado", ordem: 2, observacao: "escritório da terceirizada" }
      responses:
        "201":
          description: Pessoa e vínculo criados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vinculo" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /vinculos/{pessoaId}:
    patch:
      tags: [Vínculos]
      operationId: atualizarPessoaDoVinculo
      summary: Corrigir os dados de uma pessoa sem conta
      description: |
        Atualiza nome, unidade e contatos da Pessoa **através do vínculo** — nunca por um
        endereço global de Pessoa.

        **`contatos` é substituição, não mesclagem.** Enviar a lista troca os contatos daquela Pessoa por
        ela; enviar `[]` remove todos; **omitir o campo não mexe em nada**. A alternativa — endpoints
        próprios de contato — criaria três operações novas para gerir o que cabe no corpo do vínculo, e
        contato não é recurso do domínio: é atributo de uma Pessoa que só existe dentro de uma organização.

        **Só é aceito quando a Pessoa não tem Usuário.** `pessoas` é global: editar quem tem conta
        alteraria o cadastro daquela pessoa **em todas as outras organizações**, inclusive naquela em que
        ela é Gestora. Quem tem conta edita os próprios dados.

        **`papel` não é alterável aqui** — promover alguém a Gestor não é capacidade desta entrega.

        *Capacidade: cadastro de Encarregados (o **U** do CRUD) · `NOSSO` (D27). Permissão: `vinculo.gerir`.*
      parameters:
        - $ref: "#/components/parameters/PessoaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 120 }
                areaId: { type: [string, "null"], format: uuid }
                contatos:
                  type: array
                  description: '**Substitui** a lista inteira. `[]` remove todos; omitir não mexe.'
                  items: { $ref: "#/components/schemas/ContatoParaEscrita" }
            example:
              contatos:
                - { tipo: "telefone", valor: "+5511988884321", finalidade: "trabalho", temWhatsapp: true, ordem: 1 }
      responses:
        "200":
          description: Dados atualizados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vinculo" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Não há vínculo com esta Pessoa nesta organização.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/vinculo-nao-encontrado", title: "Vínculo não encontrado", status: 404, codigo: "VINCULO_NAO_ENCONTRADO", traceId: "01JB8Z6K9T2M4N7Q" }
        "409":
          description: A Pessoa tem Usuário — o cadastro dela vale em outras organizações.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/pessoa-com-conta-nao-editavel"
                title: "Esta pessoa tem conta"
                status: 409
                detail: "Quem tem conta edita os próprios dados; o cadastro vale em outras organizações."
                codigo: "PESSOA_COM_CONTA_NAO_EDITAVEL"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

    delete:
      tags: [Vínculos]
      operationId: removerVinculo
      summary: Remover um vínculo que ainda não tem histórico
      description: |
        Desfaz um vínculo criado com o **papel errado** — por aprovação de pedido de entrada ou por
        cadastro direto. É um dos **dois `DELETE` do contrato**, e a licença é estreita de propósito: o
        outro desfaz um compartilhamento, que não tem histórico nenhum a preservar.

        **Só remove vínculo sem nenhuma linha dependente.** Se a pessoa já registrou ocorrência, foi
        responsável, escreveu mensagem ou autorou uma transição, a resposta é `409
        VINCULO_COM_HISTORICO`. Essa recusa **não é uma verificação da aplicação**: é o
        `ON DELETE RESTRICT` do esquema, que já impede apagar o que tem dependente. O endpoint traduz a
        recusa do banco. Um vínculo sem dependente é exatamente o caso em que não há histórico a
        preservar — e é por isso que a exceção ao princípio *"nada é apagado"* cabe aqui e em nenhum
        outro lugar.

        **Não remove o último Gestor.** Sem essa guarda, o Gestor inicial de uma organização recém-criada
        — que por definição ainda não tem histórico — poderia remover a si mesmo e deixar a organização
        sem ninguém capaz de aprovar qualquer entrada. É a única regra deste endpoint que o banco não
        garante.

        A **Pessoa permanece**: ela é global e nunca se apaga por aqui. Depois da remoção, um novo pedido
        de entrada é aceito, agora com o papel certo.

        Para encerrar o acesso de quem **tem** histórico a operação é outra, `revogarVinculo`, e ela
        preserva o registro.

        *Capacidade: remover vínculo sem histórico · `NOSSO` (D25, PA-25). Permissão: `vinculo.gerir`.*
      parameters:
        - $ref: "#/components/parameters/PessoaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "204":
          description: Vínculo removido. A Pessoa permanece, e um novo pedido de entrada passa a ser aceito.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Não há vínculo com esta Pessoa nesta organização.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/vinculo-nao-encontrado", title: "Vínculo não encontrado", status: 404, codigo: "VINCULO_NAO_ENCONTRADO", traceId: "01JB8Z6K9T2M4N7Q" }
        "409":
          description: |
            O vínculo tem histórico, ou é o último com permissão de gerir.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              examples:
                comHistorico:
                  summary: A pessoa já deixou rastro na organização
                  value:
                    type: "https://resolveai.app/erros/vinculo-com-historico"
                    title: "Este vínculo já tem histórico"
                    status: 409
                    detail: "A pessoa já deixou rastro nesta organização, e o vínculo não pode ser apagado. Para encerrar o acesso dela, revogue o vínculo."
                    codigo: "VINCULO_COM_HISTORICO"
                    traceId: "01JB8Z6K9T2M4N7Q"
                ultimoGestor:
                  summary: É o último Gestor da organização
                  value:
                    type: "https://resolveai.app/erros/ultimo-gestor"
                    title: "Esta organização ficaria sem Gestor"
                    status: 409
                    detail: "Aprove outra pessoa como Gestor antes de remover este vínculo."
                    codigo: "ULTIMO_GESTOR"
                    traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /vinculos/{pessoaId}/revogar:
    post:
      tags: [Vínculos]
      operationId: revogarVinculo
      summary: Encerrar o acesso de quem já deixou rastro
      description: |
        Encerra o acesso de uma pessoa à organização **preservando o registro**. O vínculo não é apagado:
        ele fica revogado, sai de toda listagem de gente e da resolução de contexto, e continua nomeando a
        pessoa na trilha de auditoria, na linha do tempo e nas ocorrências que ela registrou.

        É o caminho para quem **tem** histórico, que `removerVinculo` recusa com `409
        VINCULO_COM_HISTORICO`. **A linha fica**: revogar é um `PATCH`, e por isso o compartilhamento que a
        pessoa recebeu sobrevive à revogação e volta a valer na readmissão.

        **Não revoga o último Gestor**, pela mesma razão e com a mesma resposta do `DELETE`.

        **Revogado não é definitivo.** Quem tem conta pode pedir entrada de novo; aprovado o pedido, o
        mesmo vínculo volta a valer, com o papel e a unidade da nova aprovação.

        As atribuições vigentes em que a pessoa é responsável continuam vigentes. Reatribuir é
        `atribuirResponsavel`.

        *Capacidade: encerrar o acesso preservando o registro. Permissão: `vinculo.gerir`.*
      parameters:
        - $ref: "#/components/parameters/PessoaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "204":
          description: Acesso encerrado. O vínculo continua existindo, revogado.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Não há vínculo ativo com esta Pessoa nesta organização, inclusive quando ele já foi revogado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example: { type: "https://resolveai.app/erros/vinculo-nao-encontrado", title: "Vínculo não encontrado", status: 404, codigo: "VINCULO_NAO_ENCONTRADO", traceId: "01JB8Z6K9T2M4N7Q" }
        "409":
          description: É o último vínculo com permissão de gerir.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
              example:
                type: "https://resolveai.app/erros/ultimo-gestor"
                title: "Esta organização ficaria sem Gestor"
                status: 409
                detail: "Aprove outra pessoa como Gestor antes de remover este vínculo."
                codigo: "ULTIMO_GESTOR"
                traceId: "01JB8Z6K9T2M4N7Q"
        "500": { $ref: "#/components/responses/ErroInterno" }

  /categorias:
    get:
      tags: [Configuração]
      operationId: listarCategorias
      summary: Categorias da organização
      description: |
        Lista as categorias. É a leitura que precede o registro de ocorrência — e é onde se confirma que a
        **semente das sete categorias do desafio** foi criada junto com a organização (POL-01).

        *Capacidade: editar categorias · `ENUNCIADO · aberto`. Qualquer vínculo ativo pode ler.*
      parameters:
        - name: ativa
          in: query
          description: Padrão — só as ativas. O formulário de registro nunca oferece categoria desativada.
          schema: { type: boolean, default: true }
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      responses:
        "200":
          description: Categorias, na ordem definida pelo Gestor.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Categoria" }
              example:
                itens:
                  - { id: "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d", nome: "Problemas de iluminação", ativa: true, ordem: 1, icone: "lightbulb" }
                  - { id: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d", nome: "Vazamentos", ativa: true, ordem: 5, icone: "droplets" }
                  - { id: "6b1c8f2e-3333-4a2b-8c3d-4e5f6a7b8c9d", nome: "Limpeza", ativa: true, ordem: 3 }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemOrganizacaoAtiva" }
        "409": { $ref: "#/components/responses/OrganizacaoDivergente" }
        "500": { $ref: "#/components/responses/ErroInterno" }

    post:
      tags: [Configuração]
      operationId: criarCategoria
      summary: Criar categoria
      description: |
        *Capacidade: editar categorias · `ENUNCIADO · aberto` (o desafio dá sete exemplos e autoriza
        "outras situações definidas pelo grupo"). Comando: `Criar categoria`. Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string, minLength: 1, maxLength: 60 }
                icone: { $ref: "#/components/schemas/IconeCategoria" }
            example: { nome: "Jardinagem", icone: "trees" }
      responses:
        "201":
          description: Categoria criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/NomeDuplicado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /categorias/{categoriaId}:
    patch:
      tags: [Configuração]
      operationId: atualizarCategoria
      summary: Renomear, reordenar ou desativar categoria
      description: |
        **`ativa: false` é como uma categoria sai de uso — não há exclusão.** Categoria usada por ocorrência
        antiga não pode sumir sem destruir o histórico, e a chave estrangeira é `RESTRICT`.

        Este é um dos dois lugares do contrato em que `PATCH` existe. O critério: *campo governado por
        máquina de estados, ou que obrigue a gravar registro de transição, muda por comando nomeado; o
        resto é `PATCH`.* Nenhum campo aqui tem estado anterior a validar.

        *Capacidade: editar categorias · `ENUNCIADO · aberto`. Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/CategoriaId"
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 60 }
                ativa: { type: boolean }
                icone: { $ref: "#/components/schemas/IconeCategoria" }
            example: { icone: "droplets" }
      responses:
        "200":
          description: Categoria atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404": { $ref: "#/components/responses/CategoriaNaoEncontrada" }
        "409": { $ref: "#/components/responses/NomeDuplicado" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /categorias/ordem:
    put:
      tags: [Configuração]
      operationId: reordenarCategorias
      summary: Reordenar as categorias, a lista inteira de uma vez
      description: |
        Recebe **a lista inteira** das categorias da organização, ativas e inativas, na ordem nova. Numa
        transação só, a categoria na posição *i* recebe `ordem = i`, de 1 a *n*; se qualquer passo falhar,
        nada muda. Só as linhas que mudaram de posição recebem `atualizado_em` e o autor da alteração, e
        uma reordenação que não muda nada não grava linha.

        **O conjunto tem de ser o atual.** Faltando item, sobrando item, ou com id de outra organização ou
        inexistente, a resposta é `409 LISTA_DESATUALIZADA`, igual nos quatro casos. O caso comum é outro
        Gestor ter criado uma categoria depois da leitura, e o cliente recarrega a lista com
        `GET /categorias?ativa=false`. Lista vazia, mais de 999 itens e id repetido são forma, e respondem
        `400`.

        Duas reordenações simultâneas não se misturam: a segunda espera a primeira e vence inteira.

        *Capacidade: editar categorias. Permissão: `organizacao.configurar`.*
      parameters:
        - $ref: "#/components/parameters/OrganizacaoAfirmada"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reordenacao" }
            example:
              ids:
                - "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d"
                - "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d"
                - "6b1c8f2e-3333-4a2b-8c3d-4e5f6a7b8c9d"
      responses:
        "200":
          description: A lista inteira, na ordem nova, na forma de `GET /categorias?ativa=false`.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Categoria" }
              example:
                itens:
                  - { id: "6b1c8f2e-2222-4a2b-8c3d-4e5f6a7b8c9d", nome: "Vazamentos", ativa: true, ordem: 1, icone: "droplets" }
                  - { id: "6b1c8f2e-1111-4a2b-8c3d-4e5f6a7b8c9d", nome: "Problemas de iluminação", ativa: true, ordem: 2, icone: "lightbulb" }
                  - { id: "6b1c8f2e-3333-4a2b-8c3d-4e5f6a7b8c9d", nome: "Limpeza", ativa: false, ordem: 3, icone: "tag" }
        "400": { $ref: "#/components/responses/FormatoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "409": { $ref: "#/components/responses/ListaDesatualizada" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  /areas:
